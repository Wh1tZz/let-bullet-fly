<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>让子弹飞一会儿</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #26180e;
    --paper: #f2cf87;
    --gold: #e8b44d;
    --red: #b83a28;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #f4d089; color: #f5e6c8;
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden; user-select: none;
  }
  canvas {
    display: block; width: 100vw; height: 100vh;
    background: #f4d089; cursor: crosshair; touch-action: none;
  }
  #hud {
    position: fixed; top: 14px; left: 14px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    pointer-events: none; z-index: 10;
  }
  .hud-gun {
    position: relative; width: 132px; height: 50px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .hud-rifle-stock, .hud-rifle-receiver, .hud-rifle-barrel,
  .hud-rifle-highlight, .hud-rifle-muzzle, .hud-rifle-sight,
  .hud-rifle-trigger { position: absolute; display: block; box-sizing: border-box; }
  .hud-rifle-stock {
    left: 3px; top: 19px; width: 55px; height: 21px;
    background: #5b3219; border: 2px solid #24150c;
    clip-path: polygon(0 28%, 18% 0, 88% 5%, 100% 42%, 82% 68%, 32% 72%, 13% 100%, 0 82%);
  }
  .hud-rifle-stock::after {
    content: ""; position: absolute; left: 14px; top: 4px; width: 31px; height: 2px;
    background: rgba(221,155,83,.56); transform: rotate(1deg);
  }
  .hud-rifle-receiver {
    left: 49px; top: 18px; width: 22px; height: 13px;
    background: #2a2c2d; border: 2px solid #090a0a; border-radius: 2px;
  }
  .hud-rifle-barrel {
    left: 68px; top: 21px; width: 58px; height: 6px;
    background: #17191a; border: 1.5px solid #090a0a;
  }
  .hud-rifle-highlight {
    left: 72px; top: 22px; width: 50px; height: 1.5px; background: #65696a;
  }
  .hud-rifle-muzzle {
    left: 124px; top: 19px; width: 5px; height: 10px;
    background: #111; border: 1px solid #000;
  }
  .hud-rifle-sight {
    left: 118px; top: 17px; width: 3px; height: 5px; background: #0a0a0a;
  }
  .hud-rifle-trigger {
    left: 49px; top: 29px; width: 12px; height: 8px;
    border: 2px solid #151515; border-top: 0; border-radius: 0 0 9px 9px;
  }
  .hud-bullets {
    display: flex; gap: 4px; align-items: center; margin-left: 2px;
  }
  .bullet {
    width: 22px; height: 10px;
    background: linear-gradient(180deg, #f4d896 0%, #d9b260 35%, #c89848 100%);
    border-radius: 1px 4px 4px 1px;
    border: 1.5px solid #1a1a1a;
    position: relative;
    box-shadow: 0 2px 3px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  .bullet::before {
    content: ''; position: absolute; left: 0; top: 0;
    width: 7px; height: 100%;
    background: linear-gradient(180deg, #e8e8e8, #909090 50%, #707070 100%);
    border-radius: 1px 0 0 1px;
    border-right: 1px solid #1a1a1a;
  }
  .bullet::after {
    content: ''; position: absolute; left: 2px; top: 1px;
    width: 2px; height: 2px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
  }
  .bullet.fired {
    opacity: 0;
    transform: translateX(28px) scale(0.5) rotate(8deg);
  }
  #restartBtn {
    margin-top: 7px; padding: 6px 10px; border: 1px solid rgba(232,180,77,.55);
    border-radius: 5px; background: #5c291d; color: #fff4d3; cursor: pointer;
    font: inherit;
  }
  #tip {
    position: fixed; left: 50%; top: 72px; transform: translateX(-50%);
    color: #3a1f12; background: rgba(255,241,197,.92); border: 1px solid rgba(92,41,29,.35);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity .18s ease; pointer-events: none; z-index: 11;
  }
  #tip.show { opacity: 1; }
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(20,12,8,0.72); color: #fff;
    flex-direction: column; gap: 16px; z-index: 20;
  }
  #overlay.show { display: flex; }
  #overlay button {
    padding: 10px 24px; font-size: 16px; cursor: pointer;
    background: #d96f32; color: #fff; border: none; border-radius: 4px;
  }
  #startGate {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, rgba(246,223,160,0.18), rgba(28,17,10,0.70));
    backdrop-filter: blur(2px);
    transition: opacity .22s ease, visibility .22s ease;
  }
  #startGate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #startGameBtn {
    width: 88px; height: 88px; padding: 0; border: 2px solid rgba(255,244,208,0.88);
    border-radius: 50%; cursor: pointer; background: rgba(238,184,81,0.92);
    box-shadow: 0 12px 34px rgba(38,20,7,0.42), inset 0 2px 0 rgba(255,255,255,0.38);
    display: grid; place-items: center;
  }
  #startGameBtn::before {
    content: ''; width: 0; height: 0; margin-left: 7px;
    border-top: 16px solid transparent; border-bottom: 16px solid transparent;
    border-left: 25px solid #3c2516;
  }
  #startGameBtn:hover { transform: scale(1.05); }
  #startGameBtn:active { transform: scale(0.97); }
  #startGameBtn:focus-visible { outline: 3px solid #fff3bf; outline-offset: 5px; }
  @media (max-width: 760px) {
    #hud { right: 14px; font-size: 12px; }
    #tip { top: 98px; max-width: calc(100vw - 48px); text-align: center; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-gun" role="img" aria-label="主角当前武器：长步枪">
    <span class="hud-rifle-stock"></span>
    <span class="hud-rifle-receiver"></span>
    <span class="hud-rifle-barrel"></span>
    <span class="hud-rifle-highlight"></span>
    <span class="hud-rifle-muzzle"></span>
    <span class="hud-rifle-sight"></span>
    <span class="hud-rifle-trigger"></span>
  </div>
  <div class="hud-bullets" id="bulletsContainer">
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
    <div class="bullet"></div>
  </div>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<canvas id="game"></canvas>
<div id="startGate">
  <button id="startGameBtn" type="button" aria-label="开始游戏"></button>
</div>
<div id="overlay">
  <h2 id="msg">关卡结束</h2>
  <button id="restartBtn" type="button" onclick="restart()">重新挑战</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
(() => {
  const M = Matter;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const overlay = document.getElementById('overlay');

  // ====== 闊抽绯荤粺(鐪熷疄 MP3 绱犳潗 + Web Audio API 鍚堟垚 fallback) ======
  // - 鎴樻枟鍙嶉闊虫晥浣跨敤鏈湴鍖栫殑 Mixkit / SoundDino 绱犳潗
  // - 棣栧皠淇濈暀鐢ㄦ埛鍘熷０ "璁╁瓙寮归涓€浼氬効"(let_bullets_fly.mp3)
  // - 鍚屾椂鏀寔 file:// 鏈湴鎵撳紑涓?http(s) 鏈嶅姟鍣ㄩ瑙?
  const AudioFX = {
    ctx: null,         // AudioContext(鐢ㄦ埛棣栨鐐瑰嚮鏃跺垱寤?
    master: null,      // 涓诲鐩?
    firstShotPlayed: false,  // 鏍囪棣栧皠鏄惁宸叉斁杩?
    voiceAudio: null,  // HTML5 Audio 鍏冪礌(棣栧皠鍘熷０,鏋０ + "璁╁瓙寮归涓€浼氬効")
    gunshotAudio: null,  // HTML5 Audio 鍏冪礌(鍚庣画寮€鐏?鐢ㄦ埛瑁佸壀鐨勭函鏋０)
    bgmAudio: null,  // 鑳屾櫙闊充箰(Funky House 寰幆)
    muted: false,
    sampleFiles: {
      voice: 'let_bullets_fly_loud.mp3',
      gunshot: 'gunshot.mp3',
      ricochet: 'bullet_ricochet_sounddino.mp3',
      explosion: 'dynamite_explosion_mixkit.mp3',
      screamBandit: 'enemy_hit_mixkit.mp3',
      screamSoldier: 'soldier_hit_mixkit.mp3',
      screamMerchant: 'merchant_hit_mixkit.mp3',
      coin: 'merchant_coins_mixkit.mp3',
      hammer: 'hammer_impact_mixkit.mp3',
    },
    sampleAudios: {},
    samplesPrepared: false,
    // 鐪熷疄 MP3 buffer 姹?鎯ㄥ彨/鐖嗙偢/寮瑰弽/閲戝竵/閾侀敜 鈥?鏋０淇濈暀鐢ㄦ埛鍘熺増)
    buffers: {
      voice: null, gunshot: null,
      ricochet: null, explosion: null,
      screamBandit: null, screamSoldier: null, screamMerchant: null,
      coin: null, hammer: null,
    },
    loaded: {
      voice: false, gunshot: false,
      ricochet: false, explosion: false,
      screamBandit: false, screamSoldier: false, screamMerchant: false,
      coin: false, hammer: false,
    },

    // 鍒濆鍖?鈥?蹇呴』鍦ㄧ敤鎴蜂氦浜掑悗璋冪敤
    init() {
      this._prepareSamples();
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        return;
      }
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        // 寮哄埗 resume:Chrome 鏀跨瓥瑕佹眰鐢ㄦ埛鎵嬪娍鍚庢墠鑳芥挱鏀?
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(e => console.warn('[AudioFX] resume failed:', e));
        }
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.70;
        this.master.connect(this.ctx.destination);
        // 鍑嗗棣栧皠鍘熷０(瀹屾暣鐗?淇濈暀"璁╁瓙寮归涓€浼氬効"鐏甸瓊)
        this.voiceAudio = new Audio('assets/let_bullets_fly_loud.mp3');
        this.voiceAudio.preload = 'auto';
        this.voiceAudio.volume = 1.0;
        // 鍑嗗鍚庣画寮€鐏０(鐢ㄦ埛瑁佸壀鐨勭函鏋０)
        this.gunshotAudio = new Audio('assets/gunshot.mp3');
        this.gunshotAudio.preload = 'auto';
        this.gunshotAudio.volume = 0.85;
        // 鑳屾櫙闊充箰(Funky House 寰幆, 浣庨煶涓嶆抢鎴?
        this.bgmAudio = new Audio('assets/bgm_electronic_house_novocal.mp3');
        this.bgmAudio.loop = true;
        this.bgmAudio.preload = 'auto';
        this.bgmAudio.volume = 0.06;
        this.bgmAudio.muted = false;
        this._bgmBaseVolume = 0.06;
        // 寮傛棰勫姞杞界湡瀹?MP3 鈫?AudioBuffer(鎯ㄥ彨/鐖嗙偢/寮瑰弽/閲戝竵/閾侀敜)
        // 鐢??t= 鏃堕棿鎴抽槻姝㈡祻瑙堝櫒缂撳瓨鏃х増 MP3
        const base = 'assets/';
        const ts = '?t=' + Date.now();
        const targets = Object.entries(this.sampleFiles);
        for (const [key, file] of targets) {
          // file:// 椤甸潰涓嶅厑璁?fetch 鏈湴鏂囦欢锛涜繖绉嶆ā寮忕敱 HTMLAudioElement 鐩存帴鎾斁銆?
          if (location.protocol === 'file:') continue;
          fetch(base + file + ts)
            .then(r => {
              if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + file);
              return r.arrayBuffer();
            })
            .then(ab => this.ctx.decodeAudioData(ab))
            .then(buf => { this.buffers[key] = buf; this.loaded[key] = true; console.log('[AudioFX] loaded', file); })
            .catch(e => {
              console.warn('[AudioFX] failed to load', file, e);
              this.loaded[key] = false;
            });
        }
      } catch (e) {
        console.warn('[AudioFX] init failed:', e);
      }
    },

    // HTMLAudioElement 鍙洿鎺ヨ鍙栧悓鐩綍绱犳潗锛屽吋瀹瑰弻鍑?index.html 鐨?file:// 妯″紡銆?
    _prepareSamples() {
      if (this.samplesPrepared) return;
      this.samplesPrepared = true;
      for (const [key, file] of Object.entries(this.sampleFiles)) {
        const audio = new Audio('assets/' + file);
        audio.preload = 'auto';
        audio.load();
        this.sampleAudios[key] = audio;
      }
    },

    _playElement(name, vol, rate, offset) {
      this._prepareSamples();
      const template = this.sampleAudios[name];
      if (!template) return false;
      try {
        const audio = template.cloneNode(true);
        audio.volume = Math.max(0, Math.min(1, vol != null ? vol : 1));
        audio.playbackRate = rate != null ? rate : 1;
        audio.preservesPitch = false;
        if (offset) audio.currentTime = offset;
        audio.play().catch(e => console.warn('[AudioFX] element play failed:', name, e));
        return true;
      } catch (e) {
        console.warn('[AudioFX] element setup failed:', name, e);
        return false;
      }
    },

    // 閫氱敤:鏈嶅姟鍣ㄦā寮忎紭鍏堟挱鏀?AudioBuffer锛涙湰鍦版ā寮忔敼鐢?HTMLAudioElement銆?
    _playBuffer(name, vol, rate, offset) {
      const buf = this.buffers[name];
      if (!this.ctx || !buf || !this.loaded[name]) {
        return this._playElement(name, vol, rate, offset);
      }
      // Chrome 绛栫暐:AudioContext 鍙兘 suspended,闇€瑕?resume 鍚?start() 鎵嶇敓鏁?
      if (this.ctx.state === 'suspended') {
        try { this.ctx.resume(); } catch (e) {}
      }
      try {
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = rate != null ? rate : 1.0;
        const g = this.ctx.createGain();
        g.gain.value = vol != null ? vol : 1.0;
        src.connect(g).connect(this.master);
        src.start(this.ctx.currentTime, offset || 0);
        return true;
      } catch (e) {
        return this._playElement(name, vol, rate, offset);
      }
    },

    // 宸ュ叿:浜х敓涓€娈电櫧鍣煶婧?宸插寘缁?鑷姩 stop)
    noise(dur, freq, type, q) {
      const c = this.ctx;
      const sr = c.sampleRate;
      const len = Math.max(1, Math.floor(sr * dur));
      const buf = c.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource();
      src.buffer = buf;
      if (freq) {
        const filt = c.createBiquadFilter();
        filt.type = type || 'lowpass';
        filt.frequency.value = freq;
        if (q) filt.Q.value = q;
        src.connect(filt);
        return { src, out: filt };
      }
      return { src, out: src };
    },

    // 宸ュ叿:鍖呯粶(鎸囨暟琛板噺)
    envGain(peak, t, attack, decay) {
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
      return g;
    },

    // ====== 鍚勭被闊虫晥 ======

    // 0) 鑳屾櫙闊充箰(寰幆鎾斁, 浣庨煶涓嶆抢鎴?br>
    bgm(audible = true) {
      if (!this.bgmAudio) return;
      this.bgmAudio.muted = !audible;
      this.bgmAudio.play().catch(() => {
        // Audible autoplay is commonly blocked. Start muted so playback is
        // already running, then shoot()/unlockAudio() can unmute it.
        if (audible && this.bgmAudio) {
          this.bgmAudio.muted = true;
          this.bgmAudio.play().catch(() => {});
        }
      });
    },
    // 鍋滄鑳屾櫙闊充箰(閬垮厤 BGM 涓庢父鎴忕粨鏉熸笎鏃朵簨浠跺啿绐?
    bgmStop() {
      if (this.bgmAudio) { this.bgmAudio.pause(); this.bgmAudio.currentTime = 0; }
    },

    // 1) 鏅€氬紑鐏?鐢ㄧ敤鎴疯鍓繃鐨勫師澹?MP3(绾灙澹?;鍔犺浇澶辫触閫€鍒板悎鎴?
    gunshot() {
      if (this.loaded.gunshot && this.buffers.gunshot) {
        this._playBuffer('gunshot', 1.25, 1.0);
        return;
      }
      if (this.gunshotAudio) {
        try {
          this.gunshotAudio.currentTime = 0;
          this.gunshotAudio.play().catch(() => this._synthGunshot());
          return;
        } catch (e) { /* fall through */ }
      }
      this._synthGunshot();
    },
    // 鍚堟垚鐗堝紑鐏?鍚庡)
    _synthGunshot() {
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.10);
      const g = this.envGain(0.55, t, 0.005, 0.18);
      osc.connect(g).connect(this.master);
      osc.start(t); osc.stop(t + 0.20);
      const n = this.noise(0.18, 1800, 'lowpass', 0.7);
      const ng = this.envGain(0.40, t, 0.003, 0.16);
      n.src.connect(n.out).connect(ng).connect(this.master);
      n.src.start(t);
      const c2 = this.noise(0.03, 6000, 'highpass');
      const cg = this.envGain(0.25, t, 0.001, 0.04);
      c2.src.connect(c2.out).connect(cg).connect(this.master);
      c2.src.start(t);
    },

    // 2) 棣栧皠:鐢ㄧ敤鎴锋彁渚涚殑鍘熷０ MP3(鏋０ + 濮滄枃"璁╁瓙寮归涓€浼氬効")
    firstShot() {
      if (!this.ctx) this.init();
      if (!this.voiceAudio) return;
      if (this.firstShotPlayed) { this.gunshot(); return; }
      this.firstShotPlayed = true;
      // Ducking: 棣栧皠鐬枡 BGM 0.18 鈫?0.05, 1.5s 鍚庢參鎭㈠, 璁?璁╁瓙寮归涓€浼気 鍘熷０娓呭嚭鍦哄瓙
      if (this.bgmAudio && !this.bgmAudio.paused) {
        this.bgmAudio.volume = 0.008;
        setTimeout(() => {
          if (this.bgmAudio) this.bgmAudio.volume = this._bgmBaseVolume;
        }, 2200);
      }
      try {
        if (this.loaded.voice && this.buffers.voice) {
          this._playBuffer('voice', 1.0, 1.0);
          return;
        }
        this.voiceAudio.currentTime = 0;
        this.voiceAudio.play().catch(e => { console.warn('[AudioFX] voice play failed:', e); this.gunshot(); });
      } catch (e) {
        this.gunshot();
      }
    },

    // 3) 瀛愬脊鍙嶅脊:浼樺厛鐪熷疄"瀛愬脊鍑讳腑閲戝睘"褰曢煶(ricochet_real.mp3),澶辫触 fallback 鍚堟垚
    ricochet() {
      if (this._playBuffer('ricochet', 0.76, 0.94 + Math.random() * 0.12)) return;
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      // 鐭績閲戝睘 click + 婊戦煶
      const click = this.noise(0.015, 7000, 'highpass');
      const cg = this.envGain(0.28, t, 0.001, 0.025);
      click.src.connect(click.out).connect(cg).connect(this.master);
      click.src.start(t);
      const main = c.createOscillator();
      main.type = 'sine'; main.frequency.setValueAtTime(3200, t);
      main.frequency.exponentialRampToValueAtTime(2800, t + 0.10);
      const mainG = this.envGain(0.32, t, 0.001, 0.14);
      main.connect(mainG).connect(this.master);
      main.start(t); main.stop(t + 0.18);
      const slide = c.createOscillator();
      slide.type = 'sawtooth';
      slide.frequency.setValueAtTime(2200, t + 0.02);
      slide.frequency.exponentialRampToValueAtTime(900, t + 0.18);
      const sg = this.envGain(0.10, t + 0.02, 0.005, 0.16);
      slide.connect(sg).connect(this.master);

    },

    // 4) 鐖嗙偢:鐭垎澹?+ 鐙珛浣庨鍐插嚮灞傦紝淇濈暀鍔涘害浣嗗揩閫熸敹灏俱€?
    explosion() {
      const realPlayed = this._playBuffer('explosion', 1.0, 1.02 + Math.random() * 0.06);
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      // 浣庨鍏堢灛闂撮《鍑猴紝鍐嶅揩閫熶笅鍧狅紝妯℃嫙鐐歌嵂妗惰繎璺濈绌烘皵鍐插嚮銆?
      const sub = c.createOscillator();
      sub.type = 'sine'; sub.frequency.setValueAtTime(105, t);
      sub.frequency.exponentialRampToValueAtTime(28, t + 0.34);
      const subG = this.envGain(1.0, t, 0.002, 0.38);
      sub.connect(subG).connect(this.master);
      sub.start(t); sub.stop(t + 0.42);

      // 55Hz 鑳稿彛鍐插嚮灞傦紝姣斿崟绾彁楂橀煶閲忔洿鏈夆€滅偢瑁傗€濇劅銆?
      const pressure = c.createOscillator();
      pressure.type = 'triangle';
      pressure.frequency.setValueAtTime(58, t);
      pressure.frequency.exponentialRampToValueAtTime(34, t + 0.24);
      const pressureG = this.envGain(0.72, t, 0.001, 0.27);
      pressure.connect(pressureG).connect(this.master);
      pressure.start(t); pressure.stop(t + 0.31);

      // 鐪熷疄绱犳潗宸茬粡鍖呭惈涓讳綋鏃跺彧琛ラ€傞噺纰庤鍣０锛涘姞杞藉け璐ユ椂鐢辫繖閲屾壙鎷呭畬鏁寸垎鐐搞€?
      const blast = this.noise(0.38, 1450, 'lowpass');
      const blastG = this.envGain(realPlayed ? 0.38 : 0.98, t, 0.001, 0.34);
      blast.src.connect(blast.out).connect(blastG).connect(this.master);
      blast.src.start(t);

      const crack = this.noise(0.075, 5200, 'highpass');
      const crackG = this.envGain(0.72, t, 0.001, 0.085);
      crack.src.connect(crack.out).connect(crackG).connect(this.master);
      crack.src.start(t);

      const crash = this.noise(0.30, 3600, 'bandpass', 0.55);
      const crashG = this.envGain(realPlayed ? 0.34 : 0.60, t + 0.018, 0.002, 0.26);
      crash.src.connect(crash.out).connect(crashG).connect(this.master);
      crash.src.start(t + 0.018);
    },

    // 5) 閾侀敜鍑讳腑:娌夐噸閲戝睘鎾炲嚮 + 浣欓煶
    hammerHit() {
      if (this._playBuffer('hammer', 0.94, 0.88 + Math.random() * 0.12)) return;
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      // 璧峰鍐插嚮 click
      const click = this.noise(0.05, 6000, 'highpass');
      const cg = this.envGain(0.30, t, 0.001, 0.06);
      click.src.connect(click.out).connect(cg).connect(this.master);
      click.src.start(t);
      // 娌夐噸鐨勯噾灞炴挒鍑?鍥涚粍鏂规尝)
      [80, 140, 220, 380].forEach((freq, i) => {
        const osc = c.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        const g = this.envGain(0.28 / (i + 1), t, 0.002, 0.22);
        osc.connect(g).connect(this.master);
        osc.start(t); osc.stop(t + 0.25);
      });
      // 閲戝睘鍣煶
      const n = this.noise(0.15, 4500, 'lowpass');
      const ng = this.envGain(0.40, t, 0.002, 0.12);
      n.src.connect(n.out).connect(ng).connect(this.master);
      n.src.start(t);
    },

    // 6) 閲戝竵鎺夎惤:浼樺厛鐪熷疄閲戝竵纰版挒澹?澶辫触 fallback 鍚堟垚
    coinDrop() {
      if (this._playBuffer('coin', 0.88, 0.95 + Math.random() * 0.10)) return;
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      // 3 涓竻鑴?dings(鑰佽檸鏈烘劅)
      [{ dt: 0.00, f: 2200, dur: 0.20 },
       { dt: 0.07, f: 2600, dur: 0.18 },
       { dt: 0.14, f: 1900, dur: 0.18 }].forEach(d => {
        const osc = c.createOscillator();
        osc.type = 'triangle'; osc.frequency.value = d.f;
        const g = this.envGain(0.22, t + d.dt, 0.002, d.dur);
        osc.connect(g).connect(this.master);
        osc.start(t + d.dt); osc.stop(t + d.dt + d.dur + 0.05);
      });
    },

    // 7) 鏁屼汉鎯ㄥ彨:浼樺厛鐪熷疄鐢锋€у彈鍑诲０,澶辫触 fallback 澶氬眰鍚堟垚鎯ㄥ彨
    scream(source) {
      const sourceName = String(source || '');
      let sample = 'screamBandit';
      let voiceRate = 0.94 + Math.random() * 0.08;
      let volume = 0.96;
      if (sourceName.includes('soldier')) {
        sample = 'screamSoldier';
        voiceRate = 0.90 + Math.random() * 0.06;
        volume = 1.0;
      } else if (sourceName.includes('merchant')) {
        sample = 'screamMerchant';
        voiceRate = 1.05 + Math.random() * 0.09;
        volume = 0.92;
      }
      if (this._playBuffer(sample, volume, voiceRate)) return;
      if (!this.ctx) return;
      const c = this.ctx, t = c.currentTime;
      // 鐪熷疄鎯ㄥ彨 = 鍠夊挋闊?楂?sawtooth) + 鑳歌厰鍏遍福(浣?triangle) + 鍢跺搼姘旀伅(noise)
      // 涓婚煶 1:楂橀煶棰戞(800鈫?500鈫?00 Hz)閿娇 wail 鈥?鏍稿績鎯ㄥ彨
      const osc1 = c.createOscillator();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(800, t);
      osc1.frequency.linearRampToValueAtTime(1500, t + 0.10);
      osc1.frequency.linearRampToValueAtTime(700, t + 0.45);
      const g1 = c.createGain();
      g1.gain.setValueAtTime(0.0001, t);
      g1.gain.exponentialRampToValueAtTime(0.95, t + 0.012);
      g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      osc1.connect(g1).connect(this.master);
      osc1.start(t); osc1.stop(t + 0.58);
      // 涓婚煶 2:涓(400鈫?50鈫?50 Hz)鏂规尝,澧炲姞"澹板樁鍔涚"鐨勯绮掓劅
      const osc2 = c.createOscillator();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(400, t);
      osc2.frequency.linearRampToValueAtTime(750, t + 0.10);
      osc2.frequency.linearRampToValueAtTime(350, t + 0.45);
      const g2 = c.createGain();
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(0.45, t + 0.012);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      osc2.connect(g2).connect(this.master);
      osc2.start(t); osc2.stop(t + 0.58);
      // 鍏遍福:浣庨(200鈫?80鈫?80 Hz)涓夎娉?妯℃嫙鑳歌厰
      const osc3 = c.createOscillator();
      osc3.type = 'triangle';
      osc3.frequency.setValueAtTime(200, t);
      osc3.frequency.linearRampToValueAtTime(380, t + 0.10);
      osc3.frequency.linearRampToValueAtTime(180, t + 0.45);
      const g3 = c.createGain();
      g3.gain.setValueAtTime(0.0001, t);
      g3.gain.exponentialRampToValueAtTime(0.55, t + 0.012);
      g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      osc3.connect(g3).connect(this.master);
      osc3.start(t); osc3.stop(t + 0.58);
      // 鍢跺搼姘旀伅(breathy noise) 鈥?甯﹂€?2200Hz 璁╁０闊虫湁"娌欏搼鎰?
      const n = this.noise(0.50, 2200, 'bandpass', 0.8);
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.40, t + 0.02);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      n.src.connect(n.out).connect(ng).connect(this.master);
      n.src.start(t);
    },

    // 8) 鍒囩怀/缁冲瓙琚垏鏂?鐭績鐨?twang
    ropeCut() {
      if (!this.ctx) return;

      const g = this.envGain(0.22, t, 0.002, 0.14);
      osc.connect(g).connect(this.master);
      osc.start(t); osc.stop(t + 0.16);
    },
  };

  // 娴嬮噺 PNG 閫忔槑鑳屾櫙鍚庡唴瀹?bbox(alpha > 30 瑙嗕负涓嶉€忔槑)
  function measureImageContent(img, threshold = 30) {
    if (!img.complete || !img.naturalWidth) return null;
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      const data = cx.getImageData(0, 0, c.width, c.height).data;
      let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          if (data[(y * c.width + x) * 4 + 3] > threshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
    } catch (e) { return null; }
  }

  // 鎶婄櫧搴?PNG 鎶犳垚閫忔槑 鈥?鍦ㄦ祻瑙堝櫒閲岀幇鍋?閬垮厤渚濊禆澶栭儴宸ュ叿
  // 闃堝€?RGB 閮?鈮?thresh 瑙嗕负鐧借壊,鏀规垚 alpha=0
  function chromaKeyWhite(img, thresh = 235) {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return null;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      const data = cx.getImageData(0, 0, w, h);
      const d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] >= thresh && d[i+1] >= thresh && d[i+2] >= thresh) {
          d[i+3] = 0; // transparent
        }
      }
      cx.putImageData(data, 0, 0);
      const out = new Image();
      out.onload = () => out; // ready
      out.src = c.toDataURL();
      return out;
    } catch (e) { return null; }
  }

  function loadAndFinalize(entry) {
    entry.img.onload = () => {
      // 鍏堝皾璇曟姞鐧藉簳
      const chroma = chromaKeyWhite(entry.img);
      if (chroma) {
        // 绛夊緟 chroma 鍔犺浇瀹屾垚(鐢?setTimeout 0 鎶婃帶鍒舵潈璁╃粰浜嬩欢寰幆,杩欐牱 toDataURL 宸茬粡杞ソ)
        const finalize = () => {
          entry.img = chroma;
          entry.loaded = true;
          entry.contentBbox = measureImageContent(chroma);
        };
        if (chroma.complete) finalize();
        else chroma.onload = finalize;
      } else {
        entry.loaded = true;
        entry.contentBbox = measureImageContent(entry.img);
      }
    };
    entry.img.onerror = () => { entry.loaded = false; };
    entry.img.src = entry.path;
  }

  for (const key in propImages) loadAndFinalize(propImages[key]);
  for (const key in enemyImages) loadAndFinalize(enemyImages[key]);

  bgImage.img.onerror = () => { bgImage.loaded = false; };

  const muzzle = { x: 0, y: 0, angle: -Math.PI / 2 };
  const muzzleFlashEffects = [];
  let mouseX = 0, mouseY = 0;
  let bullets = [];
  let bulletSpeed = 9, bulletR = 5;
  let shotsLeft = SHOTS_PER_LEVEL;
  let outOfAmmoSince = 0;
  let tipTimer = 0;
  let levelEpoch = 0;
  let enemies = levelData.enemies.map(e => ({ x: 0, y: 0, alive: true, type: e.type, look: e.look || 'bandit' }));

  // Matter
  const engine = M.Engine.create();
  const world = engine.world;
  engine.gravity.y = 1.2;
  engine.constraintIterations = 4;
  // 鍚敤鐫＄湢:闈欐鐗╀綋浼氳繘鍏ョ潯鐪犺妭鐪?CPU,琚鎾炴椂鑷姩鍞ら啋
  if (M.Sleeping) engine.enableSleeping = true;

  let wallBodies = [];
  let platformBodies = [];
  let propBodies = [];
  let propById = {};
  let enemyData = [];
  const coinBodies = [];
  // 缁冲瓙娈?鎵€鏈夌怀瀛愮殑鎵€鏈夋,鎵佸钩瀛樺偍,鏂逛究瀛愬脊蹇€熸娴嬪垏鍓?
  const ropeSegments = [];
  // 缁冲瓙鏁翠綋(鐢ㄤ簬娓叉煋:姣忔牴缁冲瓙 = 澶氫釜 segment + 璧峰 anchor / 鏈 ball)
  // 姣忎釜 rope: { segments: [...], pivot: body|null, ball: body|null, color, thickness, isCut, ... }
  const ropes = [];
  // 娓告垙鐘舵€?'playing' | 'dead'
  let gameState = 'playing';
  let playerRagdoll = null;   // 姝讳骸鏃剁敓鎴愮殑鏈ㄥ伓

  // 璋冭瘯
  let DEBUG = false;
  window.addEventListener('keydown', e => {
    if (e.key === 'd' || e.key === 'D') {
      DEBUG = !DEBUG;
    } else if (e.key === 'r' || e.key === 'R') {
      restart();
    }
  });

  // ====== 甯冨眬:浠?levelData 鏋勫缓鎵€鏈夌墿鐞嗗璞?======
  function layout() {
    levelEpoch++;
    explosionEffects.length = 0;
    muzzleFlashEffects.length = 0;
    boomTexts.length = 0;
    shakeAmp = 0; shakeEndAt = 0;
    flashPeak = 0; flashEndAt = 0;
    W = window.innerWidth  || canvas.clientWidth  || 1280;
    H = window.innerHeight || canvas.clientHeight || 720;
    canvas.width = W;
    canvas.height = H;
    if (mouseX === 0 && mouseY === 0) {
      mouseX = W * 0.7;
      mouseY = H * 0.48;
    }

    // 鍏冲崱鍒囨崲:浼樺厛绾?SWING_HAMMER_TEST > CHAIN_TEST > EXPLOSIVE_TEST > SINGLE_BOX_TEST > TEST_PROPS_MODE > PENDULUM_TEST > 鐪熷疄鍏冲崱
    if (SWING_HAMMER_TEST) {
      levelData = SWING_HAMMER_DEMO_LEVEL;
    } else if (CHAIN_TEST) {
      levelData = CHAIN_TEST_LEVEL;
    } else if (EXPLOSIVE_TEST) {
      levelData = EXPLOSIVE_TEST_LEVEL;
    } else if (SINGLE_BOX_TEST) {
      levelData = SINGLE_BOX_TEST_LEVEL;
    } else if (TEST_PROPS_MODE) {
      levelData = TEST_PROP_LEVEL;
    } else if (PENDULUM_TEST) {
      levelData = PENDULUM_DEMO_LEVEL;
    }
    // 閲嶅缓 enemies 鏁扮粍(鍏冲崱鍒囨崲鍚庢晫浜烘暟閲忓彲鑳戒笉鍚?
    enemies = levelData.enemies.map(e => ({
      x: 0,
      y: 0,
      alive: true,
      type: e.type,
      look: e.look || 'bandit',
    }));
    const stalePlayerRagdoll = playerRagdoll;
    const staleRopes = ropes.slice();

    player.footX = W * levelData.player.footXR;
    player.footY = H - levelData.player.footOffsetBottom;
    player.alive = true;
    gameState = 'playing';

    // 鐜╁纰版挒浣撹鐩栭獞鎵嬩笌鍧愰獞锛泂ensor 鍙仛鍛戒腑妫€娴嬶紝涓嶅共鎵板師鍏冲崱閬撳叿杩愬姩銆?
    if (player.body) M.Composite.remove(world, player.body);
    player.body = M.Bodies.rectangle(
      player.footX + 4 * PLAYER_SCALE,
      player.footY - 55 * PLAYER_SCALE,
      88 * PLAYER_SCALE,
      116 * PLAYER_SCALE,
      {
      isStatic: true,
      isSensor: true,
      label: 'player_hitbox',
      }
    );
    player.body.levelEpoch = levelEpoch;
    M.Composite.add(world, player.body);

    // 鏁屼汉鍒濆浣嶇疆(鍗曟晫浜烘祴璇曟椂鎶?E0 鏀惧埌 P0 鍙宠竟缂橀檮杩?鏂逛究楠岃瘉"杈圭紭璺岃惤")
    // 濡傛灉璇ラ偅浜轰笅鏂规湁 platform,鑷姩璁╅棯搴曞湪 platform 椤堕潰 1px 涓? 閬垮厤鍏ラ棶鍑虹洏鐨勭┛妯?br>
    // 濡傛灉璇?xR 绾佃惤鍦ㄥ涓?platform 娆℃?涓?鎸?e.yR 鏈€鎺ヨ繎鐨?platform 椤堕潰 閬垮厤璇垽缃戝悎骞剁殑 platform 琚敊閰?br>
    function findStandingTop(xR, yR) {
      let bestY = null, bestDist = Infinity;
      for (const p of (levelData.platforms || [])) {
        const pL = p.xR, pR = p.xR + p.wR;
        if (xR < pL || xR > pR) continue;
        const topR = p.yR - p.hR / 2;
        const d = Math.abs(topR - yR);
        if (d < bestDist) { bestDist = d; bestY = topR; }
      }
      return bestY;
    }
    levelData.enemies.forEach((e, i) => {
      if (SINGLE_ENEMY_TEST && !TEST_PROPS_MODE && i === 0 && levelData.platforms[0]) {
        const p0 = levelData.platforms[0];
        enemies[i].x = (p0.xR + p0.wR - 0.025) * W;  // 璺濆彸杈圭紭 ~2.5%W
        const top = findStandingTop((p0.xR + p0.wR - 0.025), e.yR);
        enemies[i].y = (top != null ? top : e.yR) * H - 1;
      } else {
        enemies[i].x = e.xR * W;
        const top = findStandingTop(e.xR, e.yR);
        enemies[i].y = (top != null ? top : e.yR) * H - 1;
      }
    });

    // 娓呯悊鏃?body
    const old = [
      ...wallBodies,
      ...platformBodies,
      ...propBodies,
      ...enemyData.flatMap(ed => [...ed.allParts, ...ed.constraints]),
      // 鐜╁鏈ㄥ伓(姝讳骸鏃剁敓鎴愮殑鏁ｆ灦,閲嶅惎鍓嶈娓呮帀)
      ...(stalePlayerRagdoll ? [...stalePlayerRagdoll.allParts, ...stalePlayerRagdoll.constraints] : []),
    ];
    if (old.length) M.Composite.remove(world, old);
    // 缁虫銆佸浐瀹氱偣鍜岀害鏉熶笉鍦?propBodies 涓紝闇€瑕佸崟鐙竻鐞嗭紝閬垮厤閲嶅紑鍚庡彔鍔犮€?
    for (const rope of staleRopes) {
      // 鏃х増瀛楁(pendulum 鍏煎):pivot / segments / constraints
      if (rope.pivot) M.Composite.remove(world, rope.pivot);
      for (const segment of (rope.segments || [])) M.Composite.remove(world, segment);
      for (const constraint of (rope.constraints || [])) M.Composite.remove(world, constraint);
      // 鏂扮粨鏋?subRopes(鍙岀怀閾侀敜涔熻娓?
      for (const sub of (rope.subRopes || [])) {
        if (sub.pivot && sub.pivot !== rope.pivot) M.Composite.remove(world, sub.pivot);
        for (const segment of sub.segments) M.Composite.remove(world, segment);
        for (const constraint of sub.constraints) M.Composite.remove(world, constraint);
      }
      // 閾侀敜 body
      if (rope.hammerBody) M.Composite.remove(world, rope.hammerBody);
    }
    ropeSegments.length = 0;
    ropes.length = 0;
    playerRagdoll = null;
    characterHitEffects.length = 0;
    for (const coin of coinBodies) M.Composite.remove(world, coin);
    coinBodies.length = 0;

    // 澧?鐢诲竷澶?
    wallBodies = [
      M.Bodies.rectangle(-50,        H/2, 100, H*4, { isStatic: true, label: 'wall', friction: 0, restitution: 1 }),
      M.Bodies.rectangle(W + 50,     H/2, 100, H*4, { isStatic: true, label: 'wall', friction: 0, restitution: 1 }),
      M.Bodies.rectangle(W/2,    -50,        W*4, 100, { isStatic: true, label: 'wall', friction: 0, restitution: 1 }),
      M.Bodies.rectangle(W/2,    H + 50,     W*4, 100, { isStatic: true, label: 'wall', friction: 0, restitution: 1 }),
    ];

    // 鍏冲崱澧?鍙弽寮?
    for (const w of levelData.walls) {
      const body = M.Bodies.rectangle(
        w.xR * W, w.yR * H,
        w.wR * W, w.hR * H,
        { isStatic: true, label: 'wall', friction: 0, restitution: 1 }
      );
      wallBodies.push(body);
    }

    // 骞冲彴(yR = 涓績,涓嶈鍔犻澶栧亸绉?鍚﹀垯閬撳叿浼氳窡骞冲彴琛ㄩ潰閿欏紑 7px)
    platformBodies = levelData.platforms.map(p => {
      const x = p.xR * W, y = p.yR * H, w = p.wR * W;
      return M.Bodies.rectangle(x + w / 2, y, w, (p.hR || 0.013) * H, {
        isStatic: true, label: 'platform', friction: 0.4, restitution: 0.3,  // 鎽╂摝 0.05鈫?.4,鎭㈠ 1鈫?.3(闃叉琚縺娲诲悗杩囧害寮硅烦)
      });
    });

    // 閬撳叿
    propBodies = [];
    propById = {};
    for (const prop of levelData.props) {
      const body = createProp(prop);
      if (body) {
        propBodies.push(body);
        propById[prop.id] = body;
      }
    }
    // 寤虹珛 holds/blocks 鍏崇郴
    for (const prop of levelData.props) {
      const body = propById[prop.id];
      if (!body) continue;
      if (prop.holds) {
        body.holdsBody = propById[prop.holds];
        if (body.holdsBody) M.Body.setStatic(body.holdsBody, true);
      }
      if (prop.heldBy) body.blocksBody = propById[prop.heldBy];  // barrier blocks ball
    }

    // 鏁屼汉(鍏ㄩ儴鏈ㄥ伓)
    enemyData = [];
    const enemyCount = SINGLE_ENEMY_TEST ? 1 : enemies.length;
    for (let i = 0; i < enemyCount; i++) {
      const e = enemies[i];
      const r = createRagdoll(e);
      enemyData.push({ type: 'ragdoll', e, ...r });
      M.Composite.add(world, [...r.allParts, ...r.constraints]);
    }
    if (SINGLE_ENEMY_TEST) {
      for (let i = 1; i < enemies.length; i++) enemies[i].alive = false;
    }

    M.Composite.add(world, [...wallBodies, ...platformBodies, ...propBodies]);

    const shortSide = Math.min(W, H);
    bulletSpeed = shortSide * BULLET_SPEED_BASE;
    bulletR = Math.max(4, shortSide * BULLET_R_BASE);

    updateBulletsUI();

    // 鍏冲崱楠岃瘉
    validateLevel();
  }

  // ====== 鍏冲崱楠岃瘉(鍩虹妫€鏌? ======
  function validateLevel() {
    const errors = [];
    // 1) 姣忎釜鏁屼汉绔欏湪鏌愪釜骞冲彴涓?
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      let onPlatform = false;
      for (const p of levelData.platforms) {
        const px = p.xR * W, py = p.yR * H, pw = p.wR * W;
        if (e.x >= px && e.x <= px + pw && Math.abs(e.y - py) < 10) {
          onPlatform = true;
          break;
        }
      }
      if (!onPlatform) errors.push(`E${i}(${e.type}) 不在平台上`);
    }
    // 2) 鏁屼汉涓嶄笌澧欓噸鍙?
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      for (const w of levelData.walls) {
        const wx = w.xR * W, wy = w.yR * H, ww = w.wR * W, wh = w.hR * H;
        if (e.x > wx - ww/2 - 10 && e.x < wx + ww/2 + 10 &&
            e.y > wy - wh/2 - 10 && e.y < wy + wh/2 + 10) {
          errors.push(`E${i} 涓庡 W 閲嶅彔`);
        }
      }
    }
    // 3) 鐜╁鍛ㄥ洿瀹夊叏鍖?鍗婂緞 80 鍍忕礌)
    for (const p of levelData.platforms) {
      const px = p.xR * W, py = p.yR * H, pw = p.wR * W;
      if (player.footX > px - 60 && player.footX < px + pw + 60 &&
          player.footY > py - 100 && player.footY < py + 30) {
        errors.push(`鐜╁绂?P 澶繎(${px.toFixed(0)},${py.toFixed(0)})`);
      }
    }
    // 4) 骞冲彴涓嶉噸鍙?绠€鍗?AABB 妫€娴?
    for (let i = 0; i < levelData.platforms.length; i++) {
      for (let j = i + 1; j < levelData.platforms.length; j++) {
        const a = levelData.platforms[i], b = levelData.platforms[j];
        const ax1 = a.xR * W, ax2 = ax1 + a.wR * W;
        const bx1 = b.xR * W, bx2 = bx1 + b.wR * W;
        const ay = a.yR * H, by = b.yR * H;
        if (ax1 < bx2 && ax2 > bx1 && Math.abs(ay - by) < 20) {
          errors.push(`骞冲彴 ${i} 鍜?${j} 璺濈澶繎(<20px)`);
        }
      }
    }
    if (errors.length === 0) {
      console.log(`[关卡 ${levelData.levelId}] 验证通过：${enemies.length} 敌人，${levelData.platforms.length} 平台，${levelData.walls.length} 墙`);
    } else {
      console.warn(`[关卡 ${levelData.levelId}] 验证失败：`);
      errors.forEach(e => console.warn('  - ' + e));
    }
  }

  // ====== 閬撳叿鍒涘缓(鎸?PROP_PHYS 琛ㄧ嫭绔嬪弬鏁? ======
  function createProp(prop) {
    const phys = PROP_PHYS[prop.type];
    if (!phys) {
      console.warn('[createProp] 鏈煡 prop.type:', prop.type);
      return null;
    }
    // 閽熸憜:鐗规畩缁撴瀯(缁冲瓙+鐞?,鐙珛鍒涘缓
    if (prop.type === 'pendulum') return createPendulumProp(prop, phys);
    // 鍙岀怀鐙肩墮鐞?涓ゆ潯 sub-rope + 鍦嗗舰鐙肩墮鐞?
    if (prop.type === 'swing_hammer') return createSwingHammerProp(prop, phys);

    const x = prop.xR * W, y = prop.yR * H;
    const w = (prop.wR || 0.03) * W;
    const h = (prop.hR || 0.04) * H;
    const r = (prop.rR || 0.012) * Math.min(W, H);
    const isCircle = phys.shape === 'circle';
    const isPolygon = phys.shape === 'polygon';
    // 璧峰闈欐€?鍙湁 support/barrier/ramp 榛樿闈欐€?鍏朵粬鍔ㄦ€侀亾鍏峰垵濮嬮潤鎬?绛夊瓙寮规縺娲?
    const startStatic = phys.isStatic === true;
    const options = {
      density: prop.density != null ? prop.density : phys.density,
      friction: phys.friction,
      frictionAir: phys.frictionAir,
      restitution: phys.restitution,
      label: phys.label,
      isStatic: startStatic,
      // 鍚敤鐫＄湢(闃叉闈欐鍚庢寔缁皬骞呮姈鍔ㄦ秷鑰?CPU)
      sleepThreshold: 60,
    };
    if (prop.angle != null) options.angle = prop.angle;
    let body;
    if (isCircle) {
      body = M.Bodies.circle(x, y, r, options);
    } else if (isPolygon) {
      // 涔濊竟褰㈡瘮鍦嗗舰鏇磋创杩戝法鐭宠疆寤擄紝涔熻兘鑷劧缈绘粴銆佸崱杈瑰拰鍊惧€掋€?
      body = M.Bodies.polygon(x, y, 9, r, options);
    } else {
      body = M.Bodies.rectangle(x, y, w, h, options);
    }
    if (body) {
      body.propId = prop.id;
      body.propType = prop.type;
      body.category = phys.category;
      body.phys = phys;
      // 璁板綍鍘熷灏哄(鍍忕礌),drawRectImage 鐢ㄨ繖涓€屼笉鏄?AABB,閬垮厤鏃嬭浆鍚庤鎷夊ぇ
      body.propW = isPolygon ? r * 2 : w;
      body.propH = isPolygon ? r * 2 : h;
      body.propR = r;
      body.hitCount = 0;          // 璁板綍琚嚮涓鏁?鏀拺/灞忛殰鍗曟瑙﹀彂鐢?
      body.lastHitBullet = -1;    // 闃叉鍚屼竴棰楀瓙寮瑰甯ч噸澶嶈Е鍙?
      body.lastHitAt = 0;
      body.levelEpoch = levelEpoch;
      // 鍙Щ鍔ㄧ墿浣撶敤"鐫＄湢"鍐荤粨鍒濆浣嶇疆锛屼繚鐣欐湁闄愯川閲忥紝鍙楀嚮鏃跺啀鍞ら啋
      if (prop.startStatic && M.Sleeping) M.Sleeping.set(body, true);
    }
    return body;
  }

  // ====== 閽熸憜:缁冲瓙閾?+ 鐙肩墮鐞?+ 闈欐€?pivot 涓変欢濂?======
  function createPendulumProp(prop, phys) {
    const pivotX = (prop.pivot?.xR ?? prop.xR) * W;
    const pivotY = (prop.pivot?.yR ?? prop.yR) * H;
    const ropeLen = (prop.ropeLen ?? 0.4) * H;       // 鎬绘憜闀?
    const segN = prop.ropeSeg || 14;                 // 娈垫暟(14-18 姣旇緝杞?
    const ballR = (prop.ballR ?? 0.030) * Math.min(W, H);
    const startAng = prop.startAng ?? -0.95;         // 鍒濆鍋忚(寮у害, ~ -54掳)
    // 缁冲瓙鍙傛暟
    const ropeStiffness = prop.ropeStiffness ?? 0.90;
    const ropeDamping = prop.ropeDamping ?? 0.12;
    const ropeCuttable = prop.ropeCuttable !== false;  // 榛樿鍙垏
    // 鐞冨弬鏁?
    const ballDensity = prop.ballDensity ?? phys.density;
    const ropeGroup = M.Body.nextGroup(true);
    // 鐞冨垵濮嬩綅缃?浠?pivot 娌?startAng 鏂瑰悜寤朵几 ropeLen
    const ballX = pivotX + Math.sin(startAng) * ropeLen;
    const ballY = pivotY + Math.cos(startAng) * ropeLen;
    // 鐙肩墮鐞?鍔ㄦ€佸渾褰?
    const ball = M.Bodies.circle(ballX, ballY, ballR, {
      density: ballDensity,
      friction: phys.friction,
      frictionAir: phys.frictionAir,
      restitution: phys.restitution,
      label: 'prop_ball',  // 璧扮幇鏈?prop-vs-enemy 浼ゅ閾捐矾
      collisionFilter: { group: ropeGroup },
      // 闃叉 sleep:缁冲瓙涓婄殑鐞冨嵆浣块€熷害寰堝皬涔熶繚鎸佺墿鐞嗗搷搴?
      sleepThreshold: Infinity,
    });
    ball.propId = prop.id;
    ball.propType = 'pendulum';
    ball.category = 'heavyObject';  // 璺熺煶澶村悓涓€绫?鎾炲埌鏁屼汉璧颁激瀹?
    ball.phys = phys;
    ball.propR = ballR;
    ball.hitCount = 0;
    ball.lastHitBullet = -1;
    ball.lastHitAt = 0;
    ball.levelEpoch = levelEpoch;
    ball.ropeCut = false;
    // 缁欑悆涓€涓槑纭殑鍒囧悜鍒濋€熷害锛岄〉闈竴寮€濮嬪氨鑳界湅瑙佹憜鍔ㄣ€?
    // 0.005 绯绘暟 = 720*0.005 = 3.6 px/甯?鈮?鑷劧鏈€澶ч€熷害鐨?18%,鎽嗗緱鏄庢樉
    const v0 = prop.startSpeed ?? Math.max(2.5, Math.min(W, H) * 0.005);
    M.Body.setAngle(ball, -startAng);
    M.Body.setVelocity(ball, {
      x: -Math.cos(startAng) * v0,
      y: Math.sin(startAng) * v0,
    });
    M.Body.setAngularVelocity(ball, -v0 / Math.max(ballR, 1) * 0.7);

    // 鐪熸鐨勫鑺傜墿鐞嗙怀锛氭瘡涓€鑺傞兘鏈夎川閲忋€佽搴﹀拰绌烘皵闃诲姏銆?
    const coreR = ballR * 0.72;
    const ropeSpan = ropeLen - coreR;
    const segmentLen = ropeSpan / segN;
    const segmentThickness = Math.max(2.4, Math.min(W, H) * 0.0035);
    const dirX = Math.sin(startAng);
    const dirY = Math.cos(startAng);
    const segments = [];
    for (let i = 0; i < segN; i++) {
      const dist = (i + 0.5) * segmentLen;
      const seg = M.Bodies.rectangle(
        pivotX + dirX * dist,
        pivotY + dirY * dist,
        segmentThickness,
        segmentLen,
        {
          angle: -startAng,
          density: 0.004,
          friction: 0.25,
          frictionAir: 0.012,
          restitution: 0.04,
          label: 'rope_segment',
          collisionFilter: { group: ropeGroup },
          sleepThreshold: Infinity,
          chamfer: { radius: segmentThickness * 0.5 },
        }
      );
      seg.isRopeSegment = true;
      seg.ropeId = prop.id;
      seg.ropeIndex = i;
      seg.ropeHitRadius = segmentLen * 0.62;
      seg.levelEpoch = levelEpoch;
      seg.destroyed = false;
      segments.push(seg);
    }

    const pivot = M.Bodies.circle(pivotX, pivotY, 3, {
      isStatic: true,
      isSensor: true,
      label: 'rope_pivot',
      collisionFilter: { group: ropeGroup },
    });
    pivot.isRopePivot = true;
    pivot.ropeId = prop.id;
    pivot.levelEpoch = levelEpoch;

    const constraints = [
      M.Constraint.create({
        bodyA: pivot,
        bodyB: segments[0],
        pointB: { x: 0, y: -segmentLen / 2 },
        length: 0,
        stiffness: ropeStiffness,
        damping: ropeDamping,
      }),
    ];
    for (let i = 0; i < segments.length - 1; i++) {
      constraints.push(M.Constraint.create({
        bodyA: segments[i],
        bodyB: segments[i + 1],
        pointA: { x: 0, y: segmentLen / 2 },
        pointB: { x: 0, y: -segmentLen / 2 },
        length: 0,
        stiffness: ropeStiffness,
        damping: ropeDamping,
      }));
    }
    constraints.push(M.Constraint.create({
      bodyA: segments[segments.length - 1],
      bodyB: ball,
      pointA: { x: 0, y: segmentLen / 2 },
      length: coreR,
      stiffness: ropeStiffness,
      damping: ropeDamping,
    }));

    // 缁宠妭鍜屽叧鑺傚厛鍔犲叆锛涚嫾鐗欑悆鐢?layout 闅?propBodies 缁熶竴鍔犲叆涓€娆°€?
    M.Composite.add(world, [pivot, ...segments, ...constraints]);

    ropeSegments.push(...segments);
    // 閫氱敤缁撴瀯:姣忔潯"缁?鐢?1..N 涓?subRope 缁勬垚,姣忎釜 subRope 鐙珛鍙垏
    // - 閽熸憜:1 涓?subRope(pivot鈫抯egments鈫抌all)
    // - 鍙岀怀閾侀敜:2 涓?subRope(宸?鍙冲悇涓€涓?
    ropes.push({
      id: prop.id,
      kind: 'pendulum',
      // 兼容旧字段
      pivot, ball, segments, constraints,
      // 鏂扮粨鏋?
      subRopes: [{
        pivot, segments, constraints,
        isCut: false,
        cutIndex: -1,
        endBody: ball,    // 杩欎竴鎴怀瀛愭湯绔寕鍦ㄥ摢涓?body 涓?
        endPoint: { x: 0, y: 0 },  // 鍦?endBody 涓婄殑灞€閮ㄩ敋鐐?
      }],
      ropeLen,
      segmentLen,
      color: prop.ropeColor || phys.ropeColor || '#3a2818',
      thickness: prop.ropeThickness || phys.ropeThickness || 2.5,
      cuttable: ropeCuttable,
      isCut: false,
      continuousSwing: prop.continuousSwing === true,
      driveSpeed: prop.driveSpeed ?? 5.2,
      driveZone: prop.driveZone ?? 0.22,
      swingDirection: Math.sign(
        ball.velocity.x * Math.cos(startAng) +
        ball.velocity.y * -Math.sin(startAng)
      ) || -1,
      spikeCount: prop.spikeCount || 8,
      ballR,
      propId: prop.id,
    });

    return ball;
  }

  // ====== 鍙岀怀鐙肩墮鐞?閲婃斁缁冲拰涓荤怀鍏卞悓閿佸畾鍦嗙悆 ======
  // 鍒囬噴鏀剧怀 鈫?鐙肩墮鐞冪粫涓荤怀鎽嗗姩
  function createSwingHammerProp(prop, phys) {
    // 鍙傛暟
    const pivotL_cfg = prop.pivotL || { xR: 0.30, yR: 0.20 };
    const pivotR_cfg = prop.pivotR || { xR: 0.50, yR: 0.20 };
    const pivotLX = pivotL_cfg.xR * W, pivotLY = pivotL_cfg.yR * H;
    const pivotRX = pivotR_cfg.xR * W, pivotRY = pivotR_cfg.yR * H;
    const hcx = (prop.hammerX ?? 0.40) * W;
    const hcy = (prop.hammerY ?? 0.35) * H;
    const ballR = (prop.ballR ?? 0.042) * Math.min(W, H);
    const hw = ballR * 2;
    const hh = ballR * 2;
    const segN = prop.ropeSeg || 12;
    const ropeStiffness = prop.ropeStiffness ?? 0.90;
    const ropeDamping   = prop.ropeDamping ?? 0.12;
    const ropeCuttable  = prop.ropeCuttable !== false;

    // 鍙岀怀鍚婄潃鐨勫渾褰㈢嫾鐗欑悆锛涘渾褰㈢鎾炲崐寰勫氨鏄皷鍒哄缂樸€?
    const hammerBody = M.Bodies.circle(hcx, hcy, ballR, {
      density: prop.density != null ? prop.density : phys.density,
      friction: phys.friction,
      frictionAir: phys.frictionAir,
      restitution: phys.restitution,
      label: 'prop_hammer',
      sleepThreshold: Infinity,  // 闃叉 sleep 闈欐鍚庤璇垽
    });
    hammerBody.propId = prop.id;
    hammerBody.propType = 'swing_hammer';
    hammerBody.category = 'swingHammer';
    hammerBody.phys = phys;
    hammerBody.propW = hw;
    hammerBody.propH = hh;
    hammerBody.propR = ballR;
    hammerBody.spikeCount = prop.spikeCount || 12;
    hammerBody.hitCount = 0;
    hammerBody.lastHitBullet = -1;
    hammerBody.lastHitAt = 0;
    hammerBody.levelEpoch = levelEpoch;
    hammerBody.ropeCut = false;
    hammerBody.ropeReleased = false;
    hammerBody.fullyReleased = false;

    // 鍏变韩 collision group,璁╃怀瀛?閾侀敜鍐呴儴涓嶄簰鐩稿脊
    const ropeGroup = M.Body.nextGroup(true);
    hammerBody.collisionFilter.group = ropeGroup;

    // 瀛愬嚱鏁?鍒涘缓涓€鏉?sub-rope
    // pivotXY = 椤堕儴 pivot 涓栫晫鍧愭爣
    // endBody = 鏈 body
    // endPointLocal = 鏈閿氱偣(body 灞€閮ㄥ潗鏍?
    function buildSubRope(pivotX, pivotY, endBody, endPointLocal) {
      // pivot 闈欐€佷紶鎰熷櫒
      const pivot = M.Bodies.circle(pivotX, pivotY, 3, {
        isStatic: true, isSensor: true, label: 'rope_pivot',
        collisionFilter: { group: ropeGroup },
      });
      pivot.isRopePivot = true;
      pivot.ropeId = prop.id;
      pivot.levelEpoch = levelEpoch;
      pivot.subRopeId = 'hammer_' + prop.id + '_' + pivotX.toFixed(0);

      // pivot 鈫?endBody 鐨勬柟鍚?
      const ex = endBody.position.x + endPointLocal.x;
      const ey = endBody.position.y + endPointLocal.y;
      const dx = ex - pivotX, dy = ey - pivotY;
      const dist = Math.hypot(dx, dy);
      const dirX = dist > 0.001 ? dx / dist : 0;
      const dirY = dist > 0.001 ? dy / dist : 1;
      // Matter.js 鍧愭爣绯?y 鍚戜笅:rectangle 榛樿闀胯酱娌?+y銆?
      // 娈甸暱杞磋浠庨粯璁ゆ柟鍚?(0,1) 杞埌 (dirX,dirY),鏃嬭浆瑙?= atan2(-dirX, dirY)
      // 楠岃瘉:dirX=0, dirY=1(绔栫洿鍚戜笅)鈫?ang=0,娈电珫鐩?鉁?
      //       dirX=-0.813, dirY=0.582(閽熸憜 startAng=-0.95)鈫?ang=+0.95 鉁?
      const ang = Math.atan2(-dirX, dirY);
      // 閾鹃暱搴﹂鐣欎竴鐐圭┖闅?缁冲瓙鐪嬩笂鍘荤环鐩?
      const ropeLen = Math.max(20, dist - 4);
      const segmentLen = ropeLen / segN;
      const segmentThickness = Math.max(2.4, Math.min(W, H) * 0.0035);

      const segments = [];
      for (let i = 0; i < segN; i++) {
        const segDist = (i + 0.5) * segmentLen;
        const seg = M.Bodies.rectangle(
          pivotX + dirX * segDist,
          pivotY + dirY * segDist,
          segmentThickness,
          segmentLen,
          {
            angle: ang,
            density: 0.004,
            friction: 0.25,
            frictionAir: 0.012,
            restitution: 0.04,
            label: 'rope_segment',
            collisionFilter: { group: ropeGroup },
            sleepThreshold: Infinity,
            chamfer: { radius: segmentThickness * 0.5 },
          }
        );
        seg.isRopeSegment = true;
        seg.ropeId = prop.id;
        seg.ropeIndex = i;
        seg.ropeHitRadius = segmentLen * 0.62;
        seg.levelEpoch = levelEpoch;
        seg.destroyed = false;
        segments.push(seg);
      }

      // 绾︽潫:pivot 鈫?seg[0] 鈫?seg[1] 鈫?... 鈫?seg[last] 鈫?endBody
      const constraints = [
        M.Constraint.create({
          bodyA: pivot, bodyB: segments[0],
          pointB: { x: 0, y: -segmentLen / 2 },
          length: 0, stiffness: ropeStiffness, damping: ropeDamping,
        }),
      ];
      for (let i = 0; i < segments.length - 1; i++) {
        constraints.push(M.Constraint.create({
          bodyA: segments[i], bodyB: segments[i + 1],
          pointA: { x: 0, y: segmentLen / 2 },
          pointB: { x: 0, y: -segmentLen / 2 },
          length: 0, stiffness: ropeStiffness, damping: ropeDamping,
        }));
      }
      // 鏈:鏈€鍚庝竴娈靛簳閮?鈫?閾侀敜绔偣
      constraints.push(M.Constraint.create({
        bodyA: segments[segments.length - 1],
        bodyB: endBody,
        pointA: { x: 0, y: segmentLen / 2 },
        pointB: { x: endPointLocal.x, y: endPointLocal.y },
        length: 0, stiffness: ropeStiffness, damping: ropeDamping,
      }));

      // 鏁存潯 sub-rope 鍔犲叆涓栫晫
      M.Composite.add(world, [pivot, ...segments, ...constraints]);
      ropeSegments.push(...segments);

      return { pivot, segments, constraints };
    }

    // 涓ゆ潯 sub-rope
    // 涓ゆ牴缁冲瓙鍒嗗埆鎵ｅ湪鐙肩墮鐞冮《閮ㄥ乏鍙充袱涓悐鐜€?
    const attachX = ballR * 0.24;
    const attachY = -ballR * 0.58;
    const leftEnd  = { x: -attachX, y: attachY };
    const rightEnd = { x:  attachX, y: attachY };
    const subL = buildSubRope(pivotLX, pivotLY, hammerBody, leftEnd);
    const subR = buildSubRope(pivotRX, pivotRY, hammerBody, rightEnd);

    // 璁板叆 ropes
    ropes.push({
      id: prop.id,
      kind: 'swing_hammer',
      hammerBody,
      // 鍏煎鏃у瓧娈?鐣欑┖,layout cleanup 浼氳烦杩?
      pivot: null, ball: null, segments: [], constraints: [],
      subRopes: [
        { ...subL, isCut: false, cutIndex: -1, endBody: hammerBody, endPoint: leftEnd, role: 'release' },
        { ...subR, isCut: false, cutIndex: -1, endBody: hammerBody, endPoint: rightEnd, role: 'swing' },
      ],
      ropeLen: Math.hypot(pivotLY - (hcy + attachY), pivotLX - (hcx - attachX)),
      segmentLen: Math.hypot(pivotLY - (hcy + attachY), pivotLX - (hcx - attachX)) / segN,
      color: prop.ropeColor || phys.ropeColor || '#3a2818',
      thickness: prop.ropeThickness || phys.ropeThickness || 2.0,
      cuttable: ropeCuttable,
      isCut: false,
      continuousSwing: prop.continuousSwing === true,
      driveSpeed: prop.driveSpeed ?? 3.0,
      driveZone: prop.driveZone ?? 0.24,
      swingDirection: 1,
      propId: prop.id,
    });

    return hammerBody;
  }

  // ====== 鍒囩怀瀛?瀛愬脊鍛戒腑缁虫鏃惰皟鐢? ======
  // 琛屼负:
  //   - 鍒囨帀鍛戒腑娈?+ 涓庡畠鐩存帴鐩歌繛鐨勯摼绾︽潫
  //   - 涓婃缁х画鍚婂湪 pivot锛屼笅娈电户缁粦鐫€杞借嵎锛屼袱娈甸兘鎸夌湡瀹為噸鍔涘拰鎯€ц繍鍔?
  //   - 閽熸憜:鐙肩墮鐞冨甫鐫€涓嬪崐鎴怀鎸夋儻鎬ч鍑?
  //   - 鍙岀怀閾侀敜:閲婃斁缁虫柇寮€锛屼富缁崇户缁悐鐫€閾侀敜 鈫?閾侀敜鍗曠怀鎽嗗姩
  function cutRopeAt(seg) {
    if (seg.destroyed) return false;
    AudioFX.ropeCut();
    // 鎵惧埌杩欐潯缁?鍙兘鍦?subRopes 閲?
    let rope = null, subRope = null;
    for (const r of ropes) {
      const sub = r.subRopes && r.subRopes.find(s => s.segments.includes(seg));
      if (sub) { rope = r; subRope = sub; break; }
    }
    if (!rope || !rope.cuttable || !subRope || subRope.isCut) return false;

    // 1) 绉婚櫎璇ユ
    M.Composite.remove(world, seg);
    seg.destroyed = true;
    // 2) 绉婚櫎鎵€鏈?缁忚繃"璇ユ鐨勭害鏉?閾句笂涓ゆ銆乸ivot 绔€佹湯绔?
    for (const c of subRope.constraints) {
      if (c.bodyA === seg || c.bodyB === seg) {
        M.Composite.remove(world, c);
      }
    }
    // 3) 鏈绾︽潫淇濈暀锛氭柇鍙ｄ互涓嬬殑缁虫浠嶇粦鐫€鐞?閾侀敜锛屽舰鎴愮湡瀹炵殑鐢╃怀鎯€с€?
    // 4) 杩欐牴缁冲凡缁忔柇寮€锛屼繚鐣欑墿鐞嗙怀娈佃繍鍔紝浣嗗叏閮ㄩ€€鍑哄悗缁瓙寮瑰懡涓娴嬨€?
    for (const ropeSeg of subRope.segments) ropeSeg.bulletPassThrough = true;
    for (let i = ropeSegments.length - 1; i >= 0; i--) {
      if (subRope.segments.includes(ropeSegments[i])) ropeSegments.splice(i, 1);
    }
    subRope.cutIndex = seg.ropeIndex;
    subRope.isCut = true;

    // 閽熸憜:鐞冩爣蹇椾负 ropeCut(鐢ㄤ簬鐜╁姝讳骸绛夐摼璺?
    if (rope.kind === 'pendulum' && rope.ball) {
      rope.ball.ropeCut = true;
      rope.isCut = true;
    }
    // 鍙岀怀閾侀敜:鍙︿竴鏉?sub-rope 浠嶈繛鐫€,rope.isCut 淇濇寔 false(鍙户缁憜鍔?
    if (rope.kind === 'swing_hammer') {
      rope.hammerBody.ropeReleased = true;
      if (rope.subRopes.every(s => s.isCut)) {
        rope.isCut = true;
        rope.hammerBody.fullyReleased = true;
      }
    }
    if (rope.kind === 'pendulum') {
    } else if (rope.kind === 'swing_hammer') {
    }
    return true;
  }

  // ====== 鏈ㄥ伓鏋勯€?澶撮儴+韬共+鍙岃噦+鍙岃吙+鍙嚮椋炲附瀛?+ 鐙珛闅忔満) ======
  function createRagdoll(e) {
    const x = e.x, y = e.y;
    // 鐜╁鏈ㄥ伓(琚亾鍏峰嚮涓悗)闇€瑕佹斁澶у埌璺熷師瑙掕壊姣斾緥涓€鑷?鍚﹀垯鐪嬭捣鏉?缂╁皬浜?
    const isPlayerRagdoll = e.isPlayer === true;
    const look = e.look || 'bandit';
    const profile = ENEMY_BODY_PROFILES[look] || ENEMY_BODY_PROFILES.bandit;
    const S = (e.scale || 1.0) * (isPlayerRagdoll ? 1 : ENEMY_SCALE);
    // 鍦熷尓鐦﹂珮銆佸畼鍏垫柟姝ｅ帤閲嶃€佸瘜鍟嗗ご澶ц吂鍦嗭紱涓昏姝讳骸鏈ㄥ伓缁存寔鍘熸瘮渚嬨€?
    const torsoW = (isPlayerRagdoll ? 16 : profile.torsoW) * S;
    const torsoH = (isPlayerRagdoll ? 22 : profile.torsoH) * S;
    const headR = (isPlayerRagdoll ? 9 : profile.headR) * S;
    const upperLegH = (isPlayerRagdoll ? 9 : profile.upperLegH) * S;
    const lowerLegH = (isPlayerRagdoll ? 9 : profile.lowerLegH) * S;
    const legW = (isPlayerRagdoll ? 5 : profile.legW) * S;
    const armW = (isPlayerRagdoll ? 5 : profile.armW) * S;
    const armH = (isPlayerRagdoll ? 14 : profile.armH) * S;
    const hatW = (isPlayerRagdoll ? 22 : profile.hatW) * S;
    const hatH = (isPlayerRagdoll ? 8 : profile.hatH) * S;
    const hasLooseHat = !e.isPlayer;

    // 姣忔晫浜虹嫭绔嬮殢鏈?璐ㄩ噺 92%鈥?08%(5鈥?0% 宸紓),涓綋鍋忕疆 卤0.2
    const massRand  = 0.92 + Math.random() * 0.16;
    // Preserve the previous enemy mass after enlarging the collision skeleton,
    // so bullet and prop impacts retain their established responsiveness.
    const enemyMassCompensation = Math.pow(1.10 / ENEMY_SCALE, 2);
    const densityScale = massRand * (isPlayerRagdoll ? 1 : profile.massScale * enemyMassCompensation);
    const sideBias  = (Math.random() - 0.5) * 0.4;
    const slackVar  = 0.85 + Math.random() * 0.3;  // 鍏宠妭鏉惧紱搴?85%鈥?15%

    const CAT_WORLD = 0x0001;
    const CAT_HEAD = 0x0002, CAT_TORSO = 0x0004;
    const CAT_UPLEG_L = 0x0008, CAT_UPLEG_R = 0x0010;
    const CAT_LOWLEG_L = 0x0020, CAT_LOWLEG_R = 0x0040;
    const CAT_ARML = 0x0100, CAT_ARMR = 0x0200, CAT_HAT = 0x0400;
    const CAT_BULLET = 0x0080;
    const headFilter    = { category: CAT_HEAD,    mask: CAT_WORLD | CAT_LOWLEG_L | CAT_LOWLEG_R | CAT_BULLET };
    const torsoFilter   = { category: CAT_TORSO,   mask: CAT_WORLD | CAT_LOWLEG_L | CAT_LOWLEG_R | CAT_BULLET };
    const upLegLFilter  = { category: CAT_UPLEG_L, mask: CAT_WORLD | CAT_BULLET };
    const upLegRFilter  = { category: CAT_UPLEG_R, mask: CAT_WORLD | CAT_BULLET };
    const lowLegLFilter = { category: CAT_LOWLEG_L, mask: CAT_WORLD | CAT_HEAD | CAT_TORSO | CAT_LOWLEG_R | CAT_BULLET };
    const lowLegRFilter = { category: CAT_LOWLEG_R, mask: CAT_WORLD | CAT_HEAD | CAT_TORSO | CAT_LOWLEG_L | CAT_BULLET };
    const armLFilter    = { category: CAT_ARML,    mask: CAT_WORLD | CAT_BULLET };
    const armRFilter    = { category: CAT_ARMR,    mask: CAT_WORLD | CAT_BULLET };
    const hatFilter     = { category: CAT_HAT,     mask: CAT_WORLD | CAT_BULLET };

    // 浠庤剼搴曞悜涓婃帹瀵艰啙銆侀珛銆佽函骞插拰澶撮儴锛岀缉鐭吙鍚庝粛淇濇寔鎵€鏈夊叧鑺傛棤缂濊繛鎺ャ€?
    const footY = y;
    const kneeY = footY - lowerLegH;
    const hipY = kneeY - upperLegH;
    const torsoY = hipY - torsoH / 2;
    const headCY = torsoY - torsoH / 2 - headR + S;
    // 鍚勯儴鍒嗙浉瀵硅函骞蹭腑蹇冪殑鍋忕Щ(鍏ㄩ儴鎸?S 缂╂斁,淇濊瘉姣斾緥姝ｇ‘)
    const legOffX = (isPlayerRagdoll ? 3.5 : profile.legOffX) * S;
    const armOffX = (isPlayerRagdoll ? 9 : profile.armOffX) * S;
    const shoulderY = (isPlayerRagdoll ? 9 : profile.shoulderY) * S;

    const torso = M.Bodies.rectangle(x, torsoY, torsoW, torsoH, {
      density: 0.0028 * densityScale, friction: 0.5, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: torsoFilter,
    });
    const head = M.Bodies.circle(x, headCY, headR, {
      density: 0.0022 * densityScale, friction: 0.5, restitution: 0.02, frictionAir: 0.06,
      label: 'enemy_part', collisionFilter: headFilter,
    });
    // 鏁屼汉甯藉瓙鏄嫭绔嬪垰浣擄細瀛樻椿鏃跺浐瀹氬湪澶撮《锛屾浜℃椂涓嶅彈鍏宠妭绾︽潫锛岀洿鎺ヨ劚钀介鍑恒€?
    const hat = hasLooseHat ? M.Bodies.rectangle(
      x, headCY - headR - 2.2 * S, hatW, hatH, {
        density: 0.0012 * densityScale,
        friction: 0.35,
        restitution: 0.28,
        frictionAir: 0.012,
        label: 'enemy_part',
        collisionFilter: hatFilter,
        chamfer: { radius: 2 * S },
      }
    ) : null;
    // 瀹樺叺鎶辨寔鐨勬鏋槸鐙珛鍒氫綋锛氱珯绔嬫椂妯湪鑳稿墠锛屼腑寮瑰悗瑙ｉ櫎闈欐€佸苟椋炲嚭銆?
    const backRifle = !isPlayerRagdoll && look === 'soldier'
      ? M.Bodies.rectangle(x + 1.5 * S, torsoY + 1.5 * S, 4.4 * S, 36 * S, {
          angle: -Math.PI / 2 - 0.10,
          density: 0.0024 * densityScale,
          friction: 0.42,
          restitution: 0.22,
          frictionAir: 0.012,
          label: 'enemy_part',
          collisionFilter: hatFilter,
          chamfer: { radius: 1.2 * S },
        })
      : null;
    const upperLegL = M.Bodies.rectangle(x - legOffX, (hipY + kneeY) / 2, legW, upperLegH, {
      density: 0.0035 * densityScale, friction: 0.8, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: upLegLFilter,
    });
    const upperLegR = M.Bodies.rectangle(x + legOffX, (hipY + kneeY) / 2, legW, upperLegH, {
      density: 0.0035 * densityScale, friction: 0.8, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: upLegRFilter,
    });
    const lowerLegL = M.Bodies.rectangle(x - legOffX, (kneeY + footY) / 2, legW, lowerLegH, {
      density: 0.003 * densityScale, friction: 0.8, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: lowLegLFilter,
    });
    const lowerLegR = M.Bodies.rectangle(x + legOffX, (kneeY + footY) / 2, legW, lowerLegH, {
      density: 0.003 * densityScale, friction: 0.8, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: lowLegRFilter,
    });
    // 鎵嬭噦(鎸傚湪韬共涓や晶,鍒濆闈欐€?
    const armL = M.Bodies.rectangle(x - armOffX, torsoY - 2 * S, armW, armH, {
      density: 0.0015 * densityScale, friction: 0.4, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: armLFilter,
    });
    const armR = M.Bodies.rectangle(x + armOffX, torsoY - 2 * S, armW, armH, {
      density: 0.0015 * densityScale, friction: 0.4, restitution: 0.02, frictionAir: 0.08,
      label: 'enemy_part', collisionFilter: armRFilter,
    });
    torso.propW = torsoW; torso.propH = torsoH;
    upperLegL.propW = legW; upperLegL.propH = upperLegH;
    upperLegR.propW = legW; upperLegR.propH = upperLegH;
    lowerLegL.propW = legW; lowerLegL.propH = lowerLegH;
    lowerLegR.propW = legW; lowerLegR.propH = lowerLegH;
    armL.propW = armW; armL.propH = armH;
    armR.propW = armW; armR.propH = armH;
    if (hat) {
      hat.hatW = hatW;
      hat.hatH = hatH;
      M.Body.setInertia(hat, hat.inertia * 0.72);
    }
    if (backRifle) {
      backRifle.propW = 4.4 * S;
      backRifle.propH = 36 * S;
      M.Body.setInertia(backRifle, backRifle.inertia * 0.68);
    }
    [upperLegL, upperLegR, lowerLegL, lowerLegR].forEach(b => M.Body.setInertia(b, b.inertia * 2.5));
    [armL, armR].forEach(b => M.Body.setInertia(b, b.inertia * 1.8));

    const stiffness = 0.85, damping = 0.2;
    // 鑲╅儴绾︽潫(杞竴浜?鍏佽鎽嗗姩)
    const armStiff = 0.7 * slackVar, armDamp = 0.2;
    const shoulderDx = (isPlayerRagdoll ? 7 : profile.shoulderDx) * S;
    const shoulderLength = Math.abs(armOffX - shoulderDx);
    const constraints = [
      M.Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: headR }, pointB: { x: 0, y: -torsoH/2 }, stiffness: stiffness * slackVar, damping, length: 0 }),
      M.Constraint.create({ bodyA: upperLegL, bodyB: torso, pointA: { x: 0, y: -upperLegH/2 }, pointB: { x: -legOffX, y: torsoH/2 }, stiffness: stiffness * slackVar, damping, length: 0 }),
      M.Constraint.create({ bodyA: upperLegR, bodyB: torso, pointA: { x: 0, y: -upperLegH/2 }, pointB: { x: legOffX, y: torsoH/2 }, stiffness: stiffness * slackVar, damping, length: 0 }),
      M.Constraint.create({ bodyA: lowerLegL, bodyB: upperLegL, pointA: { x: 0, y: -lowerLegH/2 }, pointB: { x: 0, y: upperLegH/2 }, stiffness: stiffness * slackVar, damping, length: 0 }),
      M.Constraint.create({ bodyA: lowerLegR, bodyB: upperLegR, pointA: { x: 0, y: -lowerLegH/2 }, pointB: { x: 0, y: upperLegH/2 }, stiffness: stiffness * slackVar, damping, length: 0 }),
      // 鑲╅儴:arm 椤堕儴 -> 韬共鑲╃偣(length=2*S 鏄?arm 鍒濆 x 鍋忕Щ 9*S - 鑲╃偣 x 鍋忕Щ 7*S,娑堥櫎鍒濆鎷夊姏)
      M.Constraint.create({ bodyA: armL, bodyB: torso, pointA: { x: 0, y: -armH/2 }, pointB: { x: -shoulderDx, y: -shoulderY }, stiffness: armStiff, damping: armDamp, length: shoulderLength }),
      M.Constraint.create({ bodyA: armR, bodyB: torso, pointA: { x: 0, y: -armH/2 }, pointB: { x: shoulderDx, y: -shoulderY },  stiffness: armStiff, damping: armDamp, length: shoulderLength }),
    ];
    const antiStiff = 0.2, antiDamp = 0.4;
    // 闃叉姌鍙犵害鏉熻窡闅忓疄闄呴儴浠堕暱搴︼紝閬垮厤缂╄吙鍚庢浜℃湪鍋跺張琚棫绾︽潫鎷夐暱銆?
    const headAntiLength = torsoH + headR - S;
    const legAntiLength = torsoH + upperLegH + S;
    constraints.push(M.Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 0 }, pointB: { x: 0, y: torsoH/2 }, stiffness: antiStiff, damping: antiDamp, length: headAntiLength }));
    constraints.push(M.Constraint.create({ bodyA: torso, bodyB: lowerLegL, pointA: { x: -legOffX, y: -torsoH/2 }, pointB: { x: 0, y: -lowerLegH/2 }, stiffness: antiStiff, damping: antiDamp, length: legAntiLength }));
    constraints.push(M.Constraint.create({ bodyA: torso, bodyB: lowerLegR, pointA: { x: legOffX, y: -torsoH/2 }, pointB: { x: 0, y: -lowerLegH/2 }, stiffness: antiStiff, damping: antiDamp, length: legAntiLength }));
    constraints.push(M.Constraint.create({ bodyA: lowerLegL, bodyB: lowerLegR, pointA: { x: 0, y: 0 }, pointB: { x: 0, y: 0 }, stiffness: 0.3, damping: antiDamp, length: legOffX * 2 }));
    // 鎵嬭噦闃叉姌鍙?length=5*S 鏄簳閮ㄥ疄闄呰窛绂?~4.5*S,鐣欏啑浣?stiffness 0.05 鏇磋蒋,閬垮厤鎸佺画灏忔媺鍔?
    const armBottomSlack = 5 * S;
    constraints.push(M.Constraint.create({ bodyA: armL, bodyB: torso, pointA: { x: 0, y: armH/2 }, pointB: { x: -shoulderDx, y: shoulderY }, stiffness: 0.05, damping: 0.4, length: armBottomSlack }));
    constraints.push(M.Constraint.create({ bodyA: armR, bodyB: torso, pointA: { x: 0, y: armH/2 }, pointB: { x: shoulderDx, y: shoulderY },  stiffness: 0.05, damping: 0.4, length: armBottomSlack }));

    const allParts = [torso, head, upperLegL, upperLegR, lowerLegL, lowerLegR, armL, armR];
    if (hat) allParts.push(hat);
    if (backRifle) allParts.push(backRifle);
    allParts.forEach(p => M.Body.setStatic(p, true));

    return {
      torso, head, hat, backRifle, upperLegL, upperLegR, lowerLegL, lowerLegR, armL, armR,
      legL: lowerLegL, legR: lowerLegR,
      allParts,
      allLegs: [upperLegL, upperLegR, lowerLegL, lowerLegR],
      allArms: [armL, armR],
      allLimbs: [upperLegL, upperLegR, lowerLegL, lowerLegR, armL, armR],
      constraints, activated: false,
      hitPart: null, hitPoint: null, bulletVel: null, platformInfo: null,
      massRand, sideBias, slackVar,
      lastForce: null, cm: { x: x, y: torsoY },
      look, profile,  // 瑙掕壊澶栬涓庝綋鍨?bandit / soldier / merchant
    };
  }

  // 涓婃鍙戝皠鏃堕棿鎴?闃插弻鍑?蹇繛鐐硅瑙?鈫?瀛愬脊杩炲彂 bug)
  let _lastShootAt = 0;
  function shoot() {
    // Shooting is handled on pointerdown and the canvas prevents the later
    // click event, so unlock/resume audio directly inside the user gesture.
    AudioFX.init();
    AudioFX.bgm(true);
    // 110ms 鑺傛祦:娴忚鍣?pointerdown 鍋跺皵浼氬洜瑙︽懜/鍙屽嚮鍦?~10ms 鍐呰Е鍙戜袱娆?
    // 鏅€氱敤鎴锋渶蹇偣鍑婚棿闅?~150ms,110ms 鏃㈣兘鎸′綇璇Е鍙屽彂,鍙堜笉浼氳浜烘劅瑙夎繜閽?
    const now = performance.now();
    if (now - _lastShootAt < 110) return;
    _lastShootAt = now;
    if (gameState !== 'playing' || shotsLeft <= 0 || overlay.classList.contains('show')) {
      if (shotsLeft <= 0) return;
      return;
    }
    // 鐐瑰嚮/瑙︽懜褰撲笅鍗虫椂璁＄畻鏋彛锛岄伩鍏嶉鍑绘部鐢ㄤ笂涓€甯х瀯鍑嗘柟鍚?
    const shoulderX = player.footX + PLAYER_GUN_SHOULDER_X;
    const shoulderY = player.footY - PLAYER_GUN_SHOULDER_Y;
    const a = Math.atan2(mouseY - shoulderY, mouseX - shoulderX);
    const handX = shoulderX + Math.cos(a) * PLAYER_GUN_ARM_LENGTH;
    const handY = shoulderY + Math.sin(a) * PLAYER_GUN_ARM_LENGTH;
    muzzle.x = handX + Math.cos(a) * PLAYER_RIFLE_MUZZLE_LENGTH;
    muzzle.y = handY + Math.sin(a) * PLAYER_RIFLE_MUZZLE_LENGTH;
    muzzle.angle = a;
    const body = M.Bodies.circle(muzzle.x, muzzle.y, bulletR, {
      label: 'bullet', isSensor: true, friction: 0, restitution: 1,
    });
    M.Composite.add(world, body);
    const bData = {
      body, x: muzzle.x, y: muzzle.y,
      prevX: muzzle.x, prevY: muzzle.y,  // 涓婁竴甯т綅缃?鐢ㄤ簬澶氳竟褰㈡壂鎺犳娴?
      vx: Math.cos(a) * bulletSpeed, vy: Math.sin(a) * bulletSpeed,
      r: bulletR, bounces: BULLET_MAX_BOUNCE, bounced: 0,
      trail: [], consumed: false,
      bornAt: performance.now(),  // 鐢ㄤ簬 BULLET_MAX_AGE_MS 鍒ゆ柇
      slowFrames: 0,             // 杩炵画浣庨€熷抚璁℃暟
      lastHitId: -1,             // 鍚屼竴棰楀瓙寮逛笂娆＄殑鍛戒腑浣?ID,閬垮厤澶氬抚閲嶅瑙﹀彂
    };
    bullets.push(bData);
    addMuzzleFlash(muzzle.x, muzzle.y, a);
    shotsLeft--;
    updateBulletsUI();
    // 闊虫晥:棣栧皠鎾斁鐢ㄦ埛鍘熷０(鏋０ + "璁╁瓙寮归涓€浼氬効"),鍚庣画鎾斁鍚堟垚寮€鐏?
    if (!AudioFX.firstShotPlayed) AudioFX.firstShot();
    else AudioFX.gunshot();
    if (shotsLeft === 0) outOfAmmoSince = performance.now();
  }

  // ====== 鍐查噺/鍙嶅皠杈呭姪(缁欑湡瀹炲懡涓偣鐢? ======
  // 鍦?point 澶勭粰 body 鏂藉姞鍐查噺(impulse 鍗曚綅 = 閫熷害鍙樺寲 脳 璐ㄩ噺)
  // 蹇呴』鐢?M.Body.setVelocity / setAngularVelocity,杩欎袱涓細鍚屾鏇存柊 positionPrev/anglePrev
  // 鍚﹀垯 Verlet 绉垎涓嬩竴甯т細鎶婇€熷害"鎿︽帀",body 鐪嬩笂鍘绘病鍔?
  function applyImpulseAtPoint(body, point, impulse) {
    if (!body || body.isStatic) return;
    if (!body.mass || body.mass <= 0) return;
    const r = { x: point.x - body.position.x, y: point.y - body.position.y };
    const newVel = {
      x: body.velocity.x + impulse.x / body.mass,
      y: body.velocity.y + impulse.y / body.mass,
    };
    M.Body.setVelocity(body, newVel);
    const torque = r.x * impulse.y - r.y * impulse.x;
    const inertia = body.inertia || 1;
    M.Body.setAngularVelocity(body, body.angularVelocity + torque / inertia);
  }

  // 瀛愬脊鎸夋硶绾垮弽灏勩€傚弽寮瑰彧鏀瑰彉鏂瑰悜锛屽缁堟仮澶嶇鎾炲墠鐨勯€熷害澶у皬銆?
  // 绗洓涓?loss 鍙傛暟涓哄吋瀹圭幇鏈夎皟鐢ㄤ繚鐣欙紝浣嗕笉鍐嶇敤浜庨檷浣庡瓙寮归€熷害銆?
  // 鑷剤:鑻ヤ紶鍏ユ硶绾胯鐐圭Н 鈮?0(瀛愬脊宸茬粡杩滅鎴栫┛杩囧幓),鐢ㄥ弽閫熷害鏂瑰悜浣滀负娉曠嚎,
  // 寮哄埗"鍙嶅脊"鈥斺€旇繖鏄鐞?绌块毀"鐨勫叧閿?鍚﹀垯瀛愬脊浼氭棤澹扮┛杩囧皬鐩爣銆?
  function reflectBullet(b, nx, ny, _loss) {
    const speedBefore = Math.hypot(b.vx, b.vy);
    const normalLength = Math.hypot(nx, ny);
    if (speedBefore <= 0.01 || normalLength <= 0.0001) return;
    nx /= normalLength;
    ny /= normalLength;
    let dot = b.vx * nx + b.vy * ny;
    if (dot >= 0) {
      // 鐢ㄥ弽閫熷害浣滀负娉曠嚎,纭繚鍙嶅脊
      nx = -b.vx / speedBefore;
      ny = -b.vy / speedBefore;
      dot = -speedBefore;
    }
    const reflectedX = b.vx - 2 * dot * nx;
    const reflectedY = b.vy - 2 * dot * ny;
    const reflectedSpeed = Math.hypot(reflectedX, reflectedY);
    if (reflectedSpeed <= 0.0001) return;
    const keepSpeed = speedBefore / reflectedSpeed;
    b.vx = reflectedX * keepSpeed;
    b.vy = reflectedY * keepSpeed;
    AudioFX.ricochet();
  }

  // 浼扮畻瀛愬脊瀵瑰舰鐘?鍦嗗舰/鐭╁舰)鐨勭鎾炴硶绾?
  function estimateNormal(b, body) {
    if (body.circleRadius) {
      const dx = b.x - body.position.x;
      const dy = b.y - body.position.y;
      const d = Math.hypot(dx, dy) || 0.0001;
      return { x: dx / d, y: dy / d };
    }
    // 鏃嬭浆鐭╁舰/澶氳竟褰?鍙栫瀛愬脊鏈€杩戠殑鐪熷疄杈?娉曠嚎濮嬬粓鏈濆悜瀛愬脊
    let best = { d2: Infinity, nx: 0, ny: -1 };
    const vertices = body.vertices || [];
    for (let i = 0; i < vertices.length; i++) {
      const p1 = vertices[i], p2 = vertices[(i + 1) % vertices.length];
      const ex = p2.x - p1.x, ey = p2.y - p1.y;
      const len2 = ex * ex + ey * ey;
      if (len2 < 1e-6) continue;
      const t = Math.max(0, Math.min(1, ((b.x - p1.x) * ex + (b.y - p1.y) * ey) / len2));
      const px = p1.x + ex * t, py = p1.y + ey * t;
      const dx = b.x - px, dy = b.y - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < best.d2) {
        const len = Math.sqrt(len2);
        let nx = -ey / len, ny = ex / len;
        if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
        best = { d2, nx, ny };
      }
    }
    return { x: best.nx, y: best.ny };
  }

  // ====== 鐖嗙偢鐗规晥鏁扮粍(娓叉煋鐢? ======
  // 姣忔鐖嗙偢浜х敓 1 涓?effect + 鑻ュ共绮掑瓙
  // 婕敾椋?閿娇鏄?绾?姗?榛?鐧? + 绮楅粦鎻忚竟 + 涓夎鍏夋煴 + 鐏姳纰庣墖
  const explosionEffects = [];
  const explosionParticles = [];  // 鐏姳/纰庣墖
  function addExplosionEffect(x, y, radius) {

    explosionEffects.push({
