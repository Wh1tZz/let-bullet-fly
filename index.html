      rot0: Math.random() * Math.PI * 2,
    });
    // 16 涓伀鑺?纰庣墖(鍙栨秷鐑熼浘,婕敾椋庝笉瑕佺儫)
    for (let i = 0; i < 16; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = radius * (0.6 + Math.random() * 0.9);
      const isFrag = i >= 10;  // 4 涓皬纰庣墖(鏂瑰舰),12 涓伀鏄?鍦嗙偣)
      explosionParticles.push({
        x, y,
        bx: x, by: y,
        ex: x + Math.cos(ang) * dist,
        ey: y + Math.sin(ang) * dist,
        birth: performance.now(),
        duration: isFrag ? 850 : 650,
        type: isFrag ? 'frag' : 'spark',
        size: isFrag ? 5 : 3,
        color: isFrag
          ? ['#5a3018', '#7a4020', '#3a2010'][Math.floor(Math.random() * 3)]
          : ['#ffeb3b', '#ff9800', '#fff176', '#ff5722'][Math.floor(Math.random() * 4)],
        gravity: isFrag ? 0.42 : 0.22,
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.6,
      });
    }
  }
  function updateExplosions() {
    const now = performance.now();
    for (let i = explosionEffects.length - 1; i >= 0; i--) {
      if (now - explosionEffects[i].birth > explosionEffects[i].duration) {
        explosionEffects.splice(i, 1);
      }
    }
    for (let i = explosionParticles.length - 1; i >= 0; i--) {
      if (now - explosionParticles[i].birth > explosionParticles[i].duration) {
        explosionParticles.splice(i, 1);
      }
    }
  }

  // 鐢讳竴涓?閿娇鏄?(婕敾鐖嗙偢鐨勬爣蹇楁€у舰鐘?: N 涓皷瑙?
  // outerR 澶栧皷瑙掑崐寰? innerR 鍐呭嚬鍗婂緞(鍐冲畾澶?閿?)
  // points 澶氬皯涓皷, fillStyle 濉厖, strokeStyle 鎻忚竟, lineWidth 鎻忚竟绮楃粏
  function drawJaggedStar(x, y, outerR, innerR, points, rot, fillStyle, strokeStyle, lineWidth) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = (i % 2 === 0) ? outerR : innerR;
      const a = rot + (i / (points * 2)) * Math.PI * 2;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
    if (strokeStyle && lineWidth > 0) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.lineJoin = 'miter';
      ctx.miterLimit = 3;
      ctx.stroke();
    }
  }

  // 鐢?閫熷害绾?妤斿舰:浠庝腑蹇冨悜澶栫敾涓€涓矖鐨勫皷涓夎(婕敾鐖嗙偢鍛ㄥ洿鐨?鐮?鍏夋煴)
  function drawRayWedge(x, y, ang, innerR, outerR, halfWidth, fillStyle) {
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(ang) * innerR, y + Math.sin(ang) * innerR);
    const ax = Math.cos(ang + Math.PI / 2) * halfWidth;
    const ay = Math.sin(ang + Math.PI / 2) * halfWidth;
    const bx = Math.cos(ang - Math.PI / 2) * halfWidth;
    const by = Math.sin(ang - Math.PI / 2) * halfWidth;
    ctx.lineTo(x + Math.cos(ang) * outerR + ax, y + Math.sin(ang) * outerR + ay);
    ctx.lineTo(x + Math.cos(ang) * outerR + bx, y + Math.sin(ang) * outerR + by);
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  function drawExplosions() {
    const now = performance.now();
    // 1) 涓荤垎鐐?鍥涘眰閿娇鏄?+ 涓夎鍏夋煴
    for (const e of explosionEffects) {
      const age = now - e.birth;
      if (age > e.duration) continue;
      const t = age / e.duration;
      const baseR = e.radius;

      // ----- 闃舵 1:鐬棿鐧介棯鏄?0~0.15,鍙湁灏栧埡鎰? -----
      if (t < 0.18) {
        const lt = t / 0.18;
        const s = 0.6 + lt * 0.6;  // 0.6 鈫?1.2
        const a = 1 - lt;
        drawJaggedStar(
          e.x, e.y, baseR * 1.05 * s, baseR * 0.40 * s, 14,
          e.rot0,
          `rgba(255, 255, 255, ${a})`,
          `rgba(20, 10, 0, ${a * 0.9})`,
          Math.max(2.5, baseR * 0.06)
        );
      }

      // ----- 闃舵 2:榛勮壊澶ф槦(涓昏瑙?0.05~0.55) -----
      if (t > 0.05 && t < 0.6) {
        const lt = (t - 0.05) / 0.55;
        // 寮规€?0.4 鈫?1.35 鈫?1.05
        let s;
        if (lt < 0.25) s = 0.4 + (1.35 - 0.4) * (lt / 0.25);
        else if (lt < 0.45) s = 1.35 - 0.30 * ((lt - 0.25) / 0.20);
        else s = 1.05;
        // 鏃嬭浆
        const rot = e.rot0 + lt * 0.5;
        const a = lt < 0.75 ? 1 : (1 - (lt - 0.75) / 0.25);
        // 榛戞弿杈瑰帤涓€鐐?鈫?婕敾鎰?
        drawJaggedStar(
          e.x, e.y, baseR * 1.0 * s, baseR * 0.42 * s, 12,
          rot,
          `rgba(255, 215, 30, ${a})`,
          `rgba(15, 8, 0, ${a})`,
          Math.max(3, baseR * 0.07)
        );
      }

      // ----- 闃舵 3:姗欒壊涓眰鏄?0.10~0.75) -----
      if (t > 0.10 && t < 0.8) {
        const lt = (t - 0.10) / 0.70;
        let s;
        if (lt < 0.20) s = 0.3 + (1.20 - 0.3) * (lt / 0.20);
        else s = 1.20 + 0.4 * (lt - 0.20);  // 缁х画鏀惧ぇ
        const rot = e.rot0 - lt * 0.35;  // 鍙嶅悜鏃嬭浆
        const a = lt < 0.7 ? 0.95 * (1 - lt * 0.4) : (1 - (lt - 0.7) / 0.3) * 0.6;
        drawJaggedStar(
          e.x, e.y, baseR * 1.0 * s, baseR * 0.50 * s, 14,
          rot,
          `rgba(255, 110, 20, ${a})`,
          `rgba(15, 8, 0, ${a * 0.95})`,
          Math.max(2.5, baseR * 0.055)
        );
      }

      // ----- 闃舵 4:绾㈣壊澶栧眰鏄?0.15~1.0) -----
      if (t > 0.15) {
        const lt = (t - 0.15) / 0.85;
        const s = 0.4 + lt * 1.2;  // 鎸佺画鏀惧ぇ
        const rot = e.rot0 + lt * 0.7;
        const a = lt < 0.6 ? 0.9 : (1 - (lt - 0.6) / 0.4) * 0.7;
        drawJaggedStar(
          e.x, e.y, baseR * 1.05 * s, baseR * 0.55 * s, 16,
          rot,
          `rgba(220, 40, 20, ${a})`,
          `rgba(15, 8, 0, ${a * 0.9})`,
          Math.max(2, baseR * 0.045)
        );
      }

      // ----- 涓夎鍏夋煴(0~0.55,绮楀．鐨?鐮?鍏夋煴) -----
      if (t < 0.55) {
        const lt = t / 0.55;
        const a = lt < 0.5 ? 1 : 1 - (lt - 0.5) / 0.5;
        const wedgeR = baseR * (0.85 + lt * 0.6);
        const halfW = baseR * 0.18 * (1 - lt * 0.5);
        const wedgeCount = 8;
        for (let i = 0; i < wedgeCount; i++) {
          const ang = (i / wedgeCount) * Math.PI * 2 + e.rot0;
          // 榛戝簳 + 榛勮姱,璁╁厜鏌辨湁"婕敾鍒嗚壊"璐ㄦ劅
          drawRayWedge(e.x, e.y, ang, baseR * 0.5, wedgeR * 1.05, halfW * 1.15, `rgba(20, 10, 0, ${a * 0.85})`);
          drawRayWedge(e.x, e.y, ang, baseR * 0.55, wedgeR, halfW, `rgba(255, 230, 80, ${a})`);
        }
      }
    }

    // 2) 绮掑瓙(婕敾鐏姳 + 妫曡壊纰庣墖)
    for (const p of explosionParticles) {
      const age = now - p.birth;
      if (age > p.duration) continue;
      const t = age / p.duration;
      const ease = 1 - (1 - t) * (1 - t);
      const px = p.bx + (p.ex - p.bx) * ease;
      const py = p.by + (p.ey - p.by) * ease + p.gravity * t * t * 80;
      const alpha = 1 - t * t;  // 鏈熬蹇€熸秷澶?
      if (p.type === 'spark') {
        // 鍦嗙偣鐏槦,甯︾矖榛戞弿杈?
        const r = p.size * (1.4 - t * 0.7);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0a0a0a';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else {
        // 妫曡壊纰庣墖鏂瑰潡,甯︽弿杈?
        const s = p.size * (1 - t * 0.5);
        p.rot += p.spin;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#0a0a0a';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-s / 2, -s / 2, s, s);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ====== 鍔ㄦ极鐢婚 BOOM 鏂囧瓧(鐖嗙偢鏃跺脊鍑? ======
  const boomTexts = [];
  function addBoomText(x, y, radius) {
    // 闅忔満璇嶅簱 + 闅忔満鏂瑰悜(鐣ュ悜涓婂亸绉?涓績鐐圭◢楂樹簬鐖嗙偢涓績)
    const words = ['BOOM!!', 'BOOM!', '轰！！', '砰！', 'KABOOM!', 'BAM!'];
    const word = words[Math.floor(Math.random() * words.length)];
    const fontSize = Math.max(38, Math.min(96, radius * 0.55));
    boomTexts.push({
      x, y: y - radius * 0.15,
      birth: performance.now(),
      duration: 900,       // 鎸佺画 0.9s
      word,
      fontSize,
      // 闅忔満鏃嬭浆鏂瑰悜,瑙掑害骞呭害闅忓崐寰勭缉鏀?
      rot: (Math.random() < 0.5 ? -1 : 1) * (0.10 + Math.random() * 0.18),
      // 璧峰鍨傜洿閫熷害(鍚戜笂"寮?涓€鐐?
      vy: -0.6 - Math.random() * 0.4,
    });
  }
  function updateBoomTexts() {
    const now = performance.now();
    for (let i = boomTexts.length - 1; i >= 0; i--) {
      const bt = boomTexts[i];
      // 涓婂崌鍑忛€?
      bt.y += bt.vy;
      bt.vy *= 0.94;
      if (now - bt.birth > bt.duration) boomTexts.splice(i, 1);
    }
  }
  function drawBoomTexts() {
    const now = performance.now();
    for (const bt of boomTexts) {
      const age = now - bt.birth;
      if (age > bt.duration) continue;
      const t = age / bt.duration;
      // 寮规€х缉鏀?0.2 鈫?1.35 鈫?1.0 鈫?1.05
      let s;
      if (t < 0.18) s = 0.2 + (1.35 - 0.2) * (t / 0.18);
      else if (t < 0.32) s = 1.35 - 0.35 * ((t - 0.18) / 0.14);
      else s = 1.0 + 0.05 * Math.sin((t - 0.32) * 18);
      // 鏃嬭浆淇濇寔
      const rot = bt.rot * (1 - t * 0.3);
      // 閫忔槑搴?鍓?10% 绔嬪埢鍏ㄤ寒,鍚?50% 娓愰殣
      const alpha = t < 0.55 ? 1 : Math.max(0, 1 - (t - 0.55) / 0.45);

      ctx.save();
      ctx.translate(bt.x, bt.y);
      ctx.rotate(rot);
      ctx.scale(s, s);
      ctx.font = `900 ${bt.fontSize}px "Impact", "Arial Black", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // 澶氬眰鎻忚竟妯℃嫙婕敾绮楅粦杈?
      ctx.lineJoin = 'round';
      ctx.miterLimit = 2;
      ctx.strokeStyle = `rgba(20, 10, 0, ${alpha})`;
      ctx.lineWidth = bt.fontSize * 0.18;
      for (let k = 0; k < 2; k++) {
        ctx.strokeText(bt.word, 0, 0);
      }
      // 榛勮壊涓诲～鍏?+ 椤堕儴楂樺厜(娓愬彉)
      const grad = ctx.createLinearGradient(0, -bt.fontSize / 2, 0, bt.fontSize / 2);
      grad.addColorStop(0, `rgba(255, 250, 120, ${alpha})`);
      grad.addColorStop(0.55, `rgba(255, 180, 30, ${alpha})`);
      grad.addColorStop(1, `rgba(220, 90, 20, ${alpha})`);
      ctx.fillStyle = grad;
      ctx.fillText(bt.word, 0, 0);
      // 鍐呴儴楂樺厜
      ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.55})`;
      ctx.fillText(bt.word, 0, -bt.fontSize * 0.08);
      ctx.restore();
    }
  }

  // ====== 涓夌被鏁屼汉鐨勪笓灞炰腑寮硅瑙夊弽棣?======
  const characterHitEffects = [];
  function addCharacterHitEffect(r, x, y, dx, dy) {
    const look = r.look || 'bandit';
    const count = look === 'merchant' ? 9 : (look === 'bandit' ? 8 : 6);
    const particles = [];
    for (let i = 0; i < count; i++) {
      const spread = (i / count) * Math.PI * 2 + Math.random() * 0.38;
      particles.push({
        angle: spread,
        distance: (look === 'bandit' ? 28 : (look === 'soldier' ? 20 : 32)) * (0.65 + Math.random() * 0.55),
        size: 2.2 + Math.random() * 2.2,
        spin: (Math.random() - 0.5) * 5,
      });
    }
    characterHitEffects.push({
      look, x, y, dx, dy,
      birth: performance.now(),
      duration: look === 'soldier' ? 560 : 720,
      particles,
    });
  }

  function spawnMerchantCoins(r, x, y, dx, dy) {
    if (r.coinsDropped) return;
    r.coinsDropped = true;
    const count = 13;
    for (let i = 0; i < count; i++) {
      const radius = 2.5 + Math.random() * 1.2;
      const coin = M.Bodies.circle(
        x + (Math.random() - 0.5) * 12,
        y - 4 + (Math.random() - 0.5) * 8,
        radius,
        {
          density: 0.0022,
          friction: 0.12,
          frictionAir: 0.014,
          restitution: 0.34,
          label: 'merchant_coin',
          sleepThreshold: 45,
        }
      );
      coin.coinRadius = radius;
      coin.coinSeed = Math.random();
      const side = (i - (count - 1) / 2) / ((count - 1) / 2);
      M.Body.setVelocity(coin, {
        x: dx * (1.5 + Math.random() * 1.3) + side * (2.2 + Math.random() * 2.5),
        y: dy * 0.8 - (2.8 + Math.random() * 4.4),
      });
      M.Body.setAngularVelocity(coin, (Math.random() - 0.5) * 0.55);
      coinBodies.push(coin);
      M.Composite.add(world, coin);
    }
  }

  function drawMerchantCoins() {
    for (const coin of coinBodies) {
      const r = coin.coinRadius || coin.circleRadius || 3;
      ctx.save();
      ctx.translate(coin.position.x, coin.position.y);
      ctx.rotate(coin.angle);
      const squash = 0.72 + Math.abs(Math.cos(coin.angle * 1.7 + coin.coinSeed * 5)) * 0.28;
      ctx.scale(1, squash);
      ctx.fillStyle = '#e6b533';
      ctx.strokeStyle = '#704710';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = '#fff0a3';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(-r * 0.15, -r * 0.12, r * 0.58, Math.PI * 0.85, Math.PI * 1.72);
      ctx.stroke();
      ctx.fillStyle = '#7a5016';
      ctx.fillRect(-r * 0.22, -r * 0.22, r * 0.44, r * 0.44);
      ctx.restore();
    }
  }

  function drawCharacterHitEffects() {
    const now = performance.now();
    for (let i = characterHitEffects.length - 1; i >= 0; i--) {
      const effect = characterHitEffects[i];
      const age = now - effect.birth;
      if (age >= effect.duration) {
        characterHitEffects.splice(i, 1);
        continue;
      }
      const t = age / effect.duration;
      const ease = 1 - (1 - t) * (1 - t);
      const alpha = Math.max(0, 1 - t);
      const ringColor = effect.look === 'bandit'
        ? `rgba(74,43,23,${alpha})`
        : effect.look === 'soldier'
          ? `rgba(184,137,56,${alpha})`
          : `rgba(228,177,50,${alpha})`;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = effect.look === 'soldier' ? 3 : 2;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, 5 + ease * (effect.look === 'soldier' ? 15 : 21), 0, Math.PI * 2);
      ctx.stroke();

      for (const particle of effect.particles) {
        const px = effect.x + Math.cos(particle.angle) * particle.distance * ease;
        const gravity = effect.look === 'merchant' ? 18 * t * t : 7 * t * t;
        const py = effect.y + Math.sin(particle.angle) * particle.distance * ease + gravity;
        if (effect.look === 'bandit') {
          // 鍦熷尓锛氭榛戣壊鏂滃悜閫熷害绾匡紝閰嶅悎杞诲揩缈婚銆?
          ctx.strokeStyle = Math.sin(particle.angle) > 0 ? '#4f2d18' : '#17110d';
          ctx.lineWidth = particle.size * (1 - t * 0.45);
          ctx.beginPath();
          ctx.moveTo(px - Math.cos(particle.angle) * 7, py - Math.sin(particle.angle) * 7);
          ctx.lineTo(px + Math.cos(particle.angle) * 4, py + Math.sin(particle.angle) * 4);
          ctx.stroke();
        } else if (effect.look === 'soldier') {
          // 瀹樺叺锛氶摐鏄熺闂紝鐭績鑰岀‖鏈椼€?
          drawJaggedStar(
            px, py,
            particle.size * (1.15 - t * 0.35),
            particle.size * 0.48,
            5,
            particle.spin * t,
            '#c29145',
            '#5c401d',
            0.7
          );
        } else {
          // 瀵屽晢锛氶噾甯佹暎钀斤紝鍦嗚倸缈绘粴鏃舵洿鏈夎鲸璇嗗害銆?
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(particle.spin * t);
          ctx.scale(1, 0.48 + Math.abs(Math.cos(t * Math.PI * 5)) * 0.45);
          ctx.fillStyle = '#e4b132';
          ctx.strokeStyle = '#7b5312';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(0, 0, particle.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.restore();
    }
  }

  // ====== 灞忓箷闇囧姩(鐖嗙偢鍐插嚮) ======
  let shakeAmp = 0;          // 褰撳墠闇囧姩骞呭害(鍍忕礌)
  let shakeEndAt = 0;        // 闇囧姩缁撴潫鏃堕棿
  function triggerShake(amp) {
    // 鍙栨渶澶у€?閬垮厤灏忛渿鍔ㄨ鐩栧ぇ闇囧姩
    if (amp > shakeAmp) shakeAmp = amp;
    shakeEndAt = performance.now() + 280;
  }
  function getShakeOffset() {
    const now = performance.now();
    if (now >= shakeEndAt || shakeAmp <= 0) {
      shakeAmp = 0;
      return { x: 0, y: 0 };
    }
    const remain = (shakeEndAt - now) / 280;       // 0~1 鍓╀綑姣斾緥
    const amp = shakeAmp * remain * remain;        // 浜屾琛板噺,璧锋墜鐚涖€佹敹灏炬煍
    return {
      x: (Math.random() * 2 - 1) * amp,
      y: (Math.random() * 2 - 1) * amp,
    };
  }

  // ====== 灞忓箷闂厜(鐖嗙偢鏃朵竴闂? ======
  let flashEndAt = 0;        // 闂厜缁撴潫鏃堕棿
  let flashPeak = 0;         // 宄板€?alpha
  function triggerFlash(peak) {
    if (peak > flashPeak) flashPeak = peak;
    flashEndAt = performance.now() + 160;
  }
  function drawFlashOverlay() {
    const now = performance.now();
    if (now >= flashEndAt || flashPeak <= 0) {
      flashPeak = 0;
      return;
    }
    const remain = (flashEndAt - now) / 160;       // 1鈫?
    // 鍓?30% 寮轰繚鎸?鍚?70% 蹇€熻“鍑?
    const alpha = flashPeak * (remain < 0.7 ? remain / 0.7 : 1);
    // 涓績鐣ュ亸榛勩€佽竟缂樼櫧
    const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    grad.addColorStop(0, `rgba(255, 250, 200, ${alpha * 0.9})`);
    grad.addColorStop(0.5, `rgba(255, 230, 150, ${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(255, 220, 120, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function isBlastBlocked(from, to) {
    return M.Query.ray(wallBodies, from, to, 3).length > 0;
  }

  function destroySupport(prop) {
    if (!prop || prop.destroyed) return;
    prop.destroyed = true;
    if (prop.holdsBody) {
      M.Body.setStatic(prop.holdsBody, false);
      M.Body.applyForce(prop.holdsBody, prop.holdsBody.position, { x: 0, y: 0.004 });
      wakeBody(prop.holdsBody);
      prop.holdsBody = null;
    }
    if (prop.blocksBody) {
      M.Body.setStatic(prop.blocksBody, false);
      wakeBody(prop.blocksBody);

  // ====== 鐖嗙偢:瀵硅寖鍥村唴鏁屼汉婵€娲?鍐插嚮銆佽寖鍥村唴閬撳叿鎺ㄧЩ ======
  function explodeAt(explosiveBody) {
    if (!explosiveBody || explosiveBody.destroyed || explosiveBody.levelEpoch !== levelEpoch) return;
    const pos = explosiveBody.position;
    const phys = explosiveBody.phys;
    const radius = phys.explosionRadius * Math.min(W, H) / 720;

    let killed = 0;

    // 1) 鑼冨洿鍐呮晫浜?婵€娲绘湪鍋?+ 缁欐瘡涓?part 寰勫悜鍐插嚮
    for (const ed of enemyData) {
      if (ed.type !== 'ragdoll') continue;
      let hitPart = null, minDist = Infinity;
      for (const part of ed.allParts) {
        const d = Math.hypot(part.position.x - pos.x, part.position.y - pos.y);
        if (d < radius && d < minDist) { minDist = d; hitPart = part; }
      }
      if (!hitPart) continue;
      if (isBlastBlocked(pos, hitPart.position)) continue;

      if (!ed.activated) {
        // 婵€娲?鐢ㄥ緞鍚戞柟鍚戜綔涓?瀛愬脊"鏂瑰悜)
        const dx = hitPart.position.x - pos.x;

        activateRagdoll(ed, hitPart, hitPart.position,
          { x: (dx / dn) * 8, y: (dy / dn) * 8 }, 0, platformInfo);
        killed++;
      }

      // 缁欐瘡涓?part 娌垮緞鍚戝姞鐖嗙偢鍔?
      for (const part of ed.allParts) {
        const dx = part.position.x - pos.x;
        const dy = part.position.y - pos.y;
        const d = Math.hypot(dx, dy);
        if (d < radius) {
          const dn = d || 0.0001;
          const falloff = 1 - d / radius;
          const f = baseForce * falloff * 80;  // 鏀惧ぇ,璁╁案浣撹鐐搁
          applyImpulseAtPoint(part, part.position, { x: (dx / dn) * f, y: (dy / dn) * f });
        }
      }
    }

    // 2) 鑼冨洿鍐呴亾鍏?杩為攣寮曠垎銆佺牬鍧忔敮鎾戞垨寰勫悜鎺ㄥ紑
    for (const prop of propBodies) {
      if (prop === explosiveBody || prop.destroyed) continue;
      const dx = prop.position.x - pos.x;
      const dy = prop.position.y - pos.y;
      const d = Math.hypot(dx, dy);
      if (d < radius && !isBlastBlocked(pos, prop.position)) {
        if (prop.phys && prop.phys.explosive) {
          if (!prop.queuedExplosion) {
            prop.queuedExplosion = true;
            prop.chainDepth = (explosiveBody.chainDepth || 0) + 1;
            const epoch = levelEpoch;
            setTimeout(() => {
              if (epoch === levelEpoch) explodeAt(prop);

          }
          continue;
        }
        if (prop.phys && prop.phys.category === 'breakableSupport') {
          if (d < radius * 0.72) destroySupport(prop);
          continue;
        }
        if (prop.phys && prop.phys.category === 'staticWall') continue;
        const dn = d || 0.0001;
        const falloff = 1 - d / radius;
        const f = baseForce * falloff * 40;
        wakeBody(prop);
        if (prop.isStatic) M.Body.setStatic(prop, false);
        applyImpulseAtPoint(prop, prop.position, { x: (dx / dn) * f, y: (dy / dn) * f });
      }
    }

    // 3) 瑙嗚鐗规晥
    addExplosionEffect(pos.x, pos.y, radius);
    addBoomText(pos.x, pos.y, radius);
    AudioFX.explosion();
    // 灞忓箷闇囧姩 + 闂厜:杩為攣鐖嗙偢鏇寸寷
    const chain = explosiveBody.chainDepth || 0;
    triggerShake(Math.min(18, radius * 0.13 + chain * 4));
    triggerFlash(0.78);
    if (killed > 0) {
    } else if (explosiveBody.chainDepth > 0) {
    }

    // 4) 閿€姣佺垎鐐哥墿
    explosiveBody.destroyed = true;
    if (explosiveBody.holdsBody) {
      M.Body.setStatic(explosiveBody.holdsBody, false);
      wakeBody(explosiveBody.holdsBody);
      explosiveBody.holdsBody = null;
    }
    M.Composite.remove(world, explosiveBody);
  }

  // 瀛愬脊 vs AABB 鍙嶅皠
  function reflectBulletManual(b, ox, oy, ow, oh) {
    const nearestX = Math.max(ox, Math.min(b.x, ox + ow));
    const nearestY = Math.max(oy, Math.min(b.y, oy + oh));
    const dx = b.x - nearestX, dy = b.y - nearestY;
    const dist = Math.hypot(dx, dy);
    if (dist >= b.r) return false;
    let nx, ny;
    if (dist < 0.0001) {
      const dl = b.x - ox, dr = (ox + ow) - b.x, dt = b.y - oy, db = (oy + oh) - b.y;
      const m = Math.min(dl, dr, dt, db);
      if      (m === dl) { nx = -1; ny = 0; b.x = ox - b.r; }
      else if (m === dr) { nx =  1; ny = 0; b.x = ox + ow + b.r; }
      else if (m === dt) { nx =  0; ny = -1; b.y = oy - b.r; }
      else               { nx =  0; ny =  1; b.y = oy + oh + b.r; }
    } else {
      nx = dx / dist; ny = dy / dist;
      b.x = nearestX + nx * b.r; b.y = nearestY + ny * b.r;
    }
    const dot = b.vx * nx + b.vy * ny;
    if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; return true; }
    return false;
  }

  function removeBullet(bData, reason) {
    const idx = bullets.indexOf(bData);
    if (idx >= 0) bullets.splice(idx, 1);
    M.Composite.remove(world, bData.body);
    if (DEBUG && reason) console.log('[bullet removed]', reason);
  }

  // ====== 瀛愬脊纰版挒:鑷繁妫€娴嬫墍鏈夌洰鏍?======
  function findHitPart(ed, b) {
    if (ed.hat) {
      const hatHit = bulletVsPolygonWithPoint(b, ed.hat.vertices);
      if (hatHit.hit) return { part: ed.hat, point: hatHit.point };
    }
    if (ed.head) {
      const headDist = Math.hypot(b.x - ed.head.position.x, b.y - ed.head.position.y);
      if (headDist < b.r + ed.head.circleRadius) {
        const ux = (b.x - ed.head.position.x) / Math.max(0.0001, headDist);
        const uy = (b.y - ed.head.position.y) / Math.max(0.0001, headDist);
        return { part: ed.head, point: { x: ed.head.position.x + ux * ed.head.circleRadius, y: ed.head.position.y + uy * ed.head.circleRadius } };
      }
    }
    if (ed.torso) { const r = bulletVsPolygonWithPoint(b, ed.torso.vertices); if (r.hit) return { part: ed.torso, point: r.point }; }
    for (const arm of ed.allArms) {
      if (!arm) continue;
      const r = bulletVsPolygonWithPoint(b, arm.vertices);
      if (r.hit) return { part: arm, point: r.point };
    }
    for (const leg of ed.allLegs) {
      if (!leg) continue;
      const r = bulletVsPolygonWithPoint(b, leg.vertices);
      if (r.hit) return { part: leg, point: r.point };
    }
    return null;
  }

  // 绾挎 p1->p2 涓庣嚎娈?p3->p4 鏄惁鐩镐氦(鍖呭惈绔偣)
  function segIntersect(p1x, p1y, p2x, p2y, p3x, p3y, p4x, p4y) {
    const d1x = p2x - p1x, d1y = p2y - p1y;
    const d2x = p4x - p3x, d2y = p4y - p3y;
    const denom = d1x * d2y - d1y * d2x;
    if (Math.abs(denom) < 1e-9) return null;  // 骞宠
    const qpx = p3x - p1x, qpy = p3y - p1y;
    const t = (qpx * d2y - qpy * d2x) / denom;
    const u = (qpx * d1y - qpy * d1x) / denom;
    if (t < 0 || t > 1 || u < 0 || u > 1) return null;
    return { x: p1x + t * d1x, y: p1y + t * d1y };
  }

  // 澶氳竟褰?鐐规祴璇?:鐐规槸鍚﹀湪鍑稿杈瑰舰鍐?鐢ㄦ瘡涓竟鐨勬硶绾跨偣绉鍙峰垽)
  function pointInConvexPolygon(px, py, vertices) {
    let sign = 0;
    for (let i = 0; i < vertices.length; i++) {
      const a = vertices[i], b = vertices[(i + 1) % vertices.length];
      const ex = b.x - a.x, ey = b.y - a.y;
      const cross = ex * (py - a.y) - ey * (px - a.x);
      if (cross !== 0) {
        const s = cross > 0 ? 1 : -1;
        if (sign === 0) sign = s;
        else if (sign !== s) return false;
      }
    }
    return true;
  }

  // 瀛愬脊 vs 澶氳竟褰㈢鎾?鍚屾椂妫€娴?
  //   1) 瀛愬脊褰撳墠浣嶇疆鍒板杈瑰舰杈硅窛绂?< b.r(甯歌鎿﹁竟)
  //   2) 瀛愬脊浠庝笂涓€甯т綅缃埌褰撳墠浣嶇疆鐨?鎵帬绾挎"鏄惁绌胯繃浠讳綍杈?闃茬┛闅?
  //   3) 瀛愬脊褰撳墠鐐规槸鍚﹀湪澶氳竟褰㈠唴閮?绌块毀鍚庡凡鍦ㄥ唴閮?
  // 鍛戒腑鏃惰繑鍥炴渶杩戞帴瑙︾偣(浼樺厛甯歌鎿﹁竟,鍚﹀垯鐢ㄦ壂鎺犱氦鐐?
  function bulletVsPolygonWithPoint(b, vertices) {
    const r2 = b.r * b.r;
    let minDist2 = Infinity, nearestX = 0, nearestY = 0;
    for (let i = 0; i < vertices.length; i++) {
      const p1 = vertices[i], p2 = vertices[(i + 1) % vertices.length];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len2 = dx * dx + dy * dy;
      if (len2 < 1e-6) continue;
      let t = ((b.x - p1.x) * dx + (b.y - p1.y) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const px = p1.x + t * dx, py = p1.y + t * dy;
      const ddx = b.x - px, ddy = b.y - py;
      const d2 = ddx * ddx + ddy * ddy;
      if (d2 < minDist2) { minDist2 = d2; nearestX = px; nearestY = py; }
    }
    if (minDist2 < r2) {
      return { hit: true, point: { x: nearestX, y: nearestY }, tunneling: false };
    }
    // 鎵帬妫€娴?鐪嬪瓙寮逛粠 prevX,prevY 鍒板綋鍓?x,y 鐨勭嚎娈垫槸鍚︾┛杩囦换涓€杈?
    if (b.prevX != null) {
      let bestCross = null;
      for (let i = 0; i < vertices.length; i++) {
        const p1 = vertices[i], p2 = vertices[(i + 1) % vertices.length];
        const c = segIntersect(b.prevX, b.prevY, b.x, b.y, p1.x, p1.y, p2.x, p2.y);
        if (c) {
          if (!bestCross) bestCross = c;
          else {
            // 閫夋渶闈犺繎褰撳墠 bullet 浣嶇疆鐨勯偅涓氦鐐?
            const dNew = (b.x - c.x) ** 2 + (b.y - c.y) ** 2;
            const dBest = (b.x - bestCross.x) ** 2 + (b.y - bestCross.y) ** 2;
            if (dNew < dBest) bestCross = c;
          }
        }
      }
      if (bestCross) return { hit: true, point: bestCross, tunneling: true };
    }
    // 鍏滃簳:瀛愬脊褰撳墠鐐瑰凡鍦ㄥ杈瑰舰鍐呴儴(宸茬┛杩囧幓)
    if (pointInConvexPolygon(b.x, b.y, vertices)) {
      // 鎵炬渶杩戠殑"鍑哄彛杈?浣滀负鍛戒腑鐐?
      let bestN = null;
      for (let i = 0; i < vertices.length; i++) {
        const p1 = vertices[i], p2 = vertices[(i + 1) % vertices.length];
        const ex = p2.x - p1.x, ey = p2.y - p1.y;
        const len = Math.hypot(ex, ey) || 1;
        const nx = -ey / len, ny = ex / len;
        const dx = p1.x - b.x, dy = p1.y - b.y;
        if (nx * dx + ny * dy < 0) continue;  // 璇ヨ竟娉曠嚎鑳屽悜 bullet,璺宠繃
        if (!bestN || (dx * nx + dy * ny) < bestN.d) bestN = { p1, p2, nx, ny, d: dx * nx + dy * ny };
      }
      if (bestN) {
        return { hit: true, point: { x: b.x, y: b.y }, tunneling: true, insideNormal: { x: -bestN.nx, y: -bestN.ny } };
      }
    }
    return { hit: false, point: { x: nearestX, y: nearestY } };
  }

  // 瀛愬脊 vs 鍦嗗舰閬撳叿鐨勬壂鎺犵鎾烇細妫€娴嬫暣娈?prev鈫抍urrent锛岄伩鍏嶉珮閫熷瓙寮硅法杩囪惤鍦扮嫾鐗欑悆銆?
  function bulletVsCircleWithPoint(b, body) {
    const ax = b.prevX ?? b.x;
    const ay = b.prevY ?? b.y;
    const sx = b.x - ax;
    const sy = b.y - ay;
    const len2 = sx * sx + sy * sy;
    const cx = body.position.x;
    const cy = body.position.y;
    const t = len2 > 1e-8
      ? Math.max(0, Math.min(1, ((cx - ax) * sx + (cy - ay) * sy) / len2))
      : 0;
    const qx = ax + sx * t;
    const qy = ay + sy * t;
    let nx = qx - cx;
    let ny = qy - cy;
    const dist = Math.hypot(nx, ny);
    const combinedR = b.r + body.circleRadius;
    if (dist > combinedR) return { hit: false, point: { x: qx, y: qy } };
    if (dist > 1e-5) {
      nx /= dist;
      ny /= dist;
    } else {
      const speed = Math.hypot(b.vx, b.vy) || 1;
      nx = -b.vx / speed;
      ny = -b.vy / speed;
    }
    return {
      hit: true,
      point: {
        x: cx + nx * body.circleRadius,
        y: cy + ny * body.circleRadius,
      },
      normal: { x: nx, y: ny },
      tunneling: t > 0 && t < 1,
    };
  }

  function bulletHitsProp(b, prop) {
    if (prop.circleRadius) return bulletVsCircleWithPoint(b, prop).hit;
    return bulletVsPolygonWithPoint(b, prop.vertices).hit;
  }

  // ====== 婵€娲绘湪鍋?琚嚮涓? - 鐢辩湡瀹炵鎾炴暟鎹┍鍔ㄥ樊寮傚寲鍙嶅簲 ======
  function activateRagdoll(r, hitPart, hitPoint, bulletVel, bulletBounced, platformInfo) {
    if (r.activated) return;
    r.activated = true;
    r.e.alive = false;
    r.hitPart = hitPart;
    r.hitPoint = hitPoint;
    r.bulletVel = bulletVel;
    r.platformInfo = platformInfo;

    // 涓夌被鏁屼汉浣跨敤鍚勮嚜鐨勫彈鍑绘儴鍙紱瀵屽晢鍙﹀鍙犲姞閲戝竵鏁ｈ惤澹般€?
    AudioFX.scream('ragdoll:' + (r.look || 'bandit'));
    if (r.look === 'merchant') AudioFX.coinDrop();

    // 闃插祵鍏?
    let maxOverlap = 0;
    for (const part of r.allParts) {
      const cs = M.Query.collides(part, wallBodies.concat(platformBodies));
      for (const c of cs) {
        const col = c.collision || c;
        if (col && typeof col.depth === 'number') maxOverlap = Math.max(maxOverlap, col.depth);
      }
    }
    if (maxOverlap > 1) {
      const lift = maxOverlap + 2;
      for (const part of r.allParts) M.Body.setPosition(part, { x: part.position.x, y: part.position.y - lift });
    }
    for (const part of r.allParts) {
      M.Body.setAngularVelocity(part, 0);
      M.Body.setStatic(part, false);
    }

    const speed = Math.hypot(bulletVel.x, bulletVel.y);
    if (speed < 0.0001) {
      // 闆堕€?缃曡,渚嬪琚帇浣?鍙В闄ら潤鎬?璁╅噸鍔涙帴绠?
      r.activatedAt = Date.now();
      r.lastForce = { x: 0, y: 0 };
      return;
    }

    // ---- 鐪熷疄纰版挒鏁版嵁 ----
    const dx = bulletVel.x / speed, dy = bulletVel.y / speed;
    const energyFactor = 1.0 / (1.0 + (bulletBounced || 0) * 0.25);  // 姣忓弽寮硅“鍑?25%
    const rand = r.massRand;       // 0.92-1.08 寮哄害闅忔満
    const sideBias = r.sideBias;   // 涓綋鍋忕疆 卤0.2
    const spinRand = r.sideBias * 0.5;
    const reaction = {
      bandit:  { force: 1.10, spin: 1.38, whole: 0.0070, lift: 0.0045, hatForward: 1.20, hatLift: 1.05, joint: 0.42, damping: 1.75 },
      soldier: { force: 0.82, spin: 0.58, whole: 0.0038, lift: 0.0010, hatForward: 0.72, hatLift: 1.28, joint: 0.66, damping: 2.45 },
      merchant:{ force: 0.96, spin: 1.12, whole: 0.0058, lift: 0.0032, hatForward: 0.90, hatLift: 1.48, joint: 0.34, damping: 1.65 },
    }[r.look || 'bandit'];

    // 鍛戒腑閮ㄤ綅
    const isHat    = (hitPart === r.hat);
    const isHead   = (hitPart === r.head) || isHat;
    const isTorso  = (hitPart === r.torso);
    const isArmL   = (hitPart === r.armL);
    const isArmR   = (hitPart === r.armR);
    const isArm    = isArmL || isArmR;
    const isUpperL = (hitPart === r.upperLegL);
    const isUpperR = (hitPart === r.upperLegR);
    const isLowerL = (hitPart === r.legL);
    const isLowerR = (hitPart === r.legR);
    const isLegL   = isUpperL || isLowerL;
    const isLegR   = isUpperR || isLowerR;
    const isLeg    = isLegL || isLegR;
    const isUpperLeg = isUpperL || isUpperR;
    const isLowerLeg = isLowerL || isLowerR;

    // 鐪熷疄鍛戒腑鐐?涓栫晫鍧愭爣)
    const hx = hitPoint ? hitPoint.x : hitPart.position.x;
    const hy = hitPoint ? hitPoint.y : hitPart.position.y;
    addCharacterHitEffect(r, hx, hy, dx, dy);
    if (r.look === 'merchant') spawnMerchantCoins(r, r.torso.position.x, r.torso.position.y, dx, dy);
    // 鐩稿鍛戒腑閮ㄤ欢璐ㄥ績
    const partOX = hx - hitPart.position.x;
    const partOY = hy - hitPart.position.y;
    // 鐩稿韬共璐ㄥ績(鍐冲畾鏁翠綋鏃嬭浆)
    const cx = r.torso.position.x, cy = r.torso.position.y;
    const torsoOX = hx - cx;
    const torsoOY = hy - cy;

    // ---- 鍐插嚮鏂瑰悜(鍦ㄥ瓙寮规柟鍚戜笂鍔犲亸缃?浜х敓鍚庝话/濉屽€?渚х炕宸紓) ----
    let fx = dx, fy = dy;
    if (isHead)              fy -= 0.18;  // 澶村亸涓?鍚庝话鎰?
    else if (isTorso) {
      if (torsoOY < -3)      fy -= 0.18;  // 鍛戒腑韬共涓?鈫?澶村悗浠?
      else if (torsoOY > 3)  fy += 0.22;  // 鍛戒腑韬共涓?鈫?閲嶅績涓嬪
    } else if (isLeg)        fy += 0.10;  // 鍛戒腑鑵?鈫?鐣ヤ笅鍘?
    else if (isArm)          fy += 0.04;  // 鍛戒腑鑷?鈫?鐣ヤ笅
    const fMag = Math.hypot(fx, fy) || 1;
    fx /= fMag; fy /= fMag;

    // 璁板綍鏈€缁堟柦鍔涘悜閲?鐢ㄤ簬璋冭瘯鏄剧ず)
    r.lastForce = { x: fx, y: fy };

    // ---- 1) 鍦ㄧ湡瀹炲懡涓偣瀵瑰懡涓儴浠舵柦鍔?----
    const baseF = 0.025 * reaction.force;
    let partMul = 1.0, torsoMul = 0.5, headMul = 0.3;
    if (isHead)        { partMul = 1.5; torsoMul = 0.65; headMul = 1.0; }
    else if (isTorso)  { partMul = 2.6; torsoMul = 1.0;  headMul = 0.3; }
    else if (isArm)    { partMul = 0.7; torsoMul = 0.22; headMul = 0.10; }
    else if (isLeg)    { partMul = 2.0; torsoMul = 0.50; headMul = 0.18; }
    const fScale = baseF * partMul * rand * energyFactor;
    M.Body.applyForce(hitPart, { x: hx, y: hy }, { x: fx * fScale, y: fy * fScale });

    // 灞€閮ㄦ壄鐭?鍩轰簬鍛戒腑閮ㄤ欢鍋忕Щ 鈫?鑷劧浜х敓"涓?涓?渚?缈?
    const localTorque = (partOX * fy - partOY * fx);
    M.Body.setAngularVelocity(hitPart, hitPart.angularVelocity + localTorque * 0.30 * rand * energyFactor);

    // 澶村懡涓?棰濆鐢╁姩(鏃犺鍛戒腑鐐逛綅缃?澶撮兘瑕?琚墦椋?)
    if (isHead) {
      M.Body.setAngularVelocity(r.head, r.head.angularVelocity + dx * 0.55 * rand * energyFactor + spinRand);
    }

    // ---- 2) 韬共鍦ㄥ懡涓偣澶勫彈鍔?+ 鏁翠綋鏃嬭浆(鍐冲畾鍊掑湴鏂瑰悜) ----
    const tScale = baseF * torsoMul * rand * energyFactor;
    M.Body.applyForce(r.torso, { x: hx, y: hy }, { x: fx * tScale, y: fy * tScale });

    // 韬共鏃嬭浆 = 鍛戒腑鐐瑰亸绉绘壄鐭?+ 瀛愬脊鏂瑰悜鍩虹鏃嬭浆 + 涓綋鍋忕疆
    let torsoSpin = (torsoOX * fy - torsoOY * fx) * 0.28;
    torsoSpin += dx * 0.18;            // 瀛愬脊 x 鏂瑰悜鍩虹鏃嬭浆
    torsoSpin += sideBias;             // 姣忔晫浜哄乏鍙冲亸缃?
    // 渚ч潰鍛戒腑鏀惧ぇ(璁?渚х炕"鏇存槑鏄?
    if (isTorso) {
      const sideAmt = Math.min(1, Math.abs(torsoOX) / 5);
      torsoSpin *= (1 + sideAmt * 0.5);
    }
    torsoSpin *= reaction.spin;
    M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + torsoSpin * rand * energyFactor);

    // ---- 3) 澶撮儴鍙楀姏(闈炲ご閮ㄥ懡涓椂涔熷搷搴? ----
    if (!isHead) {
      const hScale = baseF * headMul * rand * energyFactor;
      M.Body.applyForce(r.head, r.head.position, { x: fx * hScale, y: fy * hScale });
      M.Body.setAngularVelocity(r.head, r.head.angularVelocity + dx * 0.18 * rand * energyFactor + spinRand);
    }

    // ---- 4) 鑵垮懡涓?琚懡涓吙涓诲啿鍑?鍙︿竴鏉¤吙鍙嶅悜鏀拺鍔ㄤ綔(涓嶅悓鏃跺睍寮€) ----
    if (isLeg) {
      const propFactor = isUpperLeg ? 1.15 : 0.7;  // 涓婅吙鏇翠紶鍚戣函骞?
      const otherLower = isLegL ? r.legR : r.legL;
      const otherUpper = isLegL ? r.upperLegR : r.upperLegL;
      if (otherLower) {
        M.Body.applyForce(otherLower, otherLower.position, {
          x: -dx * baseF * 0.45 * rand,
          y: -dy * baseF * 0.25 * rand - baseF * 0.12,
        });
        M.Body.setAngularVelocity(otherLower, otherLower.angularVelocity + (-dx) * 0.18 * rand);
      }
      if (otherUpper) {
        M.Body.applyForce(otherUpper, otherUpper.position, {
          x: -dx * baseF * 0.30 * rand,
          y: baseF * 0.08 * rand,
        });
      }
      // 鍛戒腑渚ц函骞叉í鍚戝彈鍔?鍗曚晶澶辫　 鈫?璺?渚у€?
      M.Body.applyForce(r.torso, { x: cx + (isLegL ? -3 : 3), y: cy }, {
        x: dx * baseF * 0.45 * propFactor * rand,
        y: baseF * 0.30 * propFactor * rand,
      });
    }

    // ---- 5) 鍙嶅脊鏃嬭浆鍔犳垚(鏂滃悜鍙嶅脊鍛戒腑鍚庢棆杞€掑湴) ----
    if (bulletBounced > 0) {
      const bounceSpin = (Math.random() - 0.5) * 0.35 * Math.min(bulletBounced, 3);
      M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + bounceSpin);
    }

    // ---- 6) 骞冲彴杈圭紭鍔犳垚(鍛戒腑鏂瑰悜鏈濈潃骞冲彴杈圭紭 鈫?鏇存槗璺岃惤) ----
    if (platformInfo) {
      const { distLeft, distRight } = platformInfo;
      const edgeT = 35;
      if (dx < 0 && distLeft < edgeT) {
        const k = 1 - distLeft / edgeT;
        M.Body.applyForce(r.torso, { x: cx, y: cy }, { x: -baseF * 0.7 * k, y: -baseF * 0.25 * k });
        M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity - 0.28 * k);
      } else if (dx > 0 && distRight < edgeT) {
        const k = 1 - distRight / edgeT;
        M.Body.applyForce(r.torso, { x: cx, y: cy }, { x: baseF * 0.7 * k, y: -baseF * 0.25 * k });
        M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + 0.28 * k);
      }
    }

    // ---- 7) 鏂瑰悜鐗规畩鏁堟灉(鑷笅鑰屼笂 / 鑷笂鑰屼笅) ----
    if (dy < -0.4) {  // 鑷笅鑰屼笂鍛戒腑
      M.Body.applyForce(r.torso, r.torso.position, { x: 0, y: -baseF * 0.55 * rand });
      M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + dx * 0.15);
    } else if (dy > 0.4 && !isLeg) {  // 鑷笂鑰屼笅鍛戒腑(琚噸鐗╃牳 鈫?鍚戜笅濉屽€?
      M.Body.applyForce(r.torso, r.torso.position, { x: 0, y: baseF * 0.55 * rand });
      M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + dx * 0.10);
    }

    // ---- 8) 鍚勮韩浠界殑鏁翠綋鍙楀嚮鍔ㄤ綔 ----
    M.Body.applyForce(r.torso, r.torso.position, {
      x: dx * reaction.whole,
      y: dy * reaction.whole - reaction.lift,
    });
    if (r.look === 'bandit') {
      // 鐦﹂珮鍦熷尓鍥涜偄鐢╁緱鏇村紑锛屽舰鎴愯交蹇晶缈汇€?
      M.Body.applyForce(r.armL, r.armL.position, { x: -dx * 0.006, y: -0.006 });
      M.Body.applyForce(r.armR, r.armR.position, { x: dx * 0.006, y: -0.005 });
      M.Body.setAngularVelocity(r.armL, -dx * 0.34);
      M.Body.setAngularVelocity(r.armR, dx * 0.38);
    } else if (r.look === 'soldier') {
      // 瀹樺叺鏇撮噸锛屼富瑕佹暣鍧楀悗浠帮紝鍥涜偄涓嶄細绔嬪埢鏁ｅ紑銆?
      M.Body.applyForce(r.torso, r.torso.position, { x: dx * 0.0045, y: 0.0015 });
      M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity * 0.72);
    } else if (r.look === 'merchant') {
      // 瀵屽晢鍥寸粫鍦嗚倸閲嶅績缈绘粴锛屽弻鑷備笂鎵紝鍊掑湴鏇存粦绋姐€?
      M.Body.setAngularVelocity(r.torso,
        r.torso.angularVelocity + (Math.abs(dx) > 0.05 ? Math.sign(dx) : 1) * 0.20);
      M.Body.applyForce(r.armL, r.armL.position, { x: -0.0035, y: -0.0055 });
      M.Body.applyForce(r.armR, r.armR.position, { x: 0.0035, y: -0.0055 });
    }

    // ---- 9) 甯藉瓙鑴辫惤锛氭部鍙楀嚮鏂瑰悜鍓嶅啿锛屽悓鏃跺悜涓婂脊璧峰苟蹇€熸棆杞?----
    // 甯藉瓙娌℃湁杩炴帴绾︽潫锛岃惤鍦板悗浼氱户缁脊璺?婊氬姩锛涚洿鎺ュ懡涓附瀛愭椂椋炲緱鏇磋繙銆?
    if (r.hat) {
      const side = Math.abs(dx) > 0.08 ? Math.sign(dx) : (sideBias >= 0 ? 1 : -1);
      const directHatBoost = isHat ? 1.28 : 1;
      const hatForward = Math.min(9.2,
        (3.1 + speed * 0.48) * directHatBoost * reaction.hatForward);
      const hatLift = Math.min(8.2,
        (3.8 + speed * 0.30) * directHatBoost * reaction.hatLift);
      M.Body.setVelocity(r.hat, {
        x: dx * hatForward + side * 1.15,
        y: dy * Math.min(2.2, speed * 0.24) - hatLift,
      });
      M.Body.setAngularVelocity(r.hat,
        Math.max(-0.65, Math.min(0.65,
          side * (0.34 + speed * 0.025) + sideBias * 0.22)));
      if (M.Sleeping) M.Sleeping.set(r.hat, false);
    }

    // 瀹樺叺鐨勮儗鏋劚绂昏韩浣擄紝鍚戜笂缈婚鍚庝氦鐢遍噸鍔涜嚜鐒惰惤涓嬨€?
    if (r.backRifle) {
      const rifleSide = Math.abs(dx) > 0.08 ? Math.sign(dx) : 1;
      M.Body.setVelocity(r.backRifle, {
        x: dx * Math.min(7.5, 3.6 + speed * 0.34) - rifleSide * 0.8,
        y: dy * Math.min(2.2, speed * 0.18) - Math.min(7.8, 5.1 + speed * 0.20),
      });
      M.Body.setAngularVelocity(r.backRifle, rifleSide * 0.46 + sideBias * 0.18);
      if (M.Sleeping) M.Sleeping.set(r.backRifle, false);
    }

    r.activatedAt = Date.now();

    // 姝讳骸鍚庢寜韬唤鏀炬澗锛氬湡鍖伒娲汇€佸畼鍏垫垚鍧椼€佸瘜鍟嗘渶鏉捐蒋銆?
    for (const c of r.constraints) {
      c.stiffness *= reaction.joint;
      c.damping *= reaction.damping;
    }
  }

  // 浜屾鍑讳腑(鍙婁箣鍚庝换鎰忔) - 鍔涘害绾︿负棣栧嚮鐨?30%,璁╁案浣撹交寰Щ鍔?缈昏韩/鎺変笅骞冲彴
  function applySecondaryHit(r, part, hitPoint, vel) {
    const speed = Math.hypot(vel.x, vel.y);
    if (speed < 0.0001) return;
    const dx = vel.x / speed, dy = vel.y / speed;
    // 鍗曠偣鍐插嚮 鈮?0.008(棣栧嚮瀵瑰懡涓儴浠?鈮?0.025 脳 1.0~2.6 鈮?0.025鈥?.065,30% 钀藉湪鍚堢悊鍖洪棿)
    M.Body.applyForce(part, hitPoint || part.position, { x: dx * 0.008, y: dy * 0.008 });
    M.Body.setAngularVelocity(part, part.angularVelocity + dx * 0.10);
    M.Body.applyForce(r.torso, r.torso.position, { x: dx * 0.006, y: dy * 0.006 });
    M.Body.setAngularVelocity(r.torso, r.torso.angularVelocity + dx * 0.08);
    for (const limb of r.allLimbs) {
      M.Body.applyForce(limb, limb.position, { x: dx * 0.004, y: dy * 0.004 });
    }
  }

  function propCanDamageCharacters(prop) {
    // 鍙岀怀閮藉畬濂芥椂鐙肩墮鐞冨彧鏄緟鏈烘満鍏筹紱蹇呴』鍏堝皠鏂竴鏍圭怀瀛愭墠浼氶€犳垚浼ゅ銆?
    return prop.propType !== 'swing_hammer' || prop.ropeReleased === true;
  }

  // 鏈ㄧ鐨勬挒鍑讳笉鏄€滄斁澶х増瀛愬脊鈥濓細瀹冧細鎶婃暣涓汉鎺ㄥ€掞紝鍚屾椂璁╁ご鍜屽洓鑲㈢◢寰粸鍚庯紝
  // 褰㈡垚鏈夐噸閲忕殑缈绘粴鏈ㄥ伓锛岃€屼笉鏄師鍦颁竴杞氨鍊掋€?
  function applyBoxRagdollImpact(r, hitPart, hitPoint, prop, propSpeed, impact) {
    if (!r || !r.activated || propSpeed < 0.001) return;

    const ux = prop.velocity.x / propSpeed;
    const uy = prop.velocity.y / propSpeed;
    const shoveSpeed = Math.min(7.8, Math.max(3.8,
      propSpeed * 1.08 + Math.min(1.8, impact * 0.12)));
    const liftSpeed = Math.min(2.6, Math.max(1.25, 0.9 + propSpeed * 0.18));
    const torso = r.torso;

    for (const part of r.allParts) {
      let transfer = 0.68;
      if (part === torso) transfer = 1.0;
      else if (part === hitPart) transfer = 1.16;
      else if (part === r.hat) transfer = 1.12;
      else if (part === r.head) transfer = 0.84;

      // 鍥涜偄淇濈暀涓€鐐规í鍚戝垎绂婚噺锛岄伩鍏嶆墍鏈夐儴浠跺儚涓€鍧楀垰浣撳悓姝ラ璧般€?
      const spread = Math.max(-0.45, Math.min(0.45,
        (part.position.x - torso.position.x) * 0.055));
      const partLift = part === r.hat ? 1.65
        : (part === r.head ? 1.12 : (part === torso ? 0.88 : 0.72));
      M.Body.setVelocity(part, {
        x: part.velocity.x * 0.22 + ux * shoveSpeed * transfer + spread,
        y: part.velocity.y * 0.22 + uy * shoveSpeed * 0.56 * transfer - liftSpeed * partLift,
      });
      if (M.Sleeping) M.Sleeping.set(part, false);
    }

    // 鎾炲嚮鐐硅秺闈犱笂锛岃函骞茶秺瀹规槗椤虹潃绠卞瓙鏂瑰悜缈昏繃鍘伙紱浣庝綅鍛戒腑鍒欐洿鍍忚閾插€掋€?
    const hitY = hitPoint && Number.isFinite(hitPoint.y) ? hitPoint.y : torso.position.y;
    const highHit = Math.max(-1, Math.min(1, (torso.position.y - hitY) / 15));
    const rollSpin = Math.max(-0.44, Math.min(0.44,
      ux * (0.24 + highHit * 0.12) + uy * 0.08));
    M.Body.setAngularVelocity(torso, rollSpin);
    M.Body.setAngularVelocity(r.head,
      Math.max(-0.46, Math.min(0.46, rollSpin * 1.18 - ux * 0.08)));

    const limbs = r.allLimbs || [];
    for (let i = 0; i < limbs.length; i++) {
      const phase = i % 2 === 0 ? 1 : -1;
      M.Body.setAngularVelocity(limbs[i],
        Math.max(-0.42, Math.min(0.42, rollSpin * 0.65 + phase * ux * 0.11)));
    }
    if (r.hat) {
      M.Body.setAngularVelocity(r.hat,
        Math.max(-0.5, Math.min(0.5, ux * 0.46 + rollSpin * 0.45)));
    }

    // 鍦ㄧ湡瀹炴帴瑙︾偣鍐嶈ˉ涓€璁板眬閮ㄥ啿閲忥紝璁╄绠辫鎾炲埌鐨勮韩浣撻儴浠跺厛鐢╁嚭鍘汇€?
    const localForce = Math.min(0.026, Math.max(0.011, impact * 0.0028));
    M.Body.applyForce(hitPart, hitPoint || hitPart.position, {
      x: ux * localForce,
      y: uy * localForce - localForce * 0.16,
    });

    // 閫氱敤鏈ㄥ伓宸茬粡鏀炬澗涓€娆″叧鑺傦紱鏈ㄧ鍐叉挒鍐嶅皬骞呮斁鏉撅紝淇濈暀楠ㄦ灦浣嗗姞寮虹敥鍔ㄣ€?
    for (const c of r.constraints) {
      c.stiffness *= 0.82;
      c.damping *= 1.08;
    }
  }

  function getPropImpactSpeed(prop) {
    const linearSpeed = Math.hypot(prop.velocity.x, prop.velocity.y);
    const radius = prop.circleRadius || prop.propR || 0;
    const edgeSpeed = radius > 0 ? Math.abs(prop.angularVelocity || 0) * radius : 0;
    // 鍦嗗舰鏈哄叧婊氬姩鏃讹紝妗舵部涓庡湴闈㈢殑杞€熷悓鏍峰叿鏈夌⒕鍘嬭兘鍔涖€?
    return Math.max(linearSpeed, edgeSpeed, linearSpeed + edgeSpeed * 0.35);
  }

  // ====== 閬撳叿浼ゅ:璐ㄩ噺 脳 鏈夋晥鍐插嚮閫熷害闃堝€?======
  function applyPropDamage(prop, enemy, enemyPart, collisionPoint) {
    if (!enemy.e.alive) return;
    if (!propCanDamageCharacters(prop)) return;
    const propSpeed = getPropImpactSpeed(prop);
    const minSpeed = prop.phys && prop.phys.damageSpeed != null
      ? prop.phys.damageSpeed : MIN_PROP_DAMAGE_SPEED;
    if (propSpeed < minSpeed) return;  // 浣庨€熷彧鎺?
    const impact = prop.mass * propSpeed;
    const minImpact = prop.phys && prop.phys.damageImpact != null
      ? prop.phys.damageImpact : MIN_PROP_IMPACT;
    if (impact < minImpact) return;
    const vel = { x: prop.velocity.x, y: prop.velocity.y };
    const point = collisionPoint || { x: enemyPart.position.x, y: enemyPart.position.y };
    const platformInfo = computePlatformInfo(enemy.e);
    activateRagdoll(enemy, enemyPart, point, vel, 0, platformInfo);
    if (prop.propType === 'box') {
      applyBoxRagdollImpact(enemy, enemyPart, point, prop, propSpeed, impact);
    }
    // 闊虫晥:鐙肩墮鐞?鍙岀怀閾侀敜)鐢ㄦ矇閲嶉噸鍑?
    if (prop.propType === 'swing_hammer' || prop.propType === 'pendulum') {
      AudioFX.hammerHit();
    }
  }

  // ====== 鐜╁姝讳骸(琚?prop 鎾炲埌 鈫?鏈ㄥ伓鍖?+ 娓告垙澶辫触) ======
  // 澶嶇敤 enemy 鐨?createRagdoll,鍦ㄧ帺瀹惰剼涓嬬敓鎴愪竴涓湪鍋?娌?prop 椋炶鏂瑰悜鏂藉姞鍐插嚮
  function killPlayer(prop, contactPoint) {
    if (!player.alive) return;
    player.alive = false;
    gameState = 'dead';
    if (prop && (prop.propType === 'swing_hammer' || prop.propType === 'pendulum')) {
      AudioFX.hammerHit();
    }
    AudioFX.scream('player-death');
    // 绉婚櫎鐜╁鐨?hitbox(閬垮厤閲嶅瑙﹀彂)
    if (player.body) {
      M.Composite.remove(world, player.body);
      player.body = null;
    }
    // 鐢ㄥ悓涓€濂楁湪鍋堕鏋跺湪鐜╁鍘熶綅缃敓鎴愬彈鍑昏韩浣撱€?
    // 鏀惧ぇ鍚庣殑涓昏姝讳骸鏃朵粛淇濇寔鍚岀瓑浣撻噺锛屼笉鍐嶅嚭鐜板€掑湴鍚庤韩褰㈢缉灏忋€?
    const playerRagdollScale = 1.75 * (PLAYER_SCALE / 1.10);
    const fakePlayer = {
      x: player.footX,
      y: player.footY - 34 * PLAYER_SCALE,
      alive: true,
      scale: playerRagdollScale,
      isPlayer: true,
    };
    playerRagdoll = {
      type: 'ragdoll',
      isPlayer: true,
      scale: playerRagdollScale,
      e: fakePlayer,
      ...createRagdoll(fakePlayer),
      activated: true,
      activatedAt: Date.now(),
      hitPart: null,
      hitPoint: contactPoint,
      bulletVel: { x: prop.velocity.x, y: prop.velocity.y },
    };
    M.Composite.add(world, [...playerRagdoll.allParts, ...playerRagdoll.constraints]);
    for (const part of playerRagdoll.allParts) {
      M.Body.setStatic(part, false);
      if (M.Sleeping) M.Sleeping.set(part, false);
    }
    // 娌块殰纰嶇墿椋炶鏂瑰悜鎶婄帺瀹舵湪鍋舵挒椋炪€?
    const vel = { x: prop.velocity.x, y: prop.velocity.y };
    const speed = Math.hypot(vel.x, vel.y);
    if (speed > 0.01) {
      const ux = vel.x / speed, uy = vel.y / speed;
      for (const part of playerRagdoll.allParts) {
        M.Body.setVelocity(part, {
          x: ux * Math.min(10, speed * 0.85),
          y: uy * Math.min(10, speed * 0.85) - 2.2,
        });
        M.Body.setAngularVelocity(part, (Math.random() - 0.5) * 0.22);
      }
    }
    // 鍏宠妭鍙樿蒋锛屽舰鎴愭槑鏄剧殑鏈ㄥ伓鐢╁姩鏁堟灉銆?
    for (const c of playerRagdoll.constraints) {
      c.stiffness *= 0.45;
      c.damping *= 1.6;
    }
    const propNames = {
      barrel: '木桶', stone: '巨石', box: '木箱', explosive: '炸药桶',
      pendulum: '狼牙球', swing_hammer: '狼牙球', iron_ball: '铁球', ball: '圆球',
    };
    const killerName = propNames[prop.propType] || '障碍物';
    msgEl.textContent = `${killerName}击中主角，闯关失败`;
    const epoch = levelEpoch;
    setTimeout(() => {
      if (epoch !== levelEpoch || gameState !== 'dead') return;
      overlay.classList.add('show');
    }, 1800);
  }

  // collisionStart 鍦ㄩ珮閫熴€佸皬姝ヨ繘鎴栧垰浠庣潯鐪犱腑鍞ら啋鏃跺彲鑳芥紡鎺?sensor 浜嬩欢銆?
  // 姣忓抚鍐嶅仛涓€娆＄簿纭噸鍙犳鏌ワ紝淇濊瘉鏈ㄦ《銆佸法鐭炽€侀搧閿ょ瓑浠讳綍闅滅鐗╃鍒颁富瑙掗兘鑳借嚧姝汇€?
  function checkPlayerPropHits() {
    if (!player.alive || !player.body || gameState !== 'playing') return;
    for (const prop of propBodies) {
      if (!prop || prop.destroyed || !prop.label || !prop.label.startsWith('prop_')) continue;
      if (!propCanDamageCharacters(prop)) continue;
      if (!M.Bounds.overlaps(prop.bounds, player.body.bounds)) continue;
      const collision = M.Collision.collides(prop, player.body);
      if (!collision) continue;
      const support = collision.supports && collision.supports[0];
      killPlayer(prop, support
        ? { x: support.x, y: support.y }
        : { x: prop.position.x, y: prop.position.y });
      break;
    }
  }

  // 楂橀€熸粴鍔ㄧ墿鍦ㄥ垎姝ョ墿鐞嗚В绠椾腑鍙兘瓒婅繃 collisionStart锛涢€愬抚琛ユ淇濊瘉鏈ㄦ《鐪熸鑳界⒕姝绘晫浜恒€?
  function checkEnemyPropHits() {
    for (const prop of propBodies) {
      if (!prop || prop.destroyed || prop.isStatic ||
          !prop.label || !prop.label.startsWith('prop_') ||
          !propCanDamageCharacters(prop)) continue;
      if (getPropImpactSpeed(prop) < 0.2) continue;

      for (const enemy of enemyData) {
        if (!enemy.e.alive || enemy.activated) continue;
        for (const part of enemy.allParts) {
          if (!M.Bounds.overlaps(prop.bounds, part.bounds)) continue;
          const collision = M.Collision.collides(prop, part);
          if (!collision) continue;
          const support = collision.supports && collision.supports[0];
          applyPropDamage(
            prop,
            enemy,
            part,
            support ? { x: support.x, y: support.y } : { x: part.position.x, y: part.position.y }
          );
          break;
        }
      }
    }
  }

  // ====== 璁＄畻鏁屼汉鎵€鍦ㄥ钩鍙扮殑杈圭紭璺濈(鐢ㄤ簬鍐冲畾鏄惁鏇村鏄撹穼钀? ======
  function computePlatformInfo(e) {
    for (const p of levelData.platforms) {
      const px = p.xR * W, py = p.yR * H, pw = p.wR * W;
      if (e.x >= px - 5 && e.x <= px + pw + 5 && Math.abs(e.y - py) < 15) {
        return { distLeft: e.x - px, distRight: px + pw - e.x, width: pw, platform: p };
      }
    }
    return null;
  }

  // ====== 杈撳叆 ======
  function setMouse(e) {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W / r.width);
    mouseY = (e.clientY - r.top)  * (H / r.height);
  }
  canvas.addEventListener('pointermove', setMouse);
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    setMouse(e);
    shoot();
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  // 閲嶅惎鎸夐挳琚幓鎺変簡 鈥?R 閿粛鐒舵湁鏁?keydown 鐩戝惉閲屽鐞?

  // ====== Matter 纰版挒浜嬩欢:鍔ㄦ€侀亾鍏?vs 鏁屼汉(娲?姝? + 杩為攣鐖嗙偢 ======
  M.Events.on(engine, 'collisionStart', (event) => {
    for (const pair of event.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      // 1) 浠绘剰 prop 鎾炲埌 explosive 鈫?绔嬪嵆鐖嗙偢(杩為攣)
      let explosive = null;
      if (a.phys && a.phys.explosive && !a.destroyed) explosive = a;
      else if (b.phys && b.phys.explosive && !b.destroyed) explosive = b;
      if (explosive) {
        // 鍙湪瀵规柟"鏄姩鎬佺墿浣?鏃舵墠寮曠垎(閬垮厤鍜屽湴闈?澧欐帴瑙﹀氨鐐?
        const other = (explosive === a) ? b : a;
        const isOtherProp = other.label && (other.label.startsWith('prop_') || other.label === 'enemy_part');
        const relativeSpeed = Math.hypot(
          (a.velocity.x || 0) - (b.velocity.x || 0),
          (a.velocity.y || 0) - (b.velocity.y || 0)
        );
        if (isOtherProp && relativeSpeed > 0.45) {
          // 鐭殏寤惰繜璁?鎾炲嚮"鍏堝湪瑙嗚涓婂憟鐜?
          const epoch = levelEpoch;
          setTimeout(() => {
            if (epoch === levelEpoch) explodeAt(explosive);
          }, 30);
          continue;
        }
      }

      // 2) 鍔ㄦ€侀亾鍏?vs 鏁屼汉
      let prop = null, enemyPart = null;
      const isPropA = a.label && a.label.startsWith('prop_') && !a.isStatic && !a.destroyed;
      const isPropB = b.label && b.label.startsWith('prop_') && !b.isStatic && !b.destroyed;
      const isPartA = a.label === 'enemy_part';
      const isPartB = b.label === 'enemy_part';
      if (isPropA && isPartB) { prop = a; enemyPart = b; }
      else if (isPropB && isPartA) { prop = b; enemyPart = a; }
      if (prop && enemyPart) {
        const enemy = enemyData.find(e => e.allParts && e.allParts.includes(enemyPart));
        if (enemy) {
          const cp = pair.collision && pair.collision.supports && pair.collision.supports[0]
            ? { x: pair.collision.supports[0].x, y: pair.collision.supports[0].y }
            : { x: enemyPart.position.x, y: enemyPart.position.y };
          if (!enemy.activated) {
            // 瀛樻椿鏁屼汉:鍙湁閫熷害涓庡姩閲忛兘杈炬爣鎵嶉€犳垚鍑绘潃,鎱㈤€熸帴瑙﹀彧浼氭帹鎸?
            applyPropDamage(prop, enemy, enemyPart, cp);
          } else {
            // 宸叉:浜屾鍐插嚮
            const propSpeed = Math.hypot(prop.velocity.x, prop.velocity.y);
            if (propSpeed > 0.6) {
              applySecondaryHit(enemy, enemyPart, cp,
                { x: prop.velocity.x, y: prop.velocity.y });
            }
          }
        }
      }

      // 3) 鍔ㄦ€侀亾鍏?vs 鐜╁ 鈫?鐜╁姝讳骸(鏈ㄦ《鎺変笅鏉ョ牳鍒颁篃绠?
      if (gameState === 'playing' && player.alive) {
        let hitProp = null;
        if (a.label === 'player_hitbox' && isPropB) hitProp = b;
        else if (b.label === 'player_hitbox' && isPropA) hitProp = a;
        if (hitProp && propCanDamageCharacters(hitProp)) {
          // 浠讳綍鍔ㄦ€侀亾鍏锋挒鍒扮帺瀹堕兘绠楁浜?涓嶅啀鍙檺 pendulum+ropeCut)
          // 鍦伴潰/澧?骞冲彴宸插湪 isPropA/isPropB 杩囨护涓帓闄?
          const cp = pair.collision && pair.collision.supports && pair.collision.supports[0]
            ? { x: pair.collision.supports[0].x, y: pair.collision.supports[0].y }
            : { x: hitProp.position.x, y: hitProp.position.y };
          killPlayer(hitProp, cp);
        }
      }
    }
  });

  // 鍦ㄦ満鍏崇粡杩囨渶浣庣偣鏃惰ˉ鍥炲皯閲忕怀缁撴崯鑰楋紝璁╅噴鏀惧悗鐨勭嫾鐗欑悆鎸佺画寰€澶嶆憜鍔ㄣ€?
  // 鍙岀怀寰呮満鏃朵笉椹卞姩锛涗袱鏍圭怀瀛愰兘鏂紑鍚庝篃鍋滄琛ュ伩锛屽畬鍏ㄤ氦杩樼粰鎯€у拰閲嶅姏銆?
  function maintainSwingMotion() {
    for (const rope of ropes) {
      if (!rope.continuousSwing || rope.isCut) continue;
      let load = null;
      let pivot = null;
      if (rope.kind === 'pendulum') {
        load = rope.ball;
        pivot = rope.pivot;
      } else if (rope.kind === 'swing_hammer' && rope.hammerBody?.ropeReleased) {
        const intactRope = rope.subRopes.find(sub => !sub.isCut);
        load = rope.hammerBody;
        pivot = intactRope?.pivot;
      }
      if (!load || !pivot || load.destroyed) continue;

      const dx = load.position.x - pivot.position.x;
      const dy = load.position.y - pivot.position.y;
      const radius = Math.hypot(dx, dy);
      if (radius < 1) continue;

      // theta=0 琛ㄧず鏈€浣庣偣锛涘垏绾挎柟鍚戝搴?theta 澧炲ぇ鐨勬柟鍚戙€?
      const theta = Math.atan2(dx, dy);
      const tx = dy / radius;
      const ty = -dx / radius;
      const tangentSpeed = load.velocity.x * tx + load.velocity.y * ty;
      if (Math.abs(tangentSpeed) > 0.12) {
        rope.swingDirection = Math.sign(tangentSpeed);
      }

      if (Math.abs(theta) > rope.driveZone) continue;
      const speedGap = rope.driveSpeed - Math.abs(tangentSpeed);
      if (speedGap <= 0) continue;
      const direction = rope.swingDirection || (theta >= 0 ? -1 : 1);
      const boost = Math.min(0.12, speedGap * 0.05);
      M.Body.setVelocity(load, {
        x: load.velocity.x + tx * direction * boost,
        y: load.velocity.y + ty * direction * boost,
      });
    }
  }

  // ====== 涓诲惊鐜?======
  function update() {
    // 1) 瀛愬脊鏇存柊 + 纰版挒妫€娴?
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.prevX = b.x; b.prevY = b.y;
      b.x += b.vx; b.y += b.vy;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 4) b.trail.shift();

      let hit = false;
      // 0) 缁冲瓙娈?鍒囩怀):鍏堜簬澧?骞冲彴/prop 妫€娴?鍒囧畬涓嶇畻"鎾炲埌涓滆タ"
      //    - 鍛戒腑鑼冨洿 = 瀛愬脊鍗婂緞 + 20(纭繚娈典笌娈典箣闂存病绌洪殭,涓旂収椤剧帺瀹剁瀯鍋忕殑鎯呭喌)
      //    - 鎵帬妫€娴?鐢?prevX/prevY 鈫?x/y 鐨勭嚎娈?璺熸瘡鏍圭怀瀛愬仛娈垫鐩镐氦,
      //      闃叉"瀛愬脊涓€甯ц法杩囨暣鏍圭怀"鐨勬紡妫€
      if (!hit && ropeSegments.length > 0) {
        const hitR = b.r + 20;
        const hitR2 = hitR * hitR;
        // 1) 褰撳墠浣嶇疆 vs 娈典腑蹇?
        let cutSeg = null;
        for (const seg of ropeSegments) {
          if (seg.destroyed || seg.bulletPassThrough) continue;
          const dx = b.x - seg.position.x, dy = b.y - seg.position.y;
          if (dx * dx + dy * dy < hitR2) { cutSeg = seg; break; }
        }
        // 2) 鎵帬:瀛愬脊绉诲姩绾挎 vs 缁冲瓙娈?pivot鈫抯eg鈫?..鈫抌all)
        if (!cutSeg) {
          for (const rope of ropes) {
            // 閬嶅巻姣忔潯 sub-rope(閽熸憜 1 鏉?閾侀敜 2 鏉?
            const subRopesToScan = rope.subRopes || [];
            for (const sub of subRopesToScan) {
              if (sub.isCut) continue;
              const endBody = sub.endBody;
              // 鎷兼帴鎶樼嚎:pivot 鈫?segments 鈫?endBody
              const points = [sub.pivot, ...sub.segments, endBody].filter(p => p && !p.destroyed);
              for (let i = 0; i < points.length - 1; i++) {
                const ax = b.prevX ?? b.x, ay = b.prevY ?? b.y;
                const cx = segIntersect(ax, ay, b.x, b.y,
                  points[i].position.x, points[i].position.y,
                  points[i+1].position.x, points[i+1].position.y);
                if (cx) { cutSeg = sub.segments.find(s => s && !s.destroyed) || points[i]; break; }
              }
              if (cutSeg) break;
            }
            if (cutSeg) break;
          }
        }
        if (cutSeg && cutRopeAt(cutSeg)) {
          b.consumed = true;
          hit = true;
        }
      }
      // 鍦嗗舰鍔ㄦ€侀亾鍏疯惤鍦ㄥ湴闈笂鏃讹紝瑙嗚涓婁綅浜庡湴闈㈠墠鏂癸紝搴斾紭鍏堟帴鏀惰繖涓€甯х殑鍛戒腑銆?
      const circlePropPending = !hit && propBodies.some(prop => {
        if (!prop || prop.destroyed || !prop.circleRadius) return false;
        const cooling = prop.lastHitBullet === b.body.id &&
          performance.now() - (prop.lastHitAt || 0) < 90;
        return !cooling && bulletVsCircleWithPoint(b, prop).hit;
      });
      // 澧?
      if (!hit && !circlePropPending) {
        for (const w of wallBodies) {
          const ob = w.bounds;
          if (reflectBulletManual(b, ob.min.x, ob.min.y, ob.max.x - ob.min.x, ob.max.y - ob.min.y)) {
            b.bounces--; b.bounced = (b.bounced || 0) + 1; hit = true; AudioFX.ricochet(); break;
          }
        }
      }
      // 骞冲彴
      if (!hit && !circlePropPending) {
        for (const p of platformBodies) {
          const ob = p.bounds;
          if (reflectBulletManual(b, ob.min.x, ob.min.y, ob.max.x - ob.min.x, ob.max.y - ob.min.y)) {
            b.bounces--; b.bounced = (b.bounced || 0) + 1; hit = true; AudioFX.ricochet(); break;
          }
        }
      }
      // 鏁屼汉(娲?姝?
      if (!hit) {
        for (const ed of enemyData) {
          if (!ed.activated && !ed.e.alive) continue;
          const hitInfo = findHitPart(ed, b);
          if (!hitInfo) continue;
          const bulletVel = { x: b.vx, y: b.vy };
          if (ed.activated) {
            // 宸叉鏁屼汉:浜屾鍐插嚮(杞婚噺)+ 瀛愬脊涓嶆秷澶?缁х画
            applySecondaryHit(ed, hitInfo.part, hitInfo.point, bulletVel);
          } else {
            // 瀛樻椿鏁屼汉:婵€娲绘湪鍋?宸插惈涓€娆″啿鍑?,瀛愬脊涓嶆秷澶?
            const platformInfo = computePlatformInfo(ed.e);
            activateRagdoll(ed, hitInfo.part, hitInfo.point, bulletVel, b.bounced || 0, platformInfo);
          }
          // 瀛愬脊鎸夋帴瑙︽硶绾垮弽寮?娑堣€椾竴鐐硅兘閲?,鍏佽缁х画椋炶
          const n = estimateNormal(b, hitInfo.part);
          reflectBullet(b, n.x, n.y, 0.35);
          b.lastHitId = hitInfo.part.id;
          // 鎺ㄥ嚭纰版挒闈?鑷冲皯 1 甯ч€熷害 + b.r)
          const pushDist = Math.max(b.r + 3, Math.hypot(b.vx, b.vy) + b.r);
          b.x = hitInfo.point.x + n.x * pushDist;
          b.y = hitInfo.point.y + n.y * pushDist;
          b.bounced = (b.bounced || 0) + 1;
          b.bounces--;
          hit = true;  // 鏈抚姝ゅ瓙寮瑰凡澶勭悊涓€娆?
          break;
        }
      }
      // 閬撳叿纰版挒(鎸?PROP_PHYS 鍒嗙被澶勭悊)
      if (!hit) {
        for (const prop of propBodies) {
          if (prop.destroyed) continue;
          const sameBulletCooling = prop.lastHitBullet === b.body.id &&
            performance.now() - (prop.lastHitAt || 0) < 90;
          if (sameBulletCooling) continue;  // 鍙睆钄界揣閭诲抚锛屽弽寮瑰洖鏉ュ悗鍏佽鍐嶆鍛戒腑
          if (!bulletHitsProp(b, prop)) continue;
          const phys = prop.phys;
          if (!phys) { hit = true; break; }
          // 璁板綍鍛戒腑鐐?娌跨敤鐜版湁 vertex 鏈€杩戠偣妫€娴?
          const hitInfo = prop.circleRadius
            ? bulletVsCircleWithPoint(b, prop)
            : bulletVsPolygonWithPoint(b, prop.vertices);
          if (!hitInfo.hit) continue;
          const hitPoint = hitInfo.point;
          // 鍞ら啋鐫＄湢涓殑鐗╀綋
          wakeBody(prop);
          if (prop.isStatic && phys.category !== 'staticWall') M.Body.setStatic(prop, false);
          prop.hitCount = (prop.hitCount || 0) + 1;
          prop.lastHitBullet = b.body.id;
          prop.lastHitAt = performance.now();
          if (prop.propType === 'swing_hammer' && prop.circleRadius) {
            prop.hitFlashUntil = performance.now() + 170;
            prop.hitFlashPoint = { x: hitPoint.x, y: hitPoint.y };
          }
          // 鎸夌被鍒搷搴?
          if (phys.category === 'breakableSupport') {
            // 鍙牬鍧忔敮鎾?鎸℃澘:棣栨鏈夋晥鍛戒腑鍗抽攢姣?閲婃斁琚敮鎸佺墿
            destroySupport(prop);
            // 瀛愬脊鎸夋硶绾垮弽寮?鎹熷け涓€浜涜兘閲?,缁х画椋炶
            const n = hitInfo.normal || estimateNormal(b, prop);
            reflectBullet(b, n.x, n.y, phys.bulletLoss);
          } else if (phys.category === 'staticWall' || phys.isStatic) {
            // ramp 绛夋案涔呴潤鎬?绾弽灏?
            const n = hitInfo.normal || estimateNormal(b, prop);
            reflectBullet(b, n.x, n.y, 0);
          } else if (phys.explosive) {
            // 鐖嗙偢妗?瀛愬脊鍛戒腑鍗冲紩鐖?鐒跺悗瀛愬脊浠嶆寜娉曠嚎鍙嶅皠缁х画
            explodeAt(prop);
            const n = hitInfo.normal || estimateNormal(b, prop);
            reflectBullet(b, n.x, n.y, phys.bulletLoss);
          } else {
            // 鍔ㄦ€侀亾鍏?鍦ㄧ湡瀹炲懡涓偣鏂藉姞鍐查噺 + 瀛愬脊鍙嶅皠
            const speed = Math.hypot(b.vx, b.vy);
            if (speed > 0.01 && phys.impulseScale > 0) {
              let impulseMag = speed * phys.impulseScale;
              // 鐙肩墮鐞冭川閲忓緢澶э紝鍘熼€氱敤鍏紡甯︽潵鐨?螖v 涓嶅埌 0.05锛屽弻缁充細绔嬪嵆鍚告敹鎺夈€?
              // 鏀逛负淇濊瘉涓€涓彲瑙佺殑鐩爣閫熷害鍙樺寲锛氬悐鐫€鏃舵槑鏄鹃渿鍔紝瀹屽叏钀藉湴鍚庣Щ鍔?婊氬姩鏇村己銆?
              if (prop.propType === 'swing_hammer' && prop.circleRadius) {
                const desiredDeltaV = prop.fullyReleased
                  ? Math.min(2.0, Math.max(1.0, speed * 0.20))
                  : Math.min(1.15, Math.max(0.65, speed * 0.12));
                impulseMag = Math.max(impulseMag, prop.mass * desiredDeltaV);
              }
              let ux = b.vx / speed, uy = b.vy / speed;
              // 鏈ㄦ《浼樺厛鎶婂啿鍑昏浆鎴愭部鍦伴潰婊氬姩锛岄伩鍏嶆枩灏勬椂琚洿鎺ユ寫椋?
              if (phys.category === 'rollingObject') uy = Math.max(-0.12, uy);
              // 鍙敤 applyImpulseAtPoint 鐨勮嚜鐒舵壄鐭?鍩轰簬 hitPoint 鐩稿璐ㄥ績鐨勫亸绉?
              // 涓績鍛戒腑 r鈮? 鈫?绾钩绉?杈圭紭/涓婃柟鍛戒腑 r鈮? 鈫?鏃嬭浆/缈诲€?
              applyImpulseAtPoint(prop, hitPoint, { x: ux * impulseMag, y: uy * impulseMag });
              // A centred hit has almost no natural torque. Give barrels enough
              // matching angular speed to visibly roll instead of only sliding.
              if (prop.propType === 'barrel' && prop.circleRadius && Math.abs(prop.velocity.x) > 0.18) {
                const rollDirection = Math.sign(prop.velocity.x);
                const targetSpin = rollDirection * Math.min(
                  0.32,
                  Math.max(0.10, Math.abs(prop.velocity.x) / prop.circleRadius * phys.spinScale)
                );
                if (Math.abs(prop.angularVelocity) < Math.abs(targetSpin)) {
                  M.Body.setAngularVelocity(prop, targetSpin);
                }
              }
            }
            // 瀛愬脊鎸夋硶绾垮弽灏?
            const n = hitInfo.normal || estimateNormal(b, prop);
            reflectBullet(b, n.x, n.y, phys.bulletLoss);
            // 閽熸憜鐨勭嫾鐗欑悆琚墦涓?鍚屾椂鍒囨柇缁冲瓙,璁╃悆鍙樿嚜鐢辫韩鑳介鍑哄幓
            // cutRopeAt 宸茬粡澶勭悊"绉婚櫎鏈绾︽潫",涓嶉渶瑕佸啀鎵嬪姩娓?
            if (prop.propType === 'pendulum') {
              const rope = ropes.find(r => r.ball === prop);
              if (rope && rope.cuttable) {
                // 鍒囨渶闈犺繎鐞冪殑涓€娈电怀瀛?鐞冪殑绾︽潫绔嬪埢绉婚櫎)
                const seg = rope.segments[rope.segments.length - 1];
                if (seg && !seg.destroyed) cutRopeAt(seg);
              }
            }
          }
          // 鎺ㄥ嚭纰版挒闈?鑷冲皯 1 甯ч€熷害 + b.r,闃叉瀛愬脊"绌块€忔畫鐣?鍦ㄧ墿浣撳唴)
          // 鍙嶅皠鍚庨€熷害鏂瑰悜灏辨槸"绂诲満鏂瑰悜",鐢ㄥ畠褰?push 鏂瑰悜鏈€绋?
          //   - 姝ｅ父鎿﹁竟:閫熷害涓庢渶杩戣竟澶栨硶绾垮榻?閮芥寚鍚戠墿澶?,鎺ㄥ緱姝ｇ‘
          //   - 绌块毀:estimateNormal 鍙兘缁欏埌閿欒鍑鸿竟鐨勬硶绾?浣嗛€熷害鏂瑰悜涓€瀹氭槸"鏉ヨ矾鍙嶅悜",
          //     浠庡叆杈规帹鍥炲幓,淇濊瘉瀛愬脊鍦ㄧ墿浣撳
          const v2 = Math.hypot(b.vx, b.vy);
          let nx2, ny2;
          if (v2 > 0.01) {
            nx2 = b.vx / v2; ny2 = b.vy / v2;
          } else {
            const n2 = estimateNormal(b, prop);
            nx2 = n2.x; ny2 = n2.y;
          }
          const pushDist = Math.max(b.r + 3, v2 + b.r);
          b.x = hitPoint.x + nx2 * pushDist;
          b.y = hitPoint.y + ny2 * pushDist;
          b.bounced = (b.bounced || 0) + 1;
          b.bounces--;
          hit = true;
          break;
        }
      }

      if (b.consumed) { removeBullet(b, 'consumed'); continue; }
      M.Body.setPosition(b.body, { x: b.x, y: b.y });

      // 瀛愬脊娑堝け鏉′欢(閫愰」妫€娴?甯﹀師鍥?
      const speed = Math.hypot(b.vx, b.vy);
      const age = performance.now() - (b.bornAt || 0);
      let removeReason = null;
      if (b.bounces <= 0)                          removeReason = 'max_bounces';
      else if (b.x < -120 || b.x > W + 120 ||
               b.y < -120 || b.y > H + 120)         removeReason = 'out_of_bounds';
      else if (age > BULLET_MAX_AGE_MS)            removeReason = 'max_age';
      else if (speed < BULLET_SLOW_THRESH) {
        b.slowFrames = (b.slowFrames || 0) + 1;
        if (b.slowFrames > 60) removeReason = 'low_speed';
      } else {
        b.slowFrames = 0;
      }
      if (removeReason) {
        if (DEBUG) console.log('[bullet removed]', removeReason, 'speed=', speed.toFixed(2));
        removeBullet(b, removeReason);
      }
    }

    // 2) 鎸佺画鎽嗛敜鑳介噺琛ュ伩 + 鐗╃悊瑙ｇ畻(鏈ㄥ伓 + 閬撳叿)
    maintainSwingMotion();
    for (let i = 0; i < PHYSICS_SUBSTEPS; i++) M.Engine.update(engine, 1000 / 60 / PHYSICS_SUBSTEPS);
    checkEnemyPropHits();
    checkPlayerPropHits();

    // 3) 鏈ㄥ伓闃诲凹 + 闄愰€?鏇存棭鍚姩 + 鏇村己 + 闈欐鍚庢竻闆?闃叉姝讳骸鍚庢寔缁钩绉?
    const now = Date.now();
    const MAX_LIN_VEL = 14, MAX_ANG_VEL = 0.5;
    const activeRagdolls = playerRagdoll ? [...enemyData, playerRagdoll] : enemyData;
    for (const ed of activeRagdolls) {
      if (ed.type !== 'ragdoll' || !ed.activated) continue;
      const t = (now - (ed.activatedAt || now)) / 1000;
      // 闃诲凹鏇茬嚎:0.2s 璧峰紑濮嬪悆,閫愭鍔犲己
      const damp = t > 0.2 ? Math.max(0.45, 0.95 - (t - 0.2) * 0.25) : 1.0;
      for (const part of ed.allParts) {
        const vx = part.velocity.x, vy = part.velocity.y;
        const v = Math.hypot(vx, vy);
        if (v > MAX_LIN_VEL) { part.velocity.x = vx / v * MAX_LIN_VEL; part.velocity.y = vy / v * MAX_LIN_VEL; }
        if (Math.abs(part.angularVelocity) > MAX_ANG_VEL) part.angularVelocity = Math.sign(part.angularVelocity) * MAX_ANG_VEL;
        if (damp < 1.0) {
          part.velocity.x *= damp; part.velocity.y *= damp; part.angularVelocity *= damp;
        }
        // 闈欐鍚庡己鍒舵竻闆?闃叉绾︽潫/鎽╂摝鍔涙帹鍔ㄧ殑鏋佹參婕傜Щ)
        if (t > 1.0 && v < 0.12) {
          part.velocity.x = 0; part.velocity.y = 0;
          if (Math.abs(part.angularVelocity) < 0.05) part.angularVelocity = 0;
        }
      }
    }

    // 3.5) 鍔ㄦ€侀亾鍏烽€熷害灏侀《(闃叉鐖嗙偢鍔涙墦椋炶秴澶х墿)
    for (const prop of propBodies) {
      if (prop.destroyed || prop.isStatic) continue;
      const v = Math.hypot(prop.velocity.x, prop.velocity.y);
      if (v > MAX_PROP_LIN_VEL) {
        prop.velocity.x = prop.velocity.x / v * MAX_PROP_LIN_VEL;
        prop.velocity.y = prop.velocity.y / v * MAX_PROP_LIN_VEL;
      }
      if (Math.abs(prop.angularVelocity) > MAX_PROP_ANG_VEL) {
        prop.angularVelocity = Math.sign(prop.angularVelocity) * MAX_PROP_ANG_VEL;
      }
    }
    // 3.6) 鐖嗙偢鐗规晥杩囨湡娓呯悊
    updateExplosions();
    updateBoomTexts();
    // 4) HUD + 杩囧叧
    const aliveCount = enemies.filter(e => e.alive).length;
    // 敌人数显示已移除
    if (gameState === 'dead') {
      // 姝讳骸:涓嶅啀瑙﹀彂杩囧叧,绛夌帺瀹剁偣閲嶅紑(Phase 4 鍔犳寮?overlay,杩欓噷鍏堜笉寮逛换浣曟)
    } else if (aliveCount === 0 && enemies.length > 0) {
      msgEl.textContent = '关卡通过！';
      overlay.classList.add('show');
    } else if (shotsLeft === 0 && bullets.length === 0 && !overlay.classList.contains('show')) {
      const dangerousPropMoving = propBodies.some(prop => {
        if (prop.destroyed || prop.isStatic || !prop.phys) return false;
        const speed = Math.hypot(prop.velocity.x, prop.velocity.y);
        const minSpeed = prop.phys.damageSpeed != null ? prop.phys.damageSpeed : MIN_PROP_DAMAGE_SPEED;
        const minImpact = prop.phys.damageImpact != null ? prop.phys.damageImpact : MIN_PROP_IMPACT;
        return speed >= minSpeed && prop.mass * speed >= minImpact;
      });
      if (!dangerousPropMoving && performance.now() - outOfAmmoSince > 1200) {
        msgEl.textContent = '子弹用尽，挑战失败';
        overlay.classList.add('show');
      }
    }
  }

  // ====== 鍔ㄦ€佷簯(妯悜婕傜Щ + 鍚勮嚜鐙珛寰幆) ======
  // phase 璧峰鐩镐綅(0~1),姣忔湹浜戦敊寮€
  const BG_CLOUDS = [
    { phase: 0.00, yR: 0.10, wR: 0.26, hR: 0.055, speed: 0.035, alpha: 0.78 },
    { phase: 0.30, yR: 0.20, wR: 0.22, hR: 0.045, speed: 0.028, alpha: 0.65 },
    { phase: 0.55, yR: 0.06, wR: 0.20, hR: 0.040, speed: 0.040, alpha: 0.70 },
    { phase: 0.15, yR: 0.30, wR: 0.24, hR: 0.050, speed: 0.032, alpha: 0.55 },
    { phase: 0.70, yR: 0.24, wR: 0.18, hR: 0.036, speed: 0.045, alpha: 0.65 },
    { phase: 0.45, yR: 0.35, wR: 0.20, hR: 0.040, speed: 0.038, alpha: 0.45 },
  ];

  // ====== 灞遍棿闆?鑴夊姩娣″叆娣″嚭) ======
  const BG_MIST = [
    { xR: 0.28, yR: 0.55, wR: 0.45, hR: 0.045, speed: 0.45, phase: 0.0 },
    { xR: 0.70, yR: 0.62, wR: 0.50, hR: 0.050, speed: 0.32, phase: 1.5 },
    { xR: 0.50, yR: 0.58, wR: 0.55, hR: 0.040, speed: 0.28, phase: 3.0 },
  ];

  // ====== 缁樺埗 ======
  function drawBackground() {
    const t = performance.now() * 0.001;  // 鏃堕棿(绉?

    // 1) 闈欐€佸簳鍥?鎷変几鍏ㄥ睆)
    if (bgImage.loaded) {
      ctx.drawImage(bgImage.img, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#f4d089';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#c98a4a';
      ctx.beginPath();
      ctx.moveTo(0, H - 80);
      for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 80 + Math.sin(x * 0.013) * 30);
      ctx.lineTo(W, H); ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();
    }

    // 2) 鍔ㄦ€佷簯(妯悜婕傜Щ + 鍚勮嚜鐙珛寰幆)
    ctx.save();
    for (const c of BG_CLOUDS) {
      // 鍛ㄦ湡(绉?= 璺ㄨ秺璺濈 / 閫熷害 = (1.4 + wR) / speed
      const cycle = 1.4 + c.wR;
      const period = cycle / c.speed;
      // phase 0~1 鈫?璺ㄨ秺涓€涓畬鏁?cycle;鍔?c.phase 閿欏紑璧风偣
      const ph = ((t / period) + c.phase) % 1;
      // x 浠?-0.5*wR 婕傚埌 1+0.9*wR,姝ｅソ瑕嗙洊鏁翠釜鐢诲竷
      const x = (ph * cycle - 0.5 * c.wR) * W;
      const y = c.yR * H;
      const w = c.wR * W;
      const h = c.hR * H;
      // 杈圭紭鏌斿寲:杩涘嚭鐢诲竷 80px 鏃舵贰鍏ユ贰鍑?
      let edgeFade = 1;
      const margin = 80;
      if (x < margin) edgeFade = Math.max(0, x / margin);
      else if (x > W - margin) edgeFade = Math.max(0, (W - x) / margin);
      const a = c.alpha * edgeFade;
      if (a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffffff';
      // 涓讳綋妞渾 + 涓や晶灏忔き鍦?鍍忎簯鍥?
      ctx.beginPath();
      ctx.ellipse(x, y, w * 0.50, h * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x - w * 0.30, y + h * 0.18, w * 0.34, h * 0.70, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + w * 0.30, y + h * 0.18, w * 0.34, h * 0.70, 0, 0, Math.PI * 2);
      ctx.fill();
      // 椤堕儴鍐嶅姞涓€灏忔挳
      ctx.beginPath();
      ctx.ellipse(x + w * 0.10, y - h * 0.30, w * 0.32, h * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3) 灞遍棿闆?鑴夊姩 alpha,钀ラ€犳按澧ㄧ殑"姘?鎰?
    ctx.save();
    for (const m of BG_MIST) {
      const alpha = 0.32 + 0.18 * Math.sin(t * m.speed + m.phase);
      ctx.globalAlpha = alpha;
      const x = m.xR * W;
      const y = m.yR * H;
      const w = m.wR * W;
      const h = m.hR * H;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, w * 0.5);
      grad.addColorStop(0, 'rgba(250,240,215,1)');
      grad.addColorStop(0.7, 'rgba(250,240,215,0.4)');
      grad.addColorStop(1, 'rgba(250,240,215,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x, y, w * 0.5, h, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 4) 鏋佽交鐨勬殫瑙?
    const grad = ctx.createRadialGradient(W/2, H*0.5, Math.min(W, H) * 0.40,
                                          W/2, H*0.5, Math.max(W, H) * 0.90);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.10)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // (drawPuzzleHints 宸插垹闄?鈥?鐢ㄦ埛瑕佹眰鍘绘帀宸︿笂瑙掕鏄?

  function drawPlatforms() {
    for (const p of platformBodies) {
      ctx.fillStyle = '#5a3a20';
      ctx.beginPath();
      const v = p.vertices;
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7a5230';
      ctx.beginPath();
      ctx.moveTo(v[0].x, v[0].y);
      ctx.lineTo(v[1].x, v[1].y);
      ctx.lineTo(v[2].x, v[2].y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawRectBody(b, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    const v = b.vertices;
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.fill();
  }

  function drawCircleBody(b, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // ====== 鐙肩墮鐞?鐢ㄧ敓鍥?assets/wolf_ball.png)浼樺厛,鍔犺浇澶辫触閫€鍥炲嚑浣曠粯鍒?======
  function drawSpikedBall(b, spikeCount) {
    // 浼樺厛鐢?AI 鐢熷浘(鎸夊唴瀹?bbox 閫傞厤,鍒哄皷鑳介《鍒扮墿鐞嗗湀)
    if (propImages.wolf_ball.loaded) {
      drawCircleImageByBbox(b, propImages.wolf_ball);
      // 鍛戒腑鐧介棯鏁堟灉(鍥句笂鍙犱竴灞?淇濇寔鍘熻瑙夊弽棣?
      const flash = Math.max(0, Math.min(1, ((b.hitFlashUntil || 0) - performance.now()) / 170));
      if (flash > 0) {
        ctx.save();
        ctx.translate(b.position.x, b.position.y);
        ctx.rotate(b.angle || 0);
        ctx.fillStyle = `rgba(255,255,230,${0.28 * flash})`;
        ctx.beginPath();
        ctx.arc(0, 0, b.circleRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,235,150,${0.95 * flash})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, b.circleRadius * 1.02 * (1 + (1 - flash) * 0.18), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      return;
    }
    // 閫€璺?绋嬪簭缁樺埗(鍑犱綍鍒?+ 榛戠悆 + 閲戝睘楂樺厜 + 绾㈣壊 X)
    const x = b.position.x, y = b.position.y;
    const outerR = b.circleRadius;     // 鐗╃悊纰版挒鍗婂緞 = 鍒哄皷澶栫紭
    const r = outerR * 0.72;           // 閲戝睘鐞冭姱鍗婂緞
    const ang = b.angle || 0;  // 鐞冭嚜杞,璁╁埡闅忕悆杞?
    spikeCount = spikeCount || 8;
    // 1) 鐢诲埡(涓夎褰?浠庣悆蹇冩柟鍚戝線澶?
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = '#1a1a1a';
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1;
    for (let i = 0; i < spikeCount; i++) {
      const a = (i / spikeCount) * Math.PI * 2;
      const tipX = Math.cos(a) * outerR;
      const tipY = Math.sin(a) * outerR;
      const baseLX = Math.cos(a + 0.13) * (r * 0.95);
      const baseLY = Math.sin(a + 0.13) * (r * 0.95);
      const baseRX = Math.cos(a - 0.13) * (r * 0.95);
      const baseRY = Math.sin(a - 0.13) * (r * 0.95);
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(baseLX, baseLY);
      ctx.lineTo(baseRX, baseRY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // 2) 鐞冧富浣?
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 3) 閲戝睘楂樺厜(宸︿笂涓€閬撳姬)
    ctx.strokeStyle = 'rgba(220, 220, 220, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-r * 0.25, -r * 0.25, r * 0.6, Math.PI * 1.1, Math.PI * 1.6);
    ctx.stroke();
    // 4) 涓績 X 鏍囪(鍗遍櫓鐗╂爣蹇?
    ctx.strokeStyle = 'rgba(255, 80, 60, 0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.4, -r * 0.4); ctx.lineTo(r * 0.4, r * 0.4);
    ctx.moveTo(r * 0.4, -r * 0.4); ctx.lineTo(-r * 0.4, r * 0.4);
    ctx.stroke();

    // 姣忔瀛愬脊鍛戒腑閮戒細鍑虹幇鐭績鐨勯噾灞炵櫧闂拰鎵╂暎鐜紝棣栨銆佷簩娆″懡涓兘鍙銆?
    const flash = Math.max(0, Math.min(1, ((b.hitFlashUntil || 0) - performance.now()) / 170));
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,230,${0.28 * flash})`;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,235,150,${0.95 * flash})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, outerR * (1.02 + (1 - flash) * 0.18), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ====== 鍙岀怀鐙肩墮鐞冿細绱犳潗鑷韩灏辨槸瀹屾暣鐞冧綋锛屼笉鍐嶉澶栧彔鍔犻《閮ㄥ渾鐜?======
  function drawHammerBody(b) {
    if (b.circleRadius) {
      drawSpikedBall(b, b.spikeCount || 12);
      return;
    }

    const w = b.propW;
    const h = b.propH;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);

    const coreH = h * 0.58;
    const coreW = w * 0.92;
    const spikeTipY = h * 0.5;
    const spikeBaseY = coreH * 0.47;

    // 涓婁笅鐙肩墮灏栧埡锛屽皷绔笉瓒呰繃鐗╃悊纰版挒妗嗐€?
    ctx.fillStyle = '#30343a';
    ctx.strokeStyle = '#111317';
    ctx.lineWidth = 1.2;
    const spikeCount = 7;
    for (let i = 0; i < spikeCount; i++) {
      const x = -w * 0.34 + i * (w * 0.68 / (spikeCount - 1));
      const halfBase = w * 0.025;
      for (const sy of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x - halfBase, sy * spikeBaseY);
        ctx.lineTo(x, sy * spikeTipY);
        ctx.lineTo(x + halfBase, sy * spikeBaseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
    // 涓ょ涔熷悇鏈変竴鏋氭í鍚戝皷鍒恒€?
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * coreW * 0.48, -coreH * 0.18);
      ctx.lineTo(sx * w * 0.5, 0);
      ctx.lineTo(sx * coreW * 0.48, coreH * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // 鍦嗚閿よ姱鍜岄噾灞為珮鍏夈€?
    const x0 = -coreW / 2, y0 = -coreH / 2, radius = coreH * 0.24;
    ctx.beginPath();
    ctx.moveTo(x0 + radius, y0);
    ctx.lineTo(x0 + coreW - radius, y0);
    ctx.quadraticCurveTo(x0 + coreW, y0, x0 + coreW, y0 + radius);
    ctx.lineTo(x0 + coreW, y0 + coreH - radius);
    ctx.quadraticCurveTo(x0 + coreW, y0 + coreH, x0 + coreW - radius, y0 + coreH);
    ctx.lineTo(x0 + radius, y0 + coreH);
    ctx.quadraticCurveTo(x0, y0 + coreH, x0, y0 + coreH - radius);
    ctx.lineTo(x0, y0 + radius);
    ctx.quadraticCurveTo(x0, y0, x0 + radius, y0);
    ctx.closePath();
    const metal = ctx.createLinearGradient(0, y0, 0, y0 + coreH);
    metal.addColorStop(0, '#777d84');
    metal.addColorStop(0.28, '#4a4f56');
    metal.addColorStop(0.72, '#292d32');
    metal.addColorStop(1, '#17191d');
    ctx.fillStyle = metal;
    ctx.fill();
    ctx.strokeStyle = '#0d0f12';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 鍔犲浐绠嶅甫鍜岄搯閽夈€?
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#1c2025';
      ctx.fillRect(sx * w * 0.30 - w * 0.018, -coreH / 2, w * 0.036, coreH);
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath();
      ctx.arc(sx * w * 0.30, 0, Math.max(2, h * 0.055), 0, Math.PI * 2);
      ctx.fill();
    }

    // 鍚婄幆浣嶇疆涓庣湡瀹炵怀绾︽潫涓€鑷达紱宸︿晶绾㈢幆瀵瑰簲鍙皠鏂殑閲婃斁缁炽€?
    const ringR = Math.min(h * 0.18, 7);
    const ringY = -h * 0.16;
    for (const sx of [-1, 1]) {
      ctx.fillStyle = sx < 0 ? '#8f3629' : '#20242a';
      ctx.beginPath();
      ctx.arc(sx * w * 0.42, ringY, ringR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0d0f12';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#c1c5c9';
      ctx.beginPath();
      ctx.arc(sx * w * 0.42, ringY, ringR * 0.48, 0, Math.PI * 2);
      ctx.fill();
    }

    // 涓績寰介拤銆?
    ctx.fillStyle = '#b7bdc3';
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2.5, h * 0.075), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#34383d';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // ====== 鐢荤湡瀹炵墿鐞嗙怀锛氭寜鍚勭怀鑺傚綋鍓嶄綅缃粯鍒跺集鏇叉姌绾?======
  // 鍏煎涓ょ"缁抽亾鍏?:
  //   - kind='pendulum':1 鏉?sub-rope,浠?pivot 鈫?segments 鈫?ball
  //   - kind='swing_hammer':1~2 鏉?sub-rope,姣忔潯浠?pivot 鈫?segments 鈫?hammerBody 绔偣
  function drawRopes() {
    for (const rope of ropes) {
      ctx.lineWidth = rope.thickness;
      ctx.lineCap = 'round';

      const subRopes = rope.subRopes || [];
      for (const sub of subRopes) {
        // 绾㈣壊鏄彲灏勬柇鐨勯噴鏀剧怀锛涙鑹叉槸閾侀敜鎽嗗姩鏃朵繚鐣欑殑涓荤怀銆?
        ctx.strokeStyle = sub.role === 'release' ? '#a6452f' : rope.color;
        // 鎷兼姌绾?pivot 鈫?segments 鈫?endBody
        const endBody = sub.endBody;
        if (!endBody || endBody.destroyed) continue;
        const points = [sub.pivot, ...sub.segments, endBody];
        let chainStarted = false;
