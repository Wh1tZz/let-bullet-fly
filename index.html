        ctx.beginPath();
        for (const point of points) {
          if (!point || point.destroyed) {
            if (chainStarted) ctx.stroke();
            ctx.beginPath();
            chainStarted = false;
            continue;
          }
          // 鏈 body 鐢ㄤ笘鐣屽潗鏍?local 閿氱偣 + body.position (蹇界暐 body 瑙掑害,绮楃暐鐢诲嵆鍙?
          let px, py;
          if (point === endBody && sub.endPoint) {
            // 鐢?body 鏈濆悜璁＄畻 endPoint 鐨勪笘鐣屽潗鏍?
            const c = Math.cos(endBody.angle), s = Math.sin(endBody.angle);
            const ex = sub.endPoint.x, ey = sub.endPoint.y;
            px = endBody.position.x + (c * ex - s * ey);
            py = endBody.position.y + (s * ex + c * ey);
          } else {
            px = point.position.x;
            py = point.position.y;
          }
          if (!chainStarted) {
            ctx.moveTo(px, py);
            chainStarted = true;
          } else {
            ctx.lineTo(px, py);
          }
        }
        if (chainStarted) ctx.stroke();

        // 鏂彛姣涜竟(浠呭宸茬粡鍒囨帀鐨?sub-rope 鏄剧ず姣涘埡)
        if (sub.isCut && sub.segments.length > 0) {
          const ci = Math.max(0, Math.min(sub.segments.length - 1, sub.cutIndex));
          for (const end of [sub.segments[ci - 1], sub.segments[ci + 1]]) {
            if (!end || end.destroyed) continue;
            const x = end.position.x, y = end.position.y;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 3, y - 2);
            ctx.lineTo(x + 3, y + 2);
            ctx.moveTo(x - 3, y + 2);
            ctx.lineTo(x + 3, y - 2);
            ctx.stroke();
          }
        }
      }

      // pivot 瑙嗚(姣忎釜 sub-rope 鐨勫皬鍦嗙偣 + 鍥哄畾搴?
      for (const sub of subRopes) {
        if (!sub.pivot || sub.pivot.destroyed) continue;
        ctx.fillStyle = '#3a2818';
        ctx.beginPath();
        ctx.arc(sub.pivot.position.x, sub.pivot.position.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0a0a0a';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function drawImageContained(img, maxW, maxH) {
    const iw = img.naturalWidth || img.width || 1;
    const ih = img.naturalHeight || img.height || 1;
    const scale = Math.min(maxW / iw, maxH / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  }

  // 鐢ㄩ€忔槑绱犳潗缁樺埗鍦嗗舰鐗╋紝濮嬬粓淇濇寔绱犳潗鍘熷姣斾緥銆?
  function drawCircleImage(b, entry) {
    const r = b.circleRadius;
    const img = (entry && entry.img) || entry;
    const visualScale = (entry && entry.visualScale) || 1;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.shadowColor = 'rgba(35, 22, 10, 0.30)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 2;
    drawImageContained(img, r * 2 * visualScale, r * 2 * visualScale);
    ctx.restore();
  }
  // 鎸?鍥剧墖鍐呭 bbox"绛夋瘮缂╂斁鍚庡啀鐢?鈥?閫傚悎鏈夐€忔槑杈硅窛鐨勭礌鏉?鐙肩墮鐞?閾佺悆绛?
  // 杩欐牱鍒哄皷鑳芥濂介《鍦ㄧ墿鐞嗗湀澶栫紭,鑰屼笉鏄鐢荤缉鍒板湀鍐?
  function drawCircleImageByBbox(b, entry) {
    const r = b.circleRadius;
    const img = entry.img;
    const visualScale = entry.visualScale || 1;
    if (!entry.contentBbox) {
      // 杩樻病閲忓埌 bbox,閫€鍥炴櫘閫?contain 鐢绘硶
      return drawCircleImage(b, entry);
    }
    const bb = entry.contentBbox;
    const target = r * 2 * visualScale;
    const scale = Math.min(target / bb.w, target / bb.h);
    const dw = bb.w * scale;
    const dh = bb.h * scale;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.shadowColor = 'rgba(25, 18, 10, 0.28)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 2;
    ctx.drawImage(img, bb.x, bb.y, bb.w, bb.h, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }
  // 鐭╁舰/澶氳竟褰㈢礌鏉愬悓鏍风瓑姣?contain锛屼笉浣跨敤鏃嬭浆鍚庣殑 AABB銆?
  function drawRectImage(b, entry) {
    const w = b.propW || (b.bounds.max.x - b.bounds.min.x);
    const h = b.propH || (b.bounds.max.y - b.bounds.min.y);
    const img = (entry && entry.img) || entry;
    const visualScale = (entry && entry.visualScale) || 1;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.shadowColor = 'rgba(35, 22, 10, 0.30)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 2;
    drawImageContained(img, w * visualScale, h * visualScale);
    ctx.restore();
  }
  // 鐭╁舰/澶氳竟褰㈡寜鍐呭 bbox 閫傞厤(鎶婇€忔槑杈瑰幓鎺?鍐呭濉弧鐭╁舰)
  function drawRectImageByBbox(b, entry) {
    const w = b.propW || (b.bounds.max.x - b.bounds.min.x);
    const h = b.propH || (b.bounds.max.y - b.bounds.min.y);
    const img = entry.img;
    const visualScale = entry.visualScale || 1;
    if (!entry.contentBbox) return drawRectImage(b, entry);
    const bb = entry.contentBbox;
    const targetW = w * visualScale;
    const targetH = h * visualScale;
    // 鐢?min 璁╁唴瀹瑰畬鏁存斁杩涚煩褰?鍙兘鏈夎竟璺?
    const scale = Math.min(targetW / bb.w, targetH / bb.h);
    const dw = bb.w * scale;
    const dh = bb.h * scale;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.shadowColor = 'rgba(35, 22, 10, 0.30)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 2;
    ctx.drawImage(img, bb.x, bb.y, bb.w, bb.h, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }

  // 缁樺埗閬撳叿
  function drawProps() {
    // 鍏堢敾鍏冲崱澧?浠?wallBodies 閲屾寫鍑哄湪鐢诲竷鍐呯殑)
    for (const w of wallBodies) {
      const bb = w.bounds;
      // 璺宠繃鐢诲竷澶栫殑 4 鍫甸殣褰㈠
      if (bb.max.x < -10 || bb.min.x > W + 10 || bb.max.y < -10 || bb.min.y > H + 10) continue;
      // 涓讳綋娣辨
      drawRectBody(w, '#2a1a0a');
      // 鐮栧潡绾?
      ctx.strokeStyle = '#5a3a20';
      ctx.lineWidth = 1;
      const brickH = 10, brickW = 12;
      for (let y = bb.min.y; y < bb.max.y; y += brickH) {
        const offset = ((y - bb.min.y) / brickH) % 2 === 0 ? 0 : brickW / 2;
        ctx.beginPath();
        ctx.moveTo(bb.min.x, y);
        ctx.lineTo(bb.max.x, y);
        ctx.stroke();
        for (let x = bb.min.x + offset; x < bb.max.x; x += brickW) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, Math.min(y + brickH, bb.max.y));
          ctx.stroke();
        }
      }
      // 椤堕潰楂樺厜
      ctx.fillStyle = '#5a3a20';
      ctx.fillRect(bb.min.x, bb.min.y, bb.max.x - bb.min.x, 2);
    }
    // 鍐嶇敾閬撳叿(鎸?category 鐢ㄤ笉鍚岄鑹?渚夸簬涓€鐪肩湅鍑虹被鍒?
    for (const body of propBodies) {
      if (body.destroyed) continue;
      if (body.category === 'dynamicBox') {
        // 鏈ㄧ:鐢ㄧ敓鍥?娌″姞杞藉畬閫€鍖栧埌鍑犱綍)
        if (body.propType === 'box' && propImages.wood_box.loaded) {
          drawRectImageByBbox(body, propImages.wood_box);
        } else {
          drawRectBody(body, '#8a5a2a');
          ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 1; ctx.stroke();
          // 鏈ㄧ汗
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.beginPath();
          const bb = body.bounds;
          ctx.moveTo(bb.min.x + 2, (bb.min.y + bb.max.y) / 2);
          ctx.lineTo(bb.max.x - 2, (bb.min.y + bb.max.y) / 2);
          ctx.stroke();
        }
      } else if (body.category === 'rollingObject') {
        // 鏈ㄦ《/鍦嗙悆:鐢ㄧ敓鍥捐祫婧?娌″姞杞藉畬鍒欓€€鍖栧埌鍑犱綍)
        if (body.propType === 'barrel' && propImages.barrel.loaded) {
          drawCircleImage(body, propImages.barrel);
        } else {
          // 閫€璺?娣辩伆 + 鏈ㄦ澘鍦?
          drawCircleBody(body, '#7a5230');
          ctx.strokeStyle = '#3d2613'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath();
          ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, Math.PI);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(body.position.x, body.position.y, body.circleRadius * 0.55, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (body.propType === 'explosive') {
        // 鐖嗙偢妗?鐢ㄧ敓鍥捐祫婧?绾?TNT),閫€璺负鍑犱綍
        if (propImages.explosive.loaded) {
          drawCircleImage(body, propImages.explosive);
        } else {
          drawCircleBody(body, '#8a2020');
          ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
          ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(body.position.x - body.circleRadius * 0.6, body.position.y - body.circleRadius * 0.6);
          ctx.lineTo(body.position.x + body.circleRadius * 0.6, body.position.y + body.circleRadius * 0.6);
          ctx.moveTo(body.position.x + body.circleRadius * 0.6, body.position.y - body.circleRadius * 0.6);
          ctx.lineTo(body.position.x - body.circleRadius * 0.6, body.position.y + body.circleRadius * 0.6);
          ctx.stroke();
        }
      } else if (body.propType === 'pendulum') {
        drawSpikedBall(body, ropes.find(rope => rope.ball === body)?.spikeCount || 10);
      } else if (body.propType === 'swing_hammer') {
        drawHammerBody(body);
      } else if (body.category === 'heavyObject') {
        // 鐭冲潡:鐢ㄧ敓鍥捐祫婧?娌″姞杞藉畬鍒欓€€鍖栧埌鍑犱綍);閾佺悆浠嶇敤鍑犱綍
        if (body.propType === 'stone' && propImages.stone.loaded && !body.circleRadius) {
          drawRectImage(body, propImages.stone);
        } else {
          // 閫€璺?閾佺悆/鏈姞杞?:娣辩伆
          const color = body.propType === 'iron_ball' ? '#2a2a2a' : '#5a5a5a';
          if (body.circleRadius) {
            drawCircleBody(body, color);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
          } else {
            drawRectBody(body, color);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
            // 瑁傜汗
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            const bb = body.bounds;
            ctx.moveTo(bb.min.x + 3, bb.min.y + 3);
            ctx.lineTo(bb.max.x - 3, bb.max.y - 3);
            ctx.moveTo(bb.max.x - 3, bb.min.y + 3);
            ctx.lineTo(bb.min.x + 3, bb.max.y - 3);
            ctx.stroke();
          }
        }
      } else if (body.label === 'support') {
        drawRectBody(body, '#d9b260');
        const bb = body.bounds;
        ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(bb.min.x + 1, bb.min.y + 1);
        ctx.lineTo(bb.max.x - 1, bb.max.y - 1);
        ctx.moveTo(bb.max.x - 1, bb.min.y + 1);
        ctx.lineTo(bb.min.x + 1, bb.max.y - 1);
        ctx.stroke();
      } else if (body.label === 'barrier') {
        drawRectBody(body, '#d9b260');
        const bb = body.bounds;
        ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(bb.min.x + 1, bb.min.y + 1);
        ctx.lineTo(bb.max.x - 1, bb.max.y - 1);
        ctx.moveTo(bb.max.x - 1, bb.min.y + 1);
        ctx.lineTo(bb.min.x + 1, bb.max.y - 1);
        ctx.stroke();
      } else if (body.label === 'ramp') {
        drawRectBody(body, '#7a5230');
        ctx.strokeStyle = '#3d2613'; ctx.lineWidth = 1; ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          const bb = body.bounds;
          const t = i / 5;
          ctx.moveTo(bb.min.x + (bb.max.x - bb.min.x) * t, bb.min.y);
          ctx.lineTo(bb.min.x + (bb.max.x - bb.min.x) * (t + 0.3), bb.max.y);
          ctx.stroke();
        }
      }
      // 璋冭瘯:鏄剧ず绫诲瀷/璐ㄩ噺/閫熷害
      if (DEBUG) {
        const bb = body.bounds;
        const v = Math.hypot(body.velocity.x, body.velocity.y);
        const w = body.angularVelocity;
        const sleepTxt = body.isSleeping ? ' SLEEP' : '';
        const info1 = `${body.propType}${sleepTxt}`;
        const info2 = `m=${body.mass.toFixed(1)} v=${v.toFixed(1)} 蠅=${w.toFixed(2)}`;
        const cx = body.position.x, cy = body.position.y;
        ctx.fillStyle = 'white'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
        ctx.font = '10px monospace';
        ctx.strokeText(info1, cx, cy - 8);
        ctx.fillText(info1, cx, cy - 8);
        ctx.strokeText(info2, cx, cy + 4);
        ctx.fillText(info2, cx, cy + 4);
        // 閫熷害鍚戦噺
        if (v > 0.05) {
          ctx.strokeStyle = 'lime'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + body.velocity.x * 4, cy + body.velocity.y * 4);
          ctx.stroke();
        }
        // 鍖呭洿鐩?
        ctx.strokeStyle = 'rgba(255,255,0,0.4)'; ctx.lineWidth = 1;
        ctx.strokeRect(bb.min.x, bb.min.y, bb.max.x - bb.min.x, bb.max.y - bb.min.y);
      }
    }
  }

  function drawLongRifle(x, y, angle, scale = 1) {
    const muzzleLen = RIFLE_MUZZLE_LENGTH * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 鏈ㄨ川鏋墭銆?
    ctx.fillStyle = '#5b3219';
    ctx.strokeStyle = '#24150c';
    ctx.lineWidth = 1.1 * scale;
    ctx.beginPath();
    ctx.moveTo(-15 * scale, -3.8 * scale);
    ctx.lineTo(11 * scale, -3.2 * scale);
    ctx.lineTo(13 * scale, 2.8 * scale);
    ctx.lineTo(-6 * scale, 3.6 * scale);
    ctx.lineTo(-15 * scale, 6.5 * scale);
    ctx.lineTo(-18 * scale, 3.8 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(211,148,78,0.55)';
    ctx.lineWidth = 0.8 * scale;
    ctx.beginPath();
    ctx.moveTo(-12 * scale, -1.7 * scale);
    ctx.lineTo(8 * scale, -1.4 * scale);
    ctx.stroke();

    // 閲戝睘鏈哄專鍜岄暱鏋銆?
    ctx.fillStyle = '#2a2c2d';
    ctx.strokeStyle = '#090a0a';
    ctx.lineWidth = 1 * scale;
    ctx.fillRect(8 * scale, -3.2 * scale, 9 * scale, 6.2 * scale);
    ctx.strokeRect(8 * scale, -3.2 * scale, 9 * scale, 6.2 * scale);
    ctx.fillStyle = '#17191a';
    ctx.fillRect(16 * scale, -1.8 * scale, muzzleLen - 16 * scale, 3.3 * scale);
    ctx.strokeRect(16 * scale, -1.8 * scale, muzzleLen - 16 * scale, 3.3 * scale);
    ctx.fillStyle = '#5f6263';
    ctx.fillRect(18 * scale, -1.25 * scale, muzzleLen - 20 * scale, 0.75 * scale);

    // 鎵虫満鎶ゅ湀涓庡噯鏄熴€?
    ctx.strokeStyle = '#161616';
    ctx.lineWidth = 1.1 * scale;
    ctx.beginPath();
    ctx.arc(8 * scale, 3 * scale, 3.4 * scale, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(muzzleLen - 1.5 * scale, -3.2 * scale, 1.2 * scale, 2 * scale);
    ctx.restore();

    return {
      x: x + Math.cos(angle) * muzzleLen,
      y: y + Math.sin(angle) * muzzleLen,
    };
  }

  function drawSoldierBackRifle(rifle) {
    if (!rifle) return;
    const scale = (rifle.propH || 33) / 61;
    drawLongRifle(
      rifle.position.x,
      rifle.position.y,
      rifle.angle + Math.PI / 2,
      scale
    );
  }

  function drawEnemyHat(hat) {
    if (!hat) return;
    const w = hat.hatW || 22;
    const h = hat.hatH || 8;
    ctx.save();
    ctx.translate(hat.position.x, hat.position.y);
    ctx.rotate(hat.angle);
    // 鎭㈠涓婁竴鐗堟瀬绠€榛戝附銆?
    ctx.fillStyle = '#080808';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-w * 0.50, h * 0.08);
    ctx.quadraticCurveTo(-w * 0.38, h * 0.42, 0, h * 0.38);
    ctx.quadraticCurveTo(w * 0.38, h * 0.42, w * 0.50, h * 0.08);
    ctx.quadraticCurveTo(w * 0.30, -h * 0.04, 0, -h * 0.01);
    ctx.quadraticCurveTo(-w * 0.30, -h * 0.04, -w * 0.50, h * 0.08);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#151515';
    ctx.beginPath();
    ctx.moveTo(-w * 0.26, h * 0.06);
    ctx.lineTo(-w * 0.20, -h * 0.32);
    ctx.quadraticCurveTo(0, -h * 0.50, w * 0.20, -h * 0.32);
    ctx.lineTo(w * 0.26, h * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(-w * 0.255, -h * 0.015, w * 0.51, Math.max(1.2, h * 0.14));
    ctx.restore();
  }

  // ====== 鍐涘附(peaked cap,瀹樺叺鐢? ======
  function drawMilitaryCap(hat, L) {
    if (!hat) return;
    const w = hat.hatW || 22;
    const h = hat.hatH || 8;
    ctx.save();
    ctx.translate(hat.position.x, hat.position.y);
    ctx.rotate(hat.angle);
    // 甯介《(鎵佸钩鍦嗛《)
    ctx.fillStyle = L.hatTop;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-w * 0.42, h * 0.30);
    ctx.lineTo(-w * 0.48, -h * 0.30);
    ctx.quadraticCurveTo(0, -h * 0.55, w * 0.48, -h * 0.30);
    ctx.lineTo(w * 0.42, h * 0.30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 甯藉甫(榛?
    ctx.fillStyle = L.hatBand;
    ctx.fillRect(-w * 0.42, h * 0.18, w * 0.84, Math.max(1.0, h * 0.16));
    // 甯芥獝(鍓嶉暱,鍐涘附鏍峰紡)
    ctx.fillStyle = L.hatBrim;
    ctx.beginPath();
    ctx.moveTo(-w * 0.42, h * 0.30);
    ctx.quadraticCurveTo(0, h * 0.55, w * 0.65, h * 0.30);
    ctx.lineTo(w * 0.65, h * 0.36);
    ctx.quadraticCurveTo(0, h * 0.62, -w * 0.42, h * 0.36);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 閾滆壊浜旇鏄熷附寰姐€?
    if (L.hatBadge) {
      ctx.fillStyle = L.hatBadge;
      ctx.beginPath();
      const starX = 0;
      const starY = -h * 0.20;
      const outerR = h * 0.29;
      const innerR = outerR * 0.44;
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? outerR : innerR;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const x = starX + Math.cos(angle) * radius;
        const y = starY + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#8a5a2a';
      ctx.lineWidth = 0.55;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ====== 鐡滅毊甯?鍦嗛《灏忓附,瀵屽晢鐢? ======
  function drawRoundCap(hat, L) {
    if (!hat) return;
    const w = hat.hatW || 22;
    const h = hat.hatH || 8;
    ctx.save();
    ctx.translate(hat.position.x, hat.position.y);
    ctx.rotate(hat.angle);
    // 甯借韩(鍗婄悆)
    ctx.fillStyle = L.hatTop;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-w * 0.36, h * 0.30);
    ctx.lineTo(-w * 0.36, -h * 0.05);
    ctx.quadraticCurveTo(0, -h * 0.55, w * 0.36, -h * 0.05);
    ctx.lineTo(w * 0.36, h * 0.30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 甯藉甫(閲戣壊)
    ctx.fillStyle = L.hatBand;
    ctx.fillRect(-w * 0.36, h * 0.10, w * 0.72, Math.max(1.0, h * 0.20));
    // 甯介《閲戠彔
    if (L.hatBead) {
      ctx.fillStyle = L.hatBead;
      ctx.beginPath();
      ctx.arc(0, -h * 0.60, h * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a5a2a';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ====== 鑳″瓙(绾粦鍏瓧鑳? ======
  function drawMustache(head, style) {
    if (!head) return;
    const r = head.circleRadius;
    ctx.save();
    ctx.translate(head.position.x, head.position.y);
    ctx.rotate(head.angle);
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    if (style === 'long') {
      // 瀵屽晢闀垮叓瀛楄儭(鏇翠笅鍨?
      ctx.moveTo(-r * 0.55, -r * 0.02);
      ctx.quadraticCurveTo(-r * 0.25, r * 0.40, -r * 0.08, r * 0.22);
      ctx.quadraticCurveTo(0, r * 0.10, r * 0.08, r * 0.22);
      ctx.quadraticCurveTo(r * 0.25, r * 0.40, r * 0.55, -r * 0.02);
      ctx.quadraticCurveTo(r * 0.40, r * 0.25, r * 0.18, r * 0.22);
      ctx.quadraticCurveTo(r * 0.04, r * 0.18, 0, r * 0.15);
      ctx.quadraticCurveTo(-r * 0.04, r * 0.18, -r * 0.18, r * 0.22);
      ctx.quadraticCurveTo(-r * 0.40, r * 0.25, -r * 0.55, -r * 0.02);
    } else {
      // 鏍囧噯鍏瓧鑳?鍦熷尓)
      ctx.moveTo(-r * 0.55, -r * 0.02);
      ctx.quadraticCurveTo(-r * 0.25, r * 0.22, -r * 0.05, r * 0.12);
      ctx.quadraticCurveTo(0, r * 0.05, r * 0.05, r * 0.12);
      ctx.quadraticCurveTo(r * 0.25, r * 0.22, r * 0.55, -r * 0.02);
      ctx.quadraticCurveTo(r * 0.40, r * 0.08, r * 0.18, r * 0.12);
      ctx.quadraticCurveTo(r * 0.04, r * 0.15, 0, r * 0.10);
      ctx.quadraticCurveTo(-r * 0.04, r * 0.15, -r * 0.18, r * 0.12);
      ctx.quadraticCurveTo(-r * 0.40, r * 0.08, -r * 0.55, -r * 0.02);
    }
    ctx.fill();
    ctx.restore();
  }

  function drawRoundedRagdollPart(body, color = '#111') {
    const w = body.propW || 5;
    const h = body.propH || 12;
    const radius = Math.min(w * 0.48, h * 0.16);
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle);
    ctx.fillStyle = color;
    ctx.strokeStyle = '#020202';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + radius, -h / 2);
    ctx.lineTo(w / 2 - radius, -h / 2);
    ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + radius);
    ctx.lineTo(w / 2, h / 2 - radius);
    ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - radius, h / 2);
    ctx.lineTo(-w / 2 + radius, h / 2);
    ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - radius);
    ctx.lineTo(-w / 2, -h / 2 + radius);
    ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + radius, -h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawMinimalEnemyFace(head, skinColor, look = 'bandit', hit = false) {
    const r = head.circleRadius;
    // 涔愰珮灏忎汉寮忓ご閮ㄦ瘮渚嬶細妯悜绋嶅銆佷笂涓嬫洿鐭€佷晶杈规洿鐩淬€?
    const w = r * 1.88;
    const h = r * 1.70;
    const corner = Math.max(1.7, r * 0.20);
    ctx.save();
    ctx.translate(head.position.x, head.position.y);
    ctx.rotate(head.angle);

    ctx.fillStyle = skinColor || '#e7b56d';
    ctx.strokeStyle = '#17120d';
    ctx.lineWidth = Math.max(0.9, r * 0.075);
    ctx.beginPath();
    ctx.moveTo(-w / 2 + corner, -h / 2);
    ctx.lineTo(w / 2 - corner, -h / 2);
    ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + corner);
    ctx.lineTo(w / 2, h / 2 - corner);
    ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - corner, h / 2);
    ctx.lineTo(-w / 2 + corner, h / 2);
    ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - corner);
    ctx.lineTo(-w / 2, -h / 2 + corner);
    ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + corner, -h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const eyeX = r * 0.32;
    const eyeY = -r * 0.08;
    const eyeR = Math.max(1.15, r * 0.115);
    ctx.strokeStyle = '#17120d';
    ctx.fillStyle = '#050505';
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.lineCap = 'round';

    if (hit && look === 'bandit') {
      // 鍦熷尓涓脊锛氬弻鐪煎彉鎴愭枩鍙夛紝鍢磋绱х环銆?
      for (const x of [-eyeX, eyeX]) {
        ctx.beginPath();
        ctx.moveTo(x - eyeR, eyeY - eyeR);
        ctx.lineTo(x + eyeR, eyeY + eyeR);
        ctx.moveTo(x + eyeR, eyeY - eyeR);
        ctx.lineTo(x - eyeR, eyeY + eyeR);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(-r * 0.18, r * 0.28);
      ctx.lineTo(-r * 0.06, r * 0.22);
      ctx.lineTo(r * 0.06, r * 0.30);
      ctx.lineTo(r * 0.18, r * 0.23);
      ctx.stroke();
    } else if (hit && look === 'soldier') {
      // 瀹樺叺涓脊锛氱溂鐫涚灛闂寸潄鍦嗭紝淇濇寔鍜揣鐗欏叧鐨勭‖鐩存劅銆?
      ctx.fillStyle = '#f7f0df';
      for (const x of [-eyeX, eyeX]) {
        ctx.beginPath();
        ctx.arc(x, eyeY, eyeR * 1.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#050505';
        ctx.beginPath();
        ctx.arc(x, eyeY + eyeR * 0.2, eyeR * 0.62, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f7f0df';
      }
      ctx.strokeStyle = '#17120d';
      ctx.beginPath();
      ctx.moveTo(-r * 0.20, r * 0.27);
      ctx.lineTo(r * 0.20, r * 0.27);
      ctx.stroke();
    } else if (hit && look === 'merchant') {
      // 瀵屽晢涓脊锛氫竴鍙棆娑＄溂銆佷竴鍙弶鐪煎拰鍦嗗槾锛屽じ寮犱絾浠嶄繚鎸佹瀬绠€銆?
      ctx.beginPath();
      ctx.arc(-eyeX, eyeY, eyeR * 1.35, 0.2, Math.PI * 2.25);
      ctx.arc(-eyeX, eyeY, eyeR * 0.72, 0.2, Math.PI * 2.1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(eyeX - eyeR, eyeY - eyeR);
      ctx.lineTo(eyeX + eyeR, eyeY + eyeR);
      ctx.moveTo(eyeX + eyeR, eyeY - eyeR);
      ctx.lineTo(eyeX - eyeR, eyeY + eyeR);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, r * 0.27, eyeR * 0.76, 0, Math.PI * 2);
      ctx.stroke();
    } else if (look === 'bandit') {
      // 鍦熷尓锛氱暐鐪殑璀﹁鐪肩銆?
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(side * eyeX - eyeR, eyeY - side * eyeR * 0.25);
        ctx.lineTo(side * eyeX + eyeR, eyeY + side * eyeR * 0.25);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(-eyeX, eyeY, eyeR * 0.48, 0, Math.PI * 2);
      ctx.arc(eyeX, eyeY, eyeR * 0.48, 0, Math.PI * 2);
      ctx.fill();
    } else if (look === 'soldier') {
      // 瀹樺叺锛氭柟鐪煎拰涓€瀛楀槾锛岀鎯呬弗鑲冦€?
      const ew = eyeR * 1.45;
      ctx.fillRect(-eyeX - ew / 2, eyeY - eyeR * 0.65, ew, eyeR * 1.3);
      ctx.fillRect(eyeX - ew / 2, eyeY - eyeR * 0.65, ew, eyeR * 1.3);
      ctx.beginPath();
      ctx.moveTo(-r * 0.18, r * 0.26);
      ctx.lineTo(r * 0.18, r * 0.26);
      ctx.stroke();
    } else {
      // 瀵屽晢锛氬渾鐪奸厤杞诲井绗戞剰銆?
      ctx.beginPath();
      ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, r * 0.20, r * 0.18, 0.12 * Math.PI, 0.88 * Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 鎵€鏈夎鑹插叡鐢ㄧ殑鏂瑰潡鑴革細杞诲井鍦嗚銆佸钩娑傝偆鑹层€佸姞涓婄溂 + 鍢?+ 绾㈣劯铔?
  function drawSquareFace(x, y, halfSize, angle = 0) {
    const w = halfSize * 1.78;
    const h = halfSize * 1.82;
    const corner = Math.max(1.8, halfSize * 0.22);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 鑴稿簳鑹?鑲夎壊)
    ctx.fillStyle = '#f0c896';
    ctx.strokeStyle = '#5c3d2b';
    ctx.lineWidth = Math.max(0.8, halfSize * 0.08);
    ctx.beginPath();
    ctx.moveTo(-w / 2 + corner, -h / 2);
    ctx.lineTo(w / 2 - corner, -h / 2);
    ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + corner);
    ctx.lineTo(w / 2, h / 2 - corner);
    ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - corner, h / 2);
    ctx.lineTo(-w / 2 + corner, h / 2);
    ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - corner);
    ctx.lineTo(-w / 2, -h / 2 + corner);
    ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + corner, -h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 绾㈣劯铔?鏆栬壊,鏀惧湪鑴搁浣嶇疆)
    const blushR = halfSize * 0.18;
    ctx.fillStyle = 'rgba(220, 80, 80, 0.32)';
    ctx.beginPath();
    ctx.arc(-halfSize * 0.48, halfSize * 0.20, blushR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc( halfSize * 0.48, halfSize * 0.20, blushR, 0, Math.PI * 2);
    ctx.fill();

    // 鐪肩潧(涓や釜灏忕偣 + 鐧借壊楂樺厜)
    const eyeR = Math.max(1.3, halfSize * 0.14);
    const eyeY = -halfSize * 0.10;
    const eyeX = halfSize * 0.32;
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI * 2);
    ctx.arc( eyeX, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    // 鐪肩櫧楂樺厜
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-eyeX + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.32, 0, Math.PI * 2);
    ctx.arc( eyeX + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // 鍢?寰瑧寮х嚎,涓嶇敤鐐?
    ctx.strokeStyle = '#3a1a08';
    ctx.lineWidth = Math.max(0.8, halfSize * 0.10);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, halfSize * 0.22, halfSize * 0.20, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function bodyLocalPoint(body, x, y) {
    const c = Math.cos(body.angle), s = Math.sin(body.angle);
    return {
      x: body.position.x + x * c - y * s,
      y: body.position.y + x * s + y * c,
    };
  }

  function drawSoldierHoldingPose(r, L) {
    const tw = r.torso.propW;
    const th = r.torso.propH;
    const rifle = r.backRifle;
    const rifleAngle = rifle.angle + Math.PI / 2;
    const axisX = Math.cos(rifleAngle), axisY = Math.sin(rifleAngle);
    const leftShoulder = bodyLocalPoint(r.torso, -tw * 0.40, -th * 0.27);
    const rightShoulder = bodyLocalPoint(r.torso, tw * 0.40, -th * 0.25);
    const leftHand = {
      x: rifle.position.x + axisX * 8,
      y: rifle.position.y + axisY * 8,
    };
    const rightHand = {
      x: rifle.position.x - axisX * 6,
      y: rifle.position.y - axisY * 6,
    };
    const leftElbow = {
      x: leftShoulder.x - 3,
      y: (leftShoulder.y + leftHand.y) * 0.5 + 3,
    };
    const rightElbow = {
      x: rightShoulder.x + 3,
      y: (rightShoulder.y + rightHand.y) * 0.5 + 3,
    };

    // 鍙岃噦寮洸鎶卞湪鑳稿墠銆?
    ctx.strokeStyle = L.arm;
    ctx.lineWidth = Math.max(5.2, r.armL.propW);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(leftShoulder.x, leftShoulder.y);
    ctx.lineTo(leftElbow.x, leftElbow.y);
    ctx.lineTo(leftHand.x, leftHand.y);
    ctx.moveTo(rightShoulder.x, rightShoulder.y);
    ctx.lineTo(rightElbow.x, rightElbow.y);
    ctx.lineTo(rightHand.x, rightHand.y);
    ctx.stroke();

    // 鍙宠噦绾㈣噦绔犵敾鍦ㄤ笂鑷備腑娈点€?
    ctx.strokeStyle = L.armband || '#c83a28';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(
      rightShoulder.x * 0.62 + rightElbow.x * 0.38,
      rightShoulder.y * 0.62 + rightElbow.y * 0.38
    );
    ctx.lineTo(
      rightShoulder.x * 0.43 + rightElbow.x * 0.57,
      rightShoulder.y * 0.43 + rightElbow.y * 0.57
    );
    ctx.stroke();

    // 姝ユ灙鐢诲湪韬綋鍜屽弻鎵嬪墠鏂癸紝杞粨鏇存槑鏄俱€?
    drawSoldierBackRifle(rifle);
    for (const hand of [leftHand, rightHand]) {
      ctx.fillStyle = L.head;
      ctx.strokeStyle = '#17120d';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, 2.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  // ====== 鏁屼汉鏈ㄥ伓(鎸?r.look 鍒囨崲澶栬:bandit / soldier / merchant) ======
  function drawRagdoll(r) {
    const look = r.look || 'bandit';
    const L = CHARACTER_LOOKS[look] || CHARACTER_LOOKS.bandit;

    // 涓脊鍚庢鏋厛鐢诲湪韬綋鍚庢柟锛涘瓨娲绘椂浼氬湪鑳稿墠鐢卞弻鑷傛姳鎸併€?
    if (r.backRifle && r.activated) drawSoldierBackRifle(r.backRifle);

    // 1) 鑵?鎸?look 鍙栬壊)
    for (const leg of r.allLegs) {
      drawRoundedRagdollPart(leg, L.leg);
    }

    // 2) 韬共 + 鑵板甫 + 閲戞墸 + (鍦嗚倸瀛?
    ctx.save();
    ctx.translate(r.torso.position.x, r.torso.position.y);
    ctx.rotate(r.torso.angle);
    const tw = r.torso.propW;
    const th = r.torso.propH;
    ctx.fillStyle = L.torso;
    ctx.strokeStyle = '#020202';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    if (look === 'merchant') {
      ctx.moveTo(-tw * 0.40, -th * 0.50);
      ctx.lineTo(tw * 0.40, -th * 0.50);
      ctx.bezierCurveTo(tw * 0.52, -th * 0.12, tw * 0.54, th * 0.24, tw * 0.39, th * 0.50);
      ctx.lineTo(-tw * 0.39, th * 0.50);
      ctx.bezierCurveTo(-tw * 0.54, th * 0.24, -tw * 0.52, -th * 0.12, -tw * 0.40, -th * 0.50);
    } else {
      ctx.moveTo(-tw * 0.43, -th * 0.50);
      ctx.lineTo(tw * 0.43, -th * 0.50);
      ctx.lineTo(tw * 0.36, th * 0.50);
      ctx.lineTo(-tw * 0.36, th * 0.50);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (look === 'bandit') {
      // 妫曡壊椹敳鐨勯粦鑹插唴瑗熶笌閾滄墸銆?
      ctx.fillStyle = '#17120f';
      ctx.beginPath();
      ctx.moveTo(-tw * 0.24, -th * 0.50);
      ctx.lineTo(0, -th * 0.20);
      ctx.lineTo(tw * 0.24, -th * 0.50);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#c29145';
      ctx.beginPath();
      ctx.arc(0, -th * 0.04, 0.9, 0, Math.PI * 2);
      ctx.arc(0, th * 0.14, 0.9, 0, Math.PI * 2);
      ctx.fill();
    } else if (look === 'soldier') {
      // 鍐涜绔嬮鍜屾垚鎺掗摐鎵ｃ€?
      ctx.fillStyle = '#30381f';
      ctx.fillRect(-tw * 0.28, -th * 0.50, tw * 0.56, th * 0.12);
      ctx.fillStyle = '#c29145';
      for (const y of [-th * 0.18, 0, th * 0.18]) {
        ctx.beginPath();
        ctx.arc(0, y, 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (look === 'merchant') {
      // 闀胯～涓紳銆?
      ctx.strokeStyle = 'rgba(99, 68, 18, 0.55)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -th * 0.42);
      ctx.lineTo(0, th * 0.46);
      ctx.stroke();
    }
    // 鑵板甫
    if (L.torsoAccent) {
      ctx.fillStyle = L.torsoAccent;
      ctx.fillRect(-tw * 0.43, th * 0.30, tw * 0.86, Math.max(1.0, th * 0.08));
    }
    // 閲戞墸
    if (L.goldBuckle) {
      ctx.fillStyle = '#d9b260';
      ctx.fillRect(-1.6, th * 0.26, 3.2, th * 0.18);
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(-0.8, th * 0.28, 1.6, th * 0.14);
    }
    // 鍦嗚倸瀛?merchant, 娴呰壊妞渾)
    if (L.roundBelly) {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, th * 0.05, tw * 0.30, th * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3) 瀹樺叺瀛樻椿鏃堕噰鐢ㄥ弻鎵嬫姳鏋Э鎬侊紱涓脊鍚庢仮澶嶇墿鐞嗘墜鑷傘€?
    if (look === 'soldier' && !r.activated && r.backRifle) {
      drawSoldierHoldingPose(r, L);
    } else for (const arm of r.allArms) {
      drawRoundedRagdollPart(arm, L.arm);
      // 绾㈣噦绔?鍙湪澹叺鐨勫彸鎵嬭噦)
      if (L.armband && arm === r.armR) {
        ctx.save();
        ctx.translate(arm.position.x, arm.position.y);
        ctx.rotate(arm.angle);
        ctx.fillStyle = L.armband;
        ctx.fillRect(-arm.propW / 2, -arm.propH / 2 + 4, arm.propW, 2.2);
        ctx.strokeStyle = '#7a1a08';
        ctx.lineWidth = 0.3;
        ctx.strokeRect(-arm.propW / 2, -arm.propH / 2 + 4, arm.propW, 2.2);
        ctx.restore();
      }
      // 鎵?鑲よ壊)
      ctx.save();
      ctx.translate(arm.position.x, arm.position.y);
      ctx.rotate(arm.angle);
      ctx.fillStyle = L.head;
      ctx.strokeStyle = '#17120d';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(0, arm.propH / 2 + 1.2, Math.max(1.8, arm.propW * 0.46), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 4) 姣忕被瑙掕壊鎷ユ湁鐙珛琛ㄦ儏锛涗腑寮瑰悗浼氬垏鎹负鍚勮嚜鐨勫彈鍑昏劯銆?
    drawMinimalEnemyFace(r.head, L.head, look, r.activated);

    // 5) 甯藉瓙(鎸?look 閫変笉鍚屽舰鐘?
    if (r.hat) {
      if (L.hat === 'fedora') drawEnemyHat(r.hat);
      else if (L.hat === 'cap') drawMilitaryCap(r.hat, L);
      else if (L.hat === 'roundcap') drawRoundCap(r.hat, L);
    }

    // 6) 鑳″瓙(鎸?look 鍐冲畾鏈夋棤 + 鏍峰紡)
    if (L.mustache) {
      drawMustache(r.head, look === 'merchant' ? 'long' : 'normal');
    }

    if (DEBUG) {
      const drawOutline = (b, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1;
        ctx.beginPath();
        const v = b.vertices;
        ctx.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
        ctx.closePath();
        ctx.stroke();
      };
      if (r.head.circleRadius) {
        ctx.strokeStyle = 'rgba(255,255,0,0.5)';
        ctx.beginPath();
        ctx.arc(r.head.position.x, r.head.position.y, r.head.circleRadius, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawOutline(r.torso, 'rgba(0,255,255,0.5)');
      for (const leg of r.allLegs) drawOutline(leg, 'rgba(255,0,255,0.5)');
      for (const arm of r.allArms) drawOutline(arm, 'rgba(255,165,0,0.5)');  // 姗欒壊鍖哄垎

      // 鏁翠綋璐ㄥ績(璐ㄩ噺鍔犳潈骞冲潎)
      let totalMass = 0, cmx = 0, cmy = 0;
      for (const p of r.allParts) {
        if (p.mass > 0) {
          totalMass += p.mass;
          cmx += p.position.x * p.mass;
          cmy += p.position.y * p.mass;
        }
      }
      if (totalMass > 0) { cmx /= totalMass; cmy /= totalMass; }
      r.cm = { x: cmx, y: cmy };
      ctx.fillStyle = 'cyan';
      ctx.beginPath();
      ctx.arc(cmx, cmy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'cyan'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cmx, cmy, 6, 0, Math.PI * 2);
      ctx.stroke();

      if (r.activated && r.hitPoint) {
        // 瀹為檯鍛戒腑鐐?榛勫湀)
        ctx.strokeStyle = 'yellow'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.hitPoint.x, r.hitPoint.y, 6, 0, Math.PI * 2);
        ctx.stroke();
        // 瀛愬脊閫熷害鏂瑰悜(绾㈢澶?
        if (r.bulletVel) {
          const sp = Math.hypot(r.bulletVel.x, r.bulletVel.y);
          if (sp > 0.01) {
            const ux = r.bulletVel.x / sp, uy = r.bulletVel.y / sp;
            ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(r.hitPoint.x, r.hitPoint.y);
            ctx.lineTo(r.hitPoint.x + ux * 40, r.hitPoint.y + uy * 40);
            ctx.stroke();
          }
        }
        // 瀹為檯鏂藉姞鐨勫啿鍑诲悜閲?缁跨澶?甯﹀亸缃?
        if (r.lastForce) {
          ctx.strokeStyle = 'lime'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(r.hitPoint.x, r.hitPoint.y);
          ctx.lineTo(r.hitPoint.x + r.lastForce.x * 60, r.hitPoint.y + r.lastForce.y * 60);
          ctx.stroke();
        }
        // 鍛戒腑閮ㄤ綅鍚嶇О
        const partName = r.hitPart === r.hat ? 'HAT' : r.hitPart === r.head ? 'HEAD' : r.hitPart === r.torso ? 'TORSO' :
          r.hitPart === r.armL ? 'ARM-L' : r.hitPart === r.armR ? 'ARM-R' :
          r.hitPart === r.upperLegL ? 'UPLEG-L' : r.hitPart === r.upperLegR ? 'UPLEG-R' :
          r.hitPart === r.legL ? 'LOWLEG-L' : r.hitPart === r.legR ? 'LOWLEG-R' : '?';
        ctx.fillStyle = 'white'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
        ctx.font = 'bold 12px monospace';
        ctx.strokeText(partName, r.torso.position.x + 18, r.torso.position.y - 22);
        ctx.fillText(partName, r.torso.position.x + 18, r.torso.position.y - 22);
        // 瑙掕壊鏍囩
        ctx.fillStyle = 'yellow'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
        ctx.font = 'bold 11px monospace';
        const label = L.label || look;
        ctx.strokeText(label, r.torso.position.x + 18, r.torso.position.y - 36);
        ctx.fillText(label, r.torso.position.x + 18, r.torso.position.y - 36);
        // 绾块€熷害 & 瑙掗€熷害
        const v = Math.hypot(r.torso.velocity.x, r.torso.velocity.y);
        const ang = r.torso.angularVelocity;
        const info1 = `v=${v.toFixed(2)}`;
        const info2 = `蠅=${ang.toFixed(2)}`;
        ctx.font = '11px monospace';
        ctx.strokeText(info1, r.torso.position.x + 18, r.torso.position.y - 6);
        ctx.fillText(info1, r.torso.position.x + 18, r.torso.position.y - 6);
        ctx.strokeText(info2, r.torso.position.x + 18, r.torso.position.y + 8);
        ctx.fillText(info2, r.torso.position.x + 18, r.torso.position.y + 8);
      }
    }
  }

  function drawEnemies() {
    for (const ed of enemyData) drawRagdoll(ed);
    if (playerRagdoll) drawPlayerRagdoll(playerRagdoll);
  }

  function drawPlayerRagdollLegacy(r) {
    // 1) 鑵?鈥?娣辫鐨￥
    for (const leg of r.allLegs) {
      drawRectBody(leg, '#3a2418');
    }
    // 2) 涓嬭吙搴曢儴鍔犻粦闈?
    for (const leg of [r.lowerLegL, r.lowerLegR]) {
      ctx.save();
      ctx.translate(leg.position.x, leg.position.y);
      ctx.rotate(leg.angle);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(-leg.propW / 2, leg.propH / 2 - 2.5, leg.propW, 2.5);
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(-leg.propW / 2, leg.propH / 2 - 2.5, leg.propW * 0.6, 0.6);
      ctx.restore();
    }
    // 3) 韬共 鈥?闀块粦椋庤。
    drawRectBody(r.torso, '#1a1a1a');
    // 缈婚 V 瀛?+ 鐧借‖琛?鐢诲湪韬共鍧愭爣绯诲唴)
    ctx.save();
    ctx.translate(r.torso.position.x, r.torso.position.y);
    ctx.rotate(r.torso.angle);
    const tw = r.torso.propW, th = r.torso.propH;
    // 鏆楃紳杈?
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-tw / 2 + 0.5, -th / 2); ctx.lineTo(-tw / 2 + 0.5, th / 2);
    ctx.moveTo( tw / 2 - 0.5, -th / 2); ctx.lineTo( tw / 2 - 0.5, th / 2);
    ctx.stroke();
    // 涓嚎
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-0.4, -th / 2, 0.8, th);
    // 缈婚 V
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.moveTo(-tw / 2, -th / 2); ctx.lineTo(0, -th / 2); ctx.lineTo(0, -th / 2 + 6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo( tw / 2, -th / 2); ctx.lineTo(0, -th / 2); ctx.lineTo(0, -th / 2 + 6);
    ctx.closePath();
    ctx.fill();
    // 鐧借‖琛笁瑙?
    ctx.fillStyle = '#e8e0d0';
    ctx.beginPath();
    ctx.moveTo(-1.5, -th / 2); ctx.lineTo(1.5, -th / 2); ctx.lineTo(0, -th / 2 + 5);
    ctx.closePath();
    ctx.fill();
    // 鑵板甫
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-tw / 2, -2, tw, 3);
    ctx.fillStyle = '#7a4a22';
    ctx.fillRect(-tw / 2, -2, tw, 0.5);
    // 閲戞墸
    ctx.fillStyle = '#d9b260';
    ctx.fillRect(-2.2, -3, 4.4, 5);
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 0.4;
    ctx.strokeRect(-2.2, -3, 4.4, 5);
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(-1.2, -2, 2.4, 3);
    ctx.restore();

    // 4) 鎵嬭噦 鈥?榛戦琛ｈ
    for (const arm of r.allArms) drawRectBody(arm, '#1a1a1a');

    // 5) 澶?鈥?鑴?+ 鑳″瓙
    drawSquareFace(r.head.position.x, r.head.position.y, r.head.circleRadius, r.head.angle);
    // 寮犻夯瀛愯儭瀛?闅忓ご鏃嬭浆)
    ctx.save();
    ctx.translate(r.head.position.x, r.head.position.y);
    ctx.rotate(r.head.angle);
    const hr = r.head.circleRadius;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-hr * 0.72, -hr * 0.05);
    ctx.quadraticCurveTo(-hr * 0.32, hr * 0.30, -hr * 0.05, hr * 0.18);
    ctx.quadraticCurveTo(0, hr * 0.10, hr * 0.05, hr * 0.18);
    ctx.quadraticCurveTo(hr * 0.32, hr * 0.30, hr * 0.72, -hr * 0.05);
    ctx.quadraticCurveTo(hr * 0.60, hr * 0.10, hr * 0.30, hr * 0.20);
    ctx.quadraticCurveTo(hr * 0.10, hr * 0.25, 0, hr * 0.18);
    ctx.quadraticCurveTo(-hr * 0.10, hr * 0.25, -hr * 0.30, hr * 0.20);
    ctx.quadraticCurveTo(-hr * 0.60, hr * 0.10, -hr * 0.72, -hr * 0.05);
    ctx.fill();
    ctx.restore();

    // 6) 绀煎附(fedora,瀹芥獝,闅忓ご鏃嬭浆)
    ctx.save();
    ctx.translate(r.head.position.x, r.head.position.y);
    ctx.rotate(r.head.angle);
    const hr2 = r.head.circleRadius;
    // 甯介《(鍦嗛《)
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-hr2 * 0.95, -hr2 * 1.5);
    ctx.lineTo(-hr2 * 1.05, -hr2 * 2.15);
    ctx.quadraticCurveTo(0, -hr2 * 2.55, hr2 * 1.05, -hr2 * 2.15);
    ctx.lineTo(hr2 * 0.95, -hr2 * 1.5);
    ctx.closePath();
    ctx.fill();
    // 甯介《楂樺厜
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.moveTo(-hr2 * 0.85, -hr2 * 1.95);
    ctx.quadraticCurveTo(-hr2 * 0.55, -hr2 * 2.30, -hr2 * 0.20, -hr2 * 2.20);
    ctx.lineTo(-hr2 * 0.20, -hr2 * 1.95);
    ctx.quadraticCurveTo(-hr2 * 0.55, -hr2 * 2.05, -hr2 * 0.85, -hr2 * 1.95);
    ctx.closePath();
    ctx.fill();
    // 甯藉甫
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-hr2 * 0.95, -hr2 * 1.60, hr2 * 1.90, hr2 * 0.18);
    // 甯藉甫鎵?
    ctx.fillStyle = '#d9b260';
    ctx.fillRect(-hr2 * 0.10, -hr2 * 1.66, hr2 * 0.20, hr2 * 0.24);
    // 甯芥獝(瀹?
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(0, -hr2 * 1.30, hr2 * 1.85, hr2 * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    // 甯芥獝涓婃部楂樺厜
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-hr2 * 1.75, -hr2 * 1.50, hr2 * 3.50, hr2 * 0.06);
    ctx.restore();

    // 7) 鏋粛鎻″湪鍙虫墜涓?闅忔墜鑷傜敥鍔?鏄庣‘杩欐槸鎸佹灙涓昏)
    const handOffset = M.Vector.rotate({ x: 0, y: r.armR.propH * 0.55 }, r.armR.angle);
    const handX = r.armR.position.x + handOffset.x;
    const handY = r.armR.position.y + handOffset.y;
    const gunAngle = r.armR.angle + Math.PI / 2;
    const gunTipX = handX + Math.cos(gunAngle) * 22;
    const gunTipY = handY + Math.sin(gunAngle) * 22;
    // 鏋(閽?
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(gunTipX, gunTipY); ctx.stroke();
    // 鏋楂樺厜
    ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    const hx1 = handX + Math.cos(gunAngle) * 4;
    const hy1 = handY + Math.sin(gunAngle) * 4;
    ctx.beginPath(); ctx.moveTo(hx1, hy1); ctx.lineTo(gunTipX, gunTipY); ctx.stroke();
    // 鏈ㄨ川鎻℃妸(鍨傜洿浜庢灙绠℃柟鍚戠殑灏忓渾)
    const gripAngle = gunAngle + Math.PI / 2;
    const gripX = handX + Math.cos(gripAngle) * 4;
    const gripY = handY + Math.sin(gripAngle) * 4;
    ctx.fillStyle = '#5a3a1a';

  function drawZhangMask(x, y, halfSize, angle = 0) {
    const w = halfSize * 1.72;
    const h = halfSize * 1.84;
    const corner = halfSize * 0.16;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 榛戣壊缁戝甫浠庨夯灏嗙墝闈㈠叿涓や晶闇插嚭銆?
    ctx.fillStyle = '#111';
    ctx.fillRect(-w * 0.61, -halfSize * 0.12, w * 1.22, halfSize * 0.22);

    ctx.fillStyle = '#eee4cf';
    ctx.strokeStyle = '#201b17';
    ctx.lineWidth = Math.max(1, halfSize * 0.09);
    ctx.beginPath();
    ctx.moveTo(-w / 2 + corner, -h / 2);
    ctx.lineTo(w / 2 - corner, -h / 2);
    ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + corner);
    ctx.lineTo(w / 2, h / 2 - corner);
    ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - corner, h / 2);
    ctx.lineTo(-w / 2 + corner, h / 2);
    ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - corner);
    ctx.lineTo(-w / 2, -h / 2 + corner);
    ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + corner, -h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 涔濈瓛寮?3脳3 鍦嗙偣锛涗笂鎺掍袱渚у姞娣变綔涓鸿绾垮瓟銆?
    const gridX = halfSize * 0.34;
    const gridY = halfSize * 0.34;
    const ringR = Math.max(1.05, halfSize * 0.095);
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        const dotX = (col - 1) * gridX;
        const dotY = (row - 1) * gridY + halfSize * 0.04;
        const isEye = row === 0 && col !== 1;
        ctx.beginPath();
        ctx.arc(dotX, dotY, isEye ? ringR * 1.15 : ringR, 0, Math.PI * 2);
        if (isEye) {
          ctx.fillStyle = '#090909';
          ctx.fill();
        } else {
          ctx.strokeStyle = row === 1 && col === 1 ? '#222' : '#9e2f2b';
          ctx.lineWidth = Math.max(0.8, ringR * 0.52);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawZhangHat(x, y, halfSize, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const brimY = -halfSize * 0.88;
    ctx.fillStyle = '#080808';
    ctx.beginPath();
    ctx.ellipse(0, brimY, halfSize * 1.52, halfSize * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#191919';
    ctx.strokeStyle = '#050505';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-halfSize * 0.72, brimY);
    ctx.lineTo(-halfSize * 0.58, -halfSize * 1.52);
    ctx.quadraticCurveTo(0, -halfSize * 1.78, halfSize * 0.58, -halfSize * 1.52);
    ctx.lineTo(halfSize * 0.72, brimY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#4b241b';
    ctx.fillRect(-halfSize * 0.68, -halfSize * 1.04, halfSize * 1.36, halfSize * 0.14);
    ctx.restore();
  }

  function drawRevolver(handX, handY, angle, scale = 1) {
    const barrelLen = REVOLVER_MUZZLE_LENGTH * scale;
    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(angle);

    // 鏈ㄨ川鎻℃妸銆?
    ctx.fillStyle = '#623b24';
    ctx.strokeStyle = '#24140d';
    ctx.lineWidth = 0.8 * scale;
    ctx.beginPath();
    ctx.moveTo(1 * scale, 1 * scale);
    ctx.lineTo(7 * scale, 3 * scale);
    ctx.lineTo(5 * scale, 10 * scale);
    ctx.lineTo(0, 8 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 宸﹁疆鏋韩銆佽浆杞笌缁嗛暱鏋銆?
    ctx.fillStyle = '#30343a';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 0.8 * scale;
    ctx.beginPath();
    const gunTop = -3.1 * scale;
    const gunBottom = 2.1 * scale;
    const gunCorner = 1.4 * scale;
    ctx.moveTo(gunCorner, gunTop);
    ctx.lineTo(barrelLen - gunCorner, gunTop);
    ctx.quadraticCurveTo(barrelLen, gunTop, barrelLen, gunTop + gunCorner);
    ctx.lineTo(barrelLen, gunBottom - gunCorner);
    ctx.quadraticCurveTo(barrelLen, gunBottom, barrelLen - gunCorner, gunBottom);
    ctx.lineTo(gunCorner, gunBottom);
    ctx.quadraticCurveTo(0, gunBottom, 0, gunBottom - gunCorner);
    ctx.lineTo(0, gunTop + gunCorner);
    ctx.quadraticCurveTo(0, gunTop, gunCorner, gunTop);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#515861';
    ctx.beginPath();
    ctx.arc(7 * scale, 0.4 * scale, 4.1 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#202329';
    ctx.beginPath();
    ctx.arc(7 * scale, 0.4 * scale, 1.3 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#747b84';
    ctx.lineWidth = 0.7 * scale;
    ctx.beginPath();
    ctx.moveTo(10 * scale, -1.7 * scale);
    ctx.lineTo((barrelLen - 2 * scale), -1.7 * scale);
    ctx.stroke();

    // 鎵虫満鎶ゅ湀鍜岄粦鑹叉灙鍙ｃ€?
    ctx.strokeStyle = '#24272c';
    ctx.lineWidth = 1.1 * scale;
    ctx.beginPath();
    ctx.arc(8 * scale, 3 * scale, 3 * scale, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(barrelLen, -0.5 * scale, 1.2 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    return {
      x: handX + Math.cos(angle) * barrelLen,
      y: handY + Math.sin(angle) * barrelLen,
    };
  }

      ctx.strokeStyle = '#9a7440';
      ctx.lineWidth = 1.2 * s;
      ctx.beginPath();
      ctx.arc(cx - 8 * s, baseY - 25 * s, 5 * s, 0.15 * Math.PI, 1.25 * Math.PI);
      ctx.stroke();
    }

    // 椹韩銆?
    ctx.fillStyle = '#613820';
    ctx.strokeStyle = '#2b1a10';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.ellipse(cx - 2 * s, baseY - 34 * s, 39 * s, 18 * s, -0.03, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(205,137,76,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx - 10 * s, baseY - 39 * s, 22 * s, 7 * s, -0.12, 0, Math.PI * 2);
    ctx.fill();

    // 椹鍜屽ご閮ㄣ€?
    ctx.fillStyle = '#613820';
    ctx.beginPath();
    ctx.moveTo(cx + 22 * s, baseY - 41 * s);
    ctx.quadraticCurveTo(cx + 30 * s, baseY - 62 * s, cx + 39 * s, baseY - 63 * s);
    ctx.lineTo(cx + 48 * s, baseY - 53 * s);
    ctx.quadraticCurveTo(cx + 36 * s, baseY - 43 * s, cx + 31 * s, baseY - 28 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.save();
    ctx.translate(cx + 43 * s, baseY - 61 * s);
    ctx.rotate(-0.20);
    ctx.fillStyle = '#684027';
    ctx.beginPath();
    ctx.ellipse(0, 0, 15 * s, 9 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 鑰虫湹銆?
    ctx.fillStyle = '#5b321e';
    ctx.beginPath();
    ctx.moveTo(-6 * s, -7 * s);
    ctx.lineTo(-8 * s, -16 * s);
    ctx.lineTo(-1 * s, -8 * s);
    ctx.closePath();
    ctx.moveTo(3 * s, -8 * s);
    ctx.lineTo(6 * s, -16 * s);
    ctx.lineTo(9 * s, -7 * s);
    ctx.closePath();
    ctx.fill();
    // 鐪肩潧銆侀蓟瀛斾笌缂扮怀銆?
    ctx.fillStyle = '#070707';
    ctx.beginPath();
    ctx.arc(3 * s, -2 * s, 1.6 * s, 0, Math.PI * 2);
    ctx.arc(12 * s, 2 * s, 1.2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#842d24';
    ctx.lineWidth = 1.8 * s;
    ctx.beginPath();
    ctx.moveTo(-4 * s, -7 * s);
    ctx.lineTo(8 * s, 7 * s);
    ctx.moveTo(6 * s, -8 * s);
    ctx.lineTo(13 * s, 5 * s);
    ctx.stroke();
    ctx.restore();

    // 榛戣壊楝冩瘺銆?
    ctx.strokeStyle = '#24150e';
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(cx + 27 * s, baseY - 45 * s);
    ctx.quadraticCurveTo(cx + 28 * s, baseY - 59 * s, cx + 36 * s, baseY - 68 * s);
    ctx.stroke();

    // 椹瀺鍜屽瀭涓嬬殑缂扮怀銆?
    ctx.fillStyle = '#742f27';
    ctx.strokeStyle = '#321713';
    ctx.lineWidth = 1.2 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 16 * s, baseY - 49 * s);
    ctx.quadraticCurveTo(cx, baseY - 57 * s, cx + 15 * s, baseY - 48 * s);
    ctx.lineTo(cx + 10 * s, baseY - 38 * s);
    ctx.lineTo(cx - 13 * s, baseY - 39 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#3d2419';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(cx + 2 * s, baseY - 48 * s);
    ctx.quadraticCurveTo(cx + 28 * s, baseY - 47 * s, cx + 50 * s, baseY - 56 * s);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    if (!player.alive) return;
    const cx = player.footX;
    const baseY = player.footY;
    const s = PLAYER_SCALE;
    const shoulderX = cx + PLAYER_GUN_SHOULDER_X;
    const shoulderY = baseY - PLAYER_GUN_SHOULDER_Y;
    const a = Math.atan2(mouseY - shoulderY, mouseX - shoulderX);

    // 杩戜晶鑵匡細楂嬮儴鍧愮ǔ椹瀺锛屽ぇ鑵垮悜鍓嶃€佽啙鐩栧集鏇层€侀澊灏栬俯杩涢┈闀€?
    ctx.strokeStyle = '#211b18';
    ctx.lineWidth = 7 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + 2 * s, baseY - 58 * s);
    ctx.lineTo(cx + 18 * s, baseY - 43 * s);
    ctx.lineTo(cx + 12 * s, baseY - 27 * s);
    ctx.stroke();
    ctx.strokeStyle = '#080808';
    ctx.lineWidth = 8 * s;
    ctx.beginPath();
    ctx.moveTo(cx + 12 * s, baseY - 30 * s);
    ctx.lineTo(cx + 18 * s, baseY - 25 * s);
    ctx.stroke();
    ctx.strokeStyle = '#b1894d';
    ctx.lineWidth = 1.3 * s;
    ctx.beginPath();
    ctx.arc(cx + 16 * s, baseY - 25 * s, 5.4 * s, -0.1 * Math.PI, 1.05 * Math.PI);
    ctx.stroke();

    // 涓婅韩鐣ュ井鍓嶅€撅紝閲嶅績钀藉湪椹瀺涓婏紝鑰屼笉鏄洿绔嬬珯鍦ㄩ┈鑳屻€?
    ctx.fillStyle = '#26323a';
    ctx.beginPath();
    ctx.moveTo(cx - 9 * s, baseY - 88 * s);
    ctx.lineTo(cx + 17 * s, baseY - 88 * s);
    ctx.lineTo(cx + 13 * s, baseY - 58 * s);
    ctx.lineTo(cx - 14 * s, baseY - 58 * s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#151a1e';
    ctx.beginPath();
    ctx.moveTo(cx - 1 * s, baseY - 87 * s);
    ctx.lineTo(cx + 9 * s, baseY - 87 * s);
    ctx.lineTo(cx + 4 * s, baseY - 59 * s);
    ctx.lineTo(cx - 4 * s, baseY - 59 * s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#762d29';
    ctx.beginPath();
    ctx.moveTo(cx - 1 * s, baseY - 87 * s);
    ctx.lineTo(cx + 9 * s, baseY - 87 * s);
    ctx.lineTo(cx + 4 * s, baseY - 79 * s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4b2c20';
    ctx.fillRect(cx - 14 * s, baseY - 64 * s, 28 * s, 3 * s);
    ctx.fillStyle = '#aa8547';
    ctx.fillRect(cx - 2 * s, baseY - 65 * s, 4 * s, 5 * s);

    const handX = shoulderX + Math.cos(a) * PLAYER_GUN_ARM_LENGTH;
    const handY = shoulderY + Math.sin(a) * PLAYER_GUN_ARM_LENGTH;
    const supportHandX = handX + Math.cos(a) * 12 * s;
    const supportHandY = handY + Math.sin(a) * 12 * s;

    // 宸﹁噦鎵樹綇姝ユ灙鍓嶇銆?
    const freeShoulderX = cx - 5 * s;
    const freeShoulderY = baseY - 79 * s;
    ctx.strokeStyle = '#26323a';
    ctx.lineWidth = 7 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(freeShoulderX, freeShoulderY);
    ctx.lineTo(supportHandX, supportHandY);
    ctx.stroke();
    ctx.fillStyle = '#d7aa7d';
    ctx.beginPath();
    ctx.arc(supportHandX, supportHandY, 3.5 * s, 0, Math.PI * 2);
    ctx.fill();

    // 鍙宠噦鎻′綇鎵虫満浣嶇疆銆?
    ctx.strokeStyle = '#26323a';
    ctx.lineWidth = 8 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(handX, handY);
    ctx.stroke();
    ctx.fillStyle = '#d7aa7d';
    ctx.beginPath();
    ctx.arc(handX, handY, 4 * s, 0, Math.PI * 2);
    ctx.fill();
    const gunMuzzle = drawLongRifle(handX, handY, a, s);

    // 闈㈠叿涓庢繁鑹插妾愬附銆?
    drawZhangMask(cx + 4 * s, baseY - 101 * s, 13 * s, 0);
    drawZhangHat(cx + 4 * s, baseY - 101 * s, 13 * s, 0);

    muzzle.x = gunMuzzle.x;
    muzzle.y = gunMuzzle.y;
    muzzle.angle = a;
  }

  function drawMuzzleFlashEffects() {
    const now = performance.now();
    for (let i = muzzleFlashEffects.length - 1; i >= 0; i--) {
      const effect = muzzleFlashEffects[i];
      const age = now - effect.birth;
      if (age >= effect.duration) {
        muzzleFlashEffects.splice(i, 1);
        continue;
      }

      const dx = Math.cos(effect.angle);
      const dy = Math.sin(effect.angle);
      const px = -dy;
      const py = dx;
      const flashT = Math.min(1, age / 95);
      const flashAlpha = Math.max(0, 1 - flashT);
      const flashScale = effect.size * (0.82 + flashT * 0.55);

      if (flashAlpha > 0) {
        ctx.save();
        ctx.translate(effect.x, effect.y);
        ctx.rotate(effect.angle);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = flashAlpha;

        const glow = ctx.createRadialGradient(2, 0, 0, 2, 0, 20 * flashScale);
        glow.addColorStop(0, 'rgba(255,255,220,0.95)');
        glow.addColorStop(0.32, 'rgba(255,209,76,0.58)');
        glow.addColorStop(1, 'rgba(255,104,20,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(2, 0, 20 * flashScale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff7bb';
        ctx.strokeStyle = '#e76119';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-2, 0);
        ctx.lineTo(7 * flashScale, -5.5 * flashScale);
        ctx.lineTo(9 * flashScale, -2.2 * flashScale);
        ctx.lineTo(23 * flashScale, 0);
        ctx.lineTo(9 * flashScale, 2.2 * flashScale);
        ctx.lineTo(7 * flashScale, 5.5 * flashScale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ff9d22';
        ctx.beginPath();
        ctx.moveTo(1, 0);
        ctx.lineTo(12 * flashScale, -2.2 * flashScale);
        ctx.lineTo(18 * flashScale, 0);
        ctx.lineTo(12 * flashScale, 2.2 * flashScale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = flashAlpha * 0.9;
        ctx.strokeStyle = '#ffd45c';
        ctx.lineCap = 'round';
        for (const spark of effect.sparks) {
          const sparkAngle = effect.angle + spark.angleOffset;
          const travel = spark.distance * (0.35 + flashT * 0.65);
          const sx = effect.x + Math.cos(sparkAngle) * travel;
          const sy = effect.y + Math.sin(sparkAngle) * travel;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(
            sx - Math.cos(sparkAngle) * spark.length,
            sy - Math.sin(sparkAngle) * spark.length
          );
          ctx.stroke();
        }
        ctx.restore();
      }

      for (const puff of effect.smoke) {
        const puffAge = age - 24 - puff.delay;
        if (puffAge <= 0) continue;
        const t = Math.min(1, puffAge / 190);
        const alpha = 0.34 * (1 - t);
        const forward = puff.forward + t * 14;
        const spread = puff.spread * (0.45 + t);
        const x = effect.x + dx * forward + px * spread;
        const y = effect.y + dy * forward + py * spread - puff.rise * t;
        const radius = puff.size * (0.65 + t * 1.15);
        const smokeGlow = ctx.createRadialGradient(x, y, 0, x, y, radius);
        smokeGlow.addColorStop(0, `rgba(245,238,211,${alpha})`);
        smokeGlow.addColorStop(0.55, `rgba(119,112,100,${alpha * 0.72})`);
        smokeGlow.addColorStop(1, 'rgba(72,68,62,0)');
        ctx.fillStyle = smokeGlow;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      const r = b.r;
      // 灏捐抗:浠嶇劧鐢诲揩閫熷皬鎷栧熬(姗欑孩,闀垮害 4 甯?
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        const a = (i + 1) / b.trail.length * 0.55;
        ctx.fillStyle = `rgba(180, 60, 30, ${a})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }
      // 涓诲脊:鏈夊浘灏辩敾鍥?绠ご鏈濊繍鍔ㄦ柟鍚?
      if (propImages.bullet.loaded) {
        const entry = propImages.bullet;
        const target = r * 2 * (entry.visualScale || 1);
        // 瀛愬脊鍥鹃粯璁ゆ湞鍚?姝ｄ笂"(tip 鍦ㄥ浘鍍?y 鏈€灏忓)
        // 璁?tip 瀵瑰噯杩愬姩鏂瑰悜:rotation = atan2(vy, vx) + 蟺/2
        const ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
        if (entry.contentBbox) {
          const bb = entry.contentBbox;
          const scale = Math.min(target / bb.w, target / bb.h);
          const dw = bb.w * scale, dh = bb.h * scale;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(ang);
          ctx.drawImage(entry.img, bb.x, bb.y, bb.w, bb.h, -dw / 2, -dh / 2, dw, dh);
          ctx.restore();
        } else {
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(ang);
          drawImageContained(entry.img, target, target);
          ctx.restore();
        }
      } else {
        // 閫€璺?绋嬪簭缁樺埗(榛戝簳姗欏湀+鐧介珮鍏?
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#d96f32'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(b.x - 1.5, b.y - 1.5, 1.4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawCrosshair() {
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 9, 0, Math.PI * 2);
    ctx.moveTo(mouseX - 16, mouseY); ctx.lineTo(mouseX - 5, mouseY);
    ctx.moveTo(mouseX + 5, mouseY);  ctx.lineTo(mouseX + 16, mouseY);
    ctx.moveTo(mouseX, mouseY - 16); ctx.lineTo(mouseX, mouseY - 5);
    ctx.moveTo(mouseX, mouseY + 5);  ctx.lineTo(mouseX, mouseY + 16);
    ctx.stroke();
  }

  function draw() {
    // 1) 灞忓箷闇囧姩:鎶婃暣涓敾闈㈡姈鍔ㄤ竴涓?
    const sh = getShakeOffset();
    const shX = Math.round(sh.x), shY = Math.round(sh.y);
    ctx.save();
    ctx.translate(shX, shY);

    drawBackground();
    drawPlatforms();
    drawRopes();        // 缁冲瓙(鐢诲湪閬撳叿鍓?杩欐牱鐙肩墮鐞冧細鐩栦綇缁冲瓙鏈)
    drawProps();        // 閬撳叿
    drawPlayerHorse();
    drawEnemies();      // 鏁屼汉(鍦ㄩ亾鍏峰墠,杩欐牱鏈ㄥ伓鍊掑湪閬撳叿涓婃椂鏈ㄥ伓鍦ㄥ墠闈?
    drawMerchantCoins();
    drawCharacterHitEffects();
    drawPlayer();
    drawMuzzleFlashEffects();
    drawBullets();
    drawExplosions();   // 鐖嗙偢鐗规晥(鐢诲湪鏈€涓婂眰)
    drawBoomTexts();    // BOOM 鏂囧瓧(鍦ㄧ垎鐐哥幆涔嬩笂)
    drawCrosshair();

    ctx.restore();

    // 2) 灞忓箷闂厜(涓嶅彈闇囧姩褰卞搷,鐩存帴鐩栧湪鏈€涓婂眰)
    drawFlashOverlay();
  }

  // ====== 閲嶅惎 ======
  function restart() {
    overlay.classList.remove('show');
    AudioFX.firstShotPlayed = false;
    if (AudioFX.voiceAudio) {
      AudioFX.voiceAudio.pause();
      AudioFX.voiceAudio.currentTime = 0;
    }
    for (const b of bullets) M.Composite.remove(world, b.body);
    bullets = [];
    shotsLeft = SHOTS_PER_LEVEL;
    outOfAmmoSince = 0;
    updateBulletsUI();
    layout();
  }
  window.restart = restart;

  // ====== 鍚姩 ======
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(restart, 120);
  });
  layout();

  function loop() {
    try {
      if (gameStarted) update();
      draw();
    }
    catch (e) { console.error('[loop error]', e); if (!loop._errored) { loop._errored = true; alert('娓告垙鍑洪敊: ' + e.message); } }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
